<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>贝雷梁重量计算器</title>
    <!-- 更新为贝雷梁标准桁架图：上下弦、三竖杆、八根斜腹杆形成两个菱形 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'%3E%3Cline x1='5' y1='15' x2='45' y2='15' stroke='%232563eb' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='5' y1='35' x2='45' y2='35' stroke='%232563eb' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='5' y1='15' x2='5' y2='35' stroke='%232563eb' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='25' y1='15' x2='25' y2='35' stroke='%232563eb' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='45' y1='15' x2='45' y2='35' stroke='%232563eb' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='5' y1='25' x2='15' y2='15' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='15' y1='15' x2='25' y2='25' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='25' y1='25' x2='15' y2='35' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='15' y1='35' x2='5' y2='25' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='25' y1='25' x2='35' y2='15' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='35' y1='15' x2='45' y2='25' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='45' y1='25' x2='35' y2='35' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='35' y1='35' x2='25' y2='25' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='5' cy='15' r='2.5' fill='%232563eb'/%3E%3Ccircle cx='25' cy='15' r='2.5' fill='%232563eb'/%3E%3Ccircle cx='45' cy='15' r='2.5' fill='%232563eb'/%3E%3Ccircle cx='5' cy='35' r='2.5' fill='%232563eb'/%3E%3Ccircle cx='25' cy='35' r='2.5' fill='%232563eb'/%3E%3Ccircle cx='45' cy='35' r='2.5' fill='%232563eb'/%3E%3C/svg%3E" />
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            padding: 24px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---------- 主容器 ---------- */
        .app-container {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 32px 36px 40px;
            transition: all 0.2s;
        }

        /* ---------- 头部 ---------- */
        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 20px;
            flex-wrap: wrap;
        }
        .header-icon {
            flex-shrink: 0;
            width: 56px;
            height: 56px;
            background: #eef4ff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .header-icon svg {
            width: 100%;
            height: 100%;
        }
        .header-title h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b2a4a;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .header-title .sub {
            font-size: 14px;
            color: #64748b;
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        /* ---------- 输入卡片 ---------- */
        .input-card {
            background: #f8fafc;
            border-radius: 18px;
            padding: 24px 28px 28px;
            margin-bottom: 32px;
            border: 1px solid #e2e8f0;
            transition: border 0.2s;
        }
        .input-card:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 24px;
            margin-bottom: 16px;
        }
        .form-row:last-child {
            margin-bottom: 0;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 180px;
            min-width: 140px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .form-group label .hint {
            font-weight: 400;
            color: #94a3b8;
            font-size: 12px;
        }
        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 1.5px solid #d1d9e6;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
            transition: border 0.2s, box-shadow 0.2s;
            width: 100%;
            color: #0f172a;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .form-group input::placeholder {
            color: #abb7cc;
            font-size: 14px;
            font-weight: 400;
        }

        .radio-group {
            display: flex;
            gap: 6px 18px;
            flex-wrap: wrap;
            padding-top: 2px;
        }
        .radio-group label {
            font-weight: 400;
            font-size: 14px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 12px 6px 6px;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .radio-group label:hover {
            background: #eef2f6;
        }
        .radio-group input[type="radio"] {
            accent-color: #2563eb;
            width: 16px;
            height: 16px;
            margin: 0;
            flex-shrink: 0;
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }
        .btn {
            padding: 10px 32px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            letter-spacing: 0.3px;
            min-height: 48px;
            justify-content: center;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.30);
        }
        .btn-primary:active {
            transform: translateY(0px);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .btn-secondary {
            background: #e9edf2;
            color: #334155;
        }
        .btn-secondary:hover {
            background: #dce1e8;
        }

        .input-hint {
            font-size: 13px;
            color: #64748b;
            background: #f1f5f9;
            padding: 8px 14px;
            border-radius: 8px;
            margin-top: 8px;
            line-height: 1.6;
            border-left: 3px solid #94a3b8;
        }
        .input-hint code {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            color: #0f172a;
        }

        /* ---------- 结果区域 ---------- */
        .result-area {
            margin-top: 8px;
        }
        .result-placeholder {
            text-align: center;
            color: #94a3b8;
            padding: 48px 20px;
            font-size: 16px;
            background: #fafcff;
            border-radius: 16px;
            border: 2px dashed #dce1e8;
        }
        .result-placeholder .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ---------- 结果表格 ---------- */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 8px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 520px;
        }
        .result-table th,
        .result-table td {
            padding: 10px 16px;
            text-align: center;
            border-bottom: 1px solid #e9edf2;
        }
        .result-table th {
            background: #f1f5f9;
            font-weight: 600;
            color: #1e293b;
            font-size: 13px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .result-table td {
            color: #1e293b;
        }
        .result-table tr:last-child td {
            border-bottom: none;
        }
        .result-table .title-row td {
            font-size: 17px;
            font-weight: 700;
            color: #0b2a4a;
            background: #f8fafc;
            padding: 14px 16px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #d1d9e6;
        }
        .result-table .sub-title-row td {
            font-size: 13px;
            color: #475569;
            background: #fafcff;
            padding: 6px 16px;
            font-weight: 500;
            border-bottom: 2px solid #d1d9e6;
        }
        .result-table .total-row td {
            font-weight: 700;
            background: #eef4ff;
            border-top: 2px solid #2563eb;
            font-size: 15px;
            color: #0b2a4a;
        }
        .result-table .total-row td:last-child {
            color: #2563eb;
            font-size: 17px;
        }
        .result-table .data-row td:first-child {
            text-align: left;
            padding-left: 20px;
            font-weight: 500;
        }
        .result-table .data-row td:not(:first-child) {
            text-align: center;
        }
        .result-table .zero-qty {
            color: #94a3b8;
        }

        .result-summary {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
            padding: 16px 24px;
            background: #f1f5f9;
            border-radius: 14px;
            flex-wrap: wrap;
        }
        .result-summary .total-weight {
            font-size: 22px;
            font-weight: 700;
            color: #0b2a4a;
        }
        .result-summary .total-weight span {
            color: #2563eb;
            font-size: 26px;
        }
        .result-summary .detail-info {
            font-size: 14px;
            color: #475569;
        }

        /* ---------- 错误提示 ---------- */
        .error-msg {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px 18px;
            border-radius: 10px;
            border-left: 4px solid #dc2626;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        /* ---------- 手机端适配 (增强) ---------- */
        @media (max-width: 700px) {
            .app-container {
                padding: 18px 14px 28px;
                border-radius: 16px;
            }
            .header {
                gap: 12px;
                padding-bottom: 14px;
            }
            .header-icon {
                width: 44px;
                height: 44px;
            }
            .header-title h1 {
                font-size: 20px;
            }
            .header-title .sub {
                font-size: 12px;
            }
            .input-card {
                padding: 16px 14px 20px;
            }
            .form-row {
                gap: 12px;
            }
            .radio-group {
                gap: 4px 12px;
            }
            .radio-group label {
                padding: 4px 8px 4px 4px;
                font-size: 13px;
            }
            .btn {
                padding: 8px 20px;
                font-size: 14px;
                flex: 1 1 auto;
                min-height: 44px;
            }
            .form-actions {
                flex-direction: column;
                gap: 10px;
            }
            .form-actions .btn {
                width: 100%;
                justify-content: center;
            }
            .result-table {
                font-size: 12px;
                min-width: 400px;
            }
            .result-table th,
            .result-table td {
                padding: 6px 10px;
            }
            .result-table .title-row td {
                font-size: 14px;
                padding: 10px 12px;
            }
            .result-summary {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                gap: 8px;
                padding: 14px 16px;
            }
            .result-summary .total-weight {
                font-size: 18px;
            }
            .result-summary .total-weight span {
                font-size: 22px;
            }
            .input-hint {
                font-size: 12px;
                padding: 6px 12px;
            }
            .input-hint code {
                font-size: 12px;
            }
        }

        /* 手机窄屏下，三个选择器垂直堆叠，清晰易点 */
        @media (max-width: 600px) {
            .form-group {
                flex: 1 1 100%;
                min-width: unset;
            }
            .radio-group {
                gap: 4px 16px;
            }
            .radio-group label {
                padding: 6px 12px 6px 6px;
                flex: 1 0 auto;
            }
            .result-table {
                font-size: 11px;
                min-width: 320px;
            }
            .result-table th,
            .result-table td {
                padding: 4px 6px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px 6px;
            }
            .app-container {
                padding: 12px 8px 20px;
                border-radius: 12px;
            }
            .header-title h1 {
                font-size: 17px;
            }
            .header-title .sub {
                font-size: 11px;
            }
            .result-table {
                font-size: 10px;
                min-width: 280px;
            }
            .result-table th,
            .result-table td {
                padding: 3px 4px;
            }
        }

        /* ---------- 滚动条美化 ---------- */
        .table-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ---------- 打印优化 ---------- */
        @media print {
            body {
                background: #fff;
                padding: 12px;
            }
            .app-container {
                box-shadow: none;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 20px;
            }
            .btn,
            .form-actions {
                display: none !important;
            }
            .input-card {
                border: 1px solid #ccc;
                background: #f9f9f9;
            }
            .result-placeholder {
                border: 1px solid #ccc;
            }
            .result-table .title-row td {
                background: #f0f0f0;
            }
            .result-table .total-row td {
                background: #f0f4ff;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- ====== 头部 ====== -->
        <header class="header">
            <div class="header-icon" aria-hidden="true">
                <!-- 贝雷梁标准桁架图：上下弦、三竖杆、八根斜腹杆形成两个菱形 -->
                <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                    <line x1="5" y1="15" x2="45" y2="15" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                    <line x1="5" y1="35" x2="45" y2="35" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                    <line x1="5" y1="15" x2="5" y2="35" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                    <line x1="25" y1="15" x2="25" y2="35" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                    <line x1="45" y1="15" x2="45" y2="35" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                    <line x1="5" y1="25" x2="15" y2="15" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="15" y1="15" x2="25" y2="25" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="25" y1="25" x2="15" y2="35" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="15" y1="35" x2="5" y2="25" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="25" y1="25" x2="35" y2="15" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="35" y1="15" x2="45" y2="25" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="45" y1="25" x2="35" y2="35" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="35" y1="35" x2="25" y2="25" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="5" cy="15" r="2.5" fill="#2563eb"/>
                    <circle cx="25" cy="15" r="2.5" fill="#2563eb"/>
                    <circle cx="45" cy="15" r="2.5" fill="#2563eb"/>
                    <circle cx="5" cy="35" r="2.5" fill="#2563eb"/>
                    <circle cx="25" cy="35" r="2.5" fill="#2563eb"/>
                    <circle cx="45" cy="35" r="2.5" fill="#2563eb"/>
                </svg>
            </div>
            <div class="header-title">
                <h1>贝雷梁重量计算器</h1>
                <div class="sub">Bailey Bridge Weight Calculator · 支持多组跨度组合</div>
            </div>
        </header>

        <!-- ====== 输入卡片 ====== -->
        <div class="input-card">
            <!-- 错误提示 -->
            <div class="error-msg" id="errorMsg"></div>

            <!-- 第一行：长度输入（已移除预填值，改为占位提示） -->
            <div class="form-row">
                <div class="form-group" style="flex:3; min-width:240px;">
                    <label for="lenInput">长度组合 <span class="hint">(逗号分隔)</span></label>
                    <input type="text" id="lenInput" placeholder="例如: 3-450, 6-900, 12, 9-0" />
                </div>
            </div>

            <!-- 第二行：三个选择器（支撑架、结构类型、层数）放在同一行 -->
            <div class="form-row">
                <div class="form-group" style="flex:1; min-width:140px;">
                    <label>支撑架 <span class="hint">(默认)</span></label>
                    <div class="radio-group" id="supGroup">
                        <label><input type="radio" name="supType" value="450" checked /> 450mm</label>
                        <label><input type="radio" name="supType" value="900" /> 900mm</label>
                    </div>
                </div>
                <div class="form-group" style="flex:1; min-width:140px;">
                    <label>结构类型</label>
                    <div class="radio-group" id="strGroup">
                        <label><input type="radio" name="strType" value="normal" checked /> 普通型</label>
                        <label><input type="radio" name="strType" value="heavy" /> 加强型</label>
                    </div>
                </div>
                <div class="form-group" style="flex:1; min-width:140px;">
                    <label>层数</label>
                    <div class="radio-group" id="layerGroup">
                        <label><input type="radio" name="layerType" value="single" checked /> 单层</label>
                        <label><input type="radio" name="layerType" value="double" /> 双层</label>
                    </div>
                </div>
            </div>

            <!-- 第三行：按钮单独一行 -->
            <div class="form-row" style="margin-top: 4px;">
                <div class="form-actions" style="width:100%; border-top: none; padding-top:0; margin-top:0;">
                    <button class="btn btn-primary" id="calcBtn">计算</button>
                    <button class="btn btn-secondary" id="resetBtn">重置</button>
                </div>
            </div>

            <!-- 提示 -->
            <div class="input-hint">
                <strong>格式说明：</strong>
                每组用 <code>长度-支撑架</code> 表示，逗号分隔。
                <code>-450</code> / <code>-900</code> 指定支撑架，<code>-0</code> 表示单排（无支撑架）。
                不写后缀则使用上方默认值。 示例：<code>3-450,6-900,12,9-0</code>
            </div>
        </div>

        <!-- ====== 结果区域 ====== -->
        <div class="result-area" id="resultArea">
            <div class="result-placeholder" id="placeholder">
                <span class="big-icon">📐</span>
                输入长度组合后点击「计算」<br />
                将显示贝雷梁各构件数量及重量汇总
            </div>
            <div id="resultContent" style="display:none;">
                <div class="table-wrapper" id="tableWrapper"></div>
                <div class="result-summary" id="summaryBar"></div>
            </div>
        </div>

        <!-- ====== 底部 ====== -->
        <div style="margin-top:28px; text-align:center; font-size:13px; color:#94a3b8; border-top:1px solid #e9edf2; padding-top:18px;">
            ⚙️ 移植自 AutoCAD LISP · 贝雷梁重量计算 (BLL) &nbsp;·&nbsp; 仅用于工程参考
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const lenInput = document.getElementById('lenInput');
            const calcBtn = document.getElementById('calcBtn');
            const resetBtn = document.getElementById('resetBtn');
            const errorMsg = document.getElementById('errorMsg');
            const placeholder = document.getElementById('placeholder');
            const resultContent = document.getElementById('resultContent');
            const tableWrapper = document.getElementById('tableWrapper');
            const summaryBar = document.getElementById('summaryBar');

            // ---------- 工具函数 ----------
            function fmtLen(n) {
                if (Number.isInteger(n)) return String(n);
                return n.toFixed(1);
            }

            // 拆分长度：返回 [n3, n15, n1]
            function splitLen(L) {
                const eps = 1e-6;
                let n3Max = Math.floor(L / 3.0);
                let found = false;
                let n3 = n3Max,
                    n15 = 0,
                    n1 = 0;

                while (n3 >= 0 && !found) {
                    let rem = L - n3 * 3.0;
                    if (rem >= 0) {
                        let n15Max = Math.floor(rem / 1.5);
                        n15 = n15Max;
                        while (n15 >= 0 && !found) {
                            let rem2 = rem - n15 * 1.5;
                            n1 = Math.round(rem2);
                            if (Math.abs(rem2 - n1) < eps) {
                                found = true;
                            } else {
                                n15--;
                            }
                        }
                    }
                    if (!found) n3--;
                }
                if (!found) return [0, 0, 0];
                return [n3, n15, n1];
            }

            // 解析输入字符串 -> [{ len, spec }]
            function parseInput(str, defaultSpec) {
                const items = [];
                const parts = str.split(',').filter(s => s.trim() !== '');
                for (let p of parts) {
                    p = p.trim();
                    let lenVal, specVal;
                    if (p.includes('-')) {
                        const seg = p.split('-');
                        if (seg.length !== 2) return null;
                        lenVal = parseFloat(seg[0].trim());
                        specVal = parseInt(seg[1].trim(), 10);
                        if (isNaN(lenVal) || lenVal <= 0) return null;
                        if (isNaN(specVal) || (specVal !== 0 && specVal !== 450 && specVal !== 900)) return null;
                    } else {
                        lenVal = parseFloat(p);
                        if (isNaN(lenVal) || lenVal <= 0) return null;
                        specVal = defaultSpec;
                    }
                    items.push({ len: lenVal, spec: specVal });
                }
                if (items.length === 0) return null;
                return items;
            }

            // ---------- 主计算函数 ----------
            function calculate(items, supType, strType, layerType) {
                // 参数
                const layerMult = (layerType === 'double') ? 2 : 1;
                const isHeavy = (strType === 'heavy');

                // 初始化统计变量
                let q3 = 0,
                    q15 = 0,
                    q1 = 0;
                let qStr3 = 0,
                    qStr15 = 0,
                    qStr1 = 0;
                let qStrBolts = 0;
                let qPins = 0;
                let qSup450 = 0,
                    qSup900 = 0;
                let qSupBolts = 0;

                let w3 = 0,
                    w15 = 0,
                    w1 = 0;
                let wStr3 = 0,
                    wStr15 = 0,
                    wStr1 = 0;
                let wStrBolts = 0;
                let wPins = 0;
                let wSup450 = 0,
                    wSup900 = 0;
                let wSupBolts = 0;

                let hasDouble = false;
                let singleRowSupports = 0;

                // 遍历每组
                for (let item of items) {
                    const lenVal = item.len;
                    const specVal = item.spec;

                    const [n3, n15, n1] = splitLen(lenVal);
                    const totalPanelsSingle = n3 + n15 + n1;
                    const rankPanels = (specVal === 0) ? 1 : 2;

                    // ----- 1. 贝雷片 -----
                    const factorBeam = layerMult * rankPanels;
                    q3 += factorBeam * n3;
                    q15 += factorBeam * n15;
                    q1 += factorBeam * n1;
                    w3 += factorBeam * n3 * 270.0;
                    w15 += factorBeam * n15 * 200.0;
                    w1 += factorBeam * n1 * 150.0;

                    // ----- 2. 加强弦杆 (与层数无关，只与排数有关) -----
                    if (isHeavy) {
                        const strFactor = 2 * rankPanels;
                        qStr3 += strFactor * n3;
                        qStr15 += strFactor * n15;
                        qStr1 += strFactor * n1;
                        wStr3 += strFactor * n3 * 80.0;
                        wStr15 += strFactor * n15 * 60.0;
                        wStr1 += strFactor * n1 * 50.0;
                        // 弦杆螺栓：每根2颗
                        const strBoltsAdd = 2 * strFactor * totalPanelsSingle;
                        qStrBolts += strBoltsAdd;
                    }

                    // ----- 3. 双层连接螺栓 -----
                    if (layerMult === 2) {
                        const layerBolts = 2 * rankPanels * totalPanelsSingle;
                        qStrBolts += layerBolts;
                    }

                    // ----- 4. 销子 -----
                    if (totalPanelsSingle > 1) {
                        const node = totalPanelsSingle - 1;
                        const basePins = node * rankPanels * 2;
                        let extraPins = isHeavy ? basePins : 0;
                        let singlePins = basePins + extraPins;
                        let totalPins;
                        if (layerMult === 1) {
                            totalPins = singlePins;
                        } else {
                            if (isHeavy) {
                                totalPins = basePins + singlePins;
                            } else {
                                totalPins = 2 * basePins;
                            }
                        }
                        qPins += totalPins;
                        wPins += totalPins * 3.0;
                    }

                    // ----- 5. 支撑架 & 支撑架螺栓 (双排) -----
                    if (specVal !== 0) {
                        hasDouble = true;
                        let qSupportCommon = 2 + (totalPanelsSingle - 1);
                        qSupportCommon = qSupportCommon * layerMult;
                        if (specVal === 450) {
                            qSup450 += qSupportCommon;
                            wSup450 += qSupportCommon * 21.5;
                        } else { // 900
                            qSup900 += qSupportCommon;
                            wSup900 += qSupportCommon * 43.0;
                        }
                        qSupBolts += 4 * qSupportCommon;
                        wSupBolts += 4 * qSupportCommon * 0.7;
                    } else {
                        // 单排：记录用于混搭修正
                        singleRowSupports += (2 + (totalPanelsSingle - 1));
                    }
                }

                // ----- 6. 混搭修正 (单排额外螺栓) -----
                if (hasDouble && singleRowSupports > 0) {
                    qSupBolts += singleRowSupports * 2;
                    wSupBolts += singleRowSupports * 2 * 0.7;
                }

                // ----- 7. 弦杆螺栓重量 -----
                wStrBolts = qStrBolts * 2.7;

                // ----- 8. 汇总 -----
                const totalW = w3 + w15 + w1 + wSup450 + wSup900 +
                    wStr3 + wStr15 + wStr1 + wStrBolts + wPins + wSupBolts;

                return {
                    q3,
                    q15,
                    q1,
                    qStr3,
                    qStr15,
                    qStr1,
                    qStrBolts,
                    qPins,
                    qSup450,
                    qSup900,
                    qSupBolts,
                    w3,
                    w15,
                    w1,
                    wStr3,
                    wStr15,
                    wStr1,
                    wStrBolts,
                    wPins,
                    wSup450,
                    wSup900,
                    wSupBolts,
                    totalW,
                    hasDouble,
                    singleRowSupports,
                    layerMult,
                    isHeavy,
                    itemCount: items.length,
                    spanList: items.map(it => fmtLen(it.len) + 'm' + (it.spec === 0 ? '(单排)' : (it.spec === 450 ?
                        '(450)' : '(900)'))).join('、')
                };
            }

            // ---------- 渲染表格 ----------
            function renderResult(result, items, supType, strType, layerType) {
                const layerDesc = (layerType === 'double') ? '双层' : '单层';
                const typeDesc = (strType === 'heavy') ? '加强型' : '普通型';
                const groupCount = items.length;

                // 构建数据行 (只显示数量>0 或 总重>0 的行，但保留所有行让用户看到完整信息)
                const rows = [
                    { name: '贝雷片 3M', qty: result.q3, unitW: '270', totalW: result.w3 },
                    { name: '贝雷片 1.5M', qty: result.q15, unitW: '200', totalW: result.w15 },
                    { name: '贝雷片 1M', qty: result.q1, unitW: '150', totalW: result.w1 },
                    { name: '支撑架 450MM', qty: result.qSup450, unitW: '21.5', totalW: result.wSup450 },
                    { name: '支撑架 900MM', qty: result.qSup900, unitW: '43', totalW: result.wSup900 },
                    { name: '加强弦杆 1M', qty: result.qStr1, unitW: '50', totalW: result.wStr1 },
                    { name: '加强弦杆 1.5M', qty: result.qStr15, unitW: '60', totalW: result.wStr15 },
                    { name: '加强弦杆 3M', qty: result.qStr3, unitW: '80', totalW: result.wStr3 },
                    { name: '销子', qty: result.qPins, unitW: '3', totalW: result.wPins },
                    { name: '弦杆螺栓', qty: result.qStrBolts, unitW: '2.7', totalW: result.wStrBolts },
                    { name: '支撑架螺栓', qty: result.qSupBolts, unitW: '0.7', totalW: result.wSupBolts },
                ];

                // 过滤掉数量为0且总重为0的行 (但保留支撑架和螺栓等可能为0但重要的行)
                // 为与原LISP一致，我们显示所有行，但数量为0的用灰色显示
                const filteredRows = rows;

                // 构建表格HTML
                let html = `<table class="result-table">
                    <tbody>
                        <!-- 标题行 -->
                        <tr class="title-row">
                            <td colspan="4">${groupCount}组 ${layerDesc} ${typeDesc} 贝雷梁组合构件重量汇总表</td>
                        </tr>
                        <!-- 子标题行 -->
                        <tr class="sub-title-row">
                            <td colspan="4">${result.spanList}</td>
                        </tr>
                        <!-- 表头 -->
                        <tr>
                            <th>构件名称</th>
                            <th>总数量</th>
                            <th>单重 (kg)</th>
                            <th>总重量 (kg)</th>
                        </tr>`;

                // 数据行
                for (let r of filteredRows) {
                    const qtyVal = r.qty;
                    const totalVal = r.totalW;
                    const isZero = (qtyVal === 0 && totalVal === 0);
                    const qtyStr = String(qtyVal);
                    const totalStr = totalVal.toFixed(1);
                    const cls = isZero ? 'data-row zero-qty' : 'data-row';
                    html += `<tr class="${cls}">
                        <td>${r.name}</td>
                        <td>${qtyStr}</td>
                        <td>${r.unitW}</td>
                        <td>${totalStr}</td>
                    </tr>`;
                }

                // 总重行
                html += `<tr class="total-row">
                    <td colspan="3"><strong>总 重</strong></td>
                    <td>${result.totalW.toFixed(2)}</td>
                </tr>
                </tbody></table>`;

                tableWrapper.innerHTML = html;

                // 汇总栏
                let supInfo = '';
                if (result.qSup450 > 0 && result.qSup900 > 0) {
                    supInfo = `450mm×${result.qSup450}  +  900mm×${result.qSup900}`;
                } else if (result.qSup450 > 0) {
                    supInfo = `450mm×${result.qSup450}`;
                } else if (result.qSup900 > 0) {
                    supInfo = `900mm×${result.qSup900}`;
                } else {
                    supInfo = '无支撑架 (单排)';
                }

                summaryBar.innerHTML = `
                    <span class="detail-info">支撑架：${supInfo}</span>
                    <span class="detail-info">销子：${result.qPins} 颗 &nbsp;|&nbsp; 弦杆螺栓：${result.qStrBolts} 颗 &nbsp;|&nbsp; 支撑架螺栓：${result.qSupBolts} 颗</span>
                    <span class="total-weight">总重量：<span>${result.totalW.toFixed(2)}</span> kg</span>
                `;

                // 显示结果
                placeholder.style.display = 'none';
                resultContent.style.display = 'block';
            }

            // ---------- 主流程 ----------
            function doCalculate() {
                // 隐藏错误
                errorMsg.classList.remove('show');
                errorMsg.textContent = '';

                // 获取输入
                const rawStr = lenInput.value.trim();
                if (!rawStr) {
                    showError('请输入长度组合。');
                    return;
                }

                // 获取选项
                const supType = document.querySelector('input[name="supType"]:checked')?.value || '450';
                const strType = document.querySelector('input[name="strType"]:checked')?.value || 'normal';
                const layerType = document.querySelector('input[name="layerType"]:checked')?.value || 'single';

                const defaultSpec = parseInt(supType, 10);

                // 解析输入
                const items = parseInput(rawStr, defaultSpec);
                if (!items) {
                    showError('输入格式有误，请检查。示例：3-450, 6-900, 12, 9-0');
                    return;
                }

                // 检查长度是否合法 (每个长度 > 0)
                for (let it of items) {
                    if (it.len <= 0) {
                        showError('长度必须大于0。');
                        return;
                    }
                }

                // 计算
                const result = calculate(items, supType, strType, layerType);

                // 渲染
                renderResult(result, items, supType, strType, layerType);
            }

            function showError(msg) {
                errorMsg.textContent = '⚠️ ' + msg;
                errorMsg.classList.add('show');
                // 隐藏结果
                placeholder.style.display = 'block';
                resultContent.style.display = 'none';
            }

            // ---------- 重置 ----------
            function doReset() {
                // 重置输入框为空（仅保留占位符）
                lenInput.value = '';
                document.querySelector('input[name="supType"][value="450"]').checked = true;
                document.querySelector('input[name="strType"][value="normal"]').checked = true;
                document.querySelector('input[name="layerType"][value="single"]').checked = true;
                errorMsg.classList.remove('show');
                errorMsg.textContent = '';
                placeholder.style.display = 'block';
                resultContent.style.display = 'none';
                tableWrapper.innerHTML = '';
                summaryBar.innerHTML = '';
            }

            // ---------- 自动计算（首次加载，若输入为空则静默等待） ----------
            function autoCalculate() {
                setTimeout(() => {
                    // 如果输入框有内容则自动计算，否则显示占位符
                    if (lenInput.value.trim() !== '') {
                        doCalculate();
                    } else {
                        // 确保显示占位符
                        placeholder.style.display = 'block';
                        resultContent.style.display = 'none';
                    }
                }, 100);
            }

            // ---------- 绑定事件 ----------
            calcBtn.addEventListener('click', doCalculate);
            resetBtn.addEventListener('click', doReset);

            // 回车触发计算
            lenInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doCalculate();
                }
            });

            // 输入框获得焦点时自动选中内容
            lenInput.addEventListener('focus', function() {
                this.select();
            });

            // ---------- 启动 ----------
            autoCalculate();

        })();
    </script>

</body>
</html>
