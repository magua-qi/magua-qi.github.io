<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词记忆练习</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237b1fa2'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        /* ================================================================
           全局重置 & 基础布局
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #f5f0f8;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        /* ================================================================
           主容器
           ================================================================ */
        .app-container {
            max-width: 820px;
            width: 100%;
            height: 100%;
            max-height: 92vh;
            min-height: 480px;
            background: #ffffff;
            border-radius: 10px;
            padding: 10px 10px 12px;
            box-shadow: 0 8px 32px rgba(106, 13, 173, 0.12);
            border: 1px solid #ede7f6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: padding 0.2s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* ===== 顶栏 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 6px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 25px;
            height: 25px;
            background: #7b1fa2;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            flex-shrink: 0;
            user-select: none;
            transition: background 0.3s ease;
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            color: #4a148c;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            background: #f3e5f5;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            flex-shrink: 0;
            border: 1px solid #e1bee7;
            transition: background 0.3s ease, border-color 0.3s ease;
            min-height: 52px;
            z-index: 10;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .toolbar-left label {
            font-size: 13px;
            font-weight: 600;
            color: #6a1b9a;
            white-space: nowrap;
            transition: color 0.3s ease;
        }
        .toolbar-left select {
            padding: 6px 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            background: #ffffff;
            color: #4a148c;
            outline: none;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            min-width: 140px;
            max-width: 200px;
            transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
            height: 36px;
        }
        .toolbar-left select optgroup {
            font-weight: 700;
            color: #6a1b9a;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .ctrl-btn {
            padding: 5px 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ede7f6;
            color: #4a148c;
            border: 1px solid #d1c4e9;
            white-space: nowrap;
            height: 36px;
        }
        .ctrl-btn:hover {
            background: #d1c4e9;
            transform: scale(1.02);
        }
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        .ctrl-btn.primary {
            background: linear-gradient(135deg, #7b1fa2, #9c27b0);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(106, 27, 154, 0.25);
        }
        .ctrl-btn.primary:hover {
            box-shadow: 0 6px 20px rgba(106, 27, 154, 0.35);
        }
        .ctrl-btn.secondary {
            background: #fff3e0;
            border-color: #ffcc80;
            color: #e65100;
        }
        .ctrl-btn.secondary:hover {
            background: #ffe0b2;
        }
        .ctrl-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none;
        }

        /* ===== 词库选择面板 ===== */
        .lib-selector-wrapper {
            flex-shrink: 0;
            background: #faf5ff;
            border-radius: 10px;
            border: 1px solid #ede7f6;
            margin-bottom: 6px;
            padding: 4px 8px;
            transition: background 0.3s, border-color 0.3s;
            max-height: 40vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .lib-selector-wrapper .lib-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            cursor: pointer;
            user-select: none;
            gap: 8px;
            flex-shrink: 0;
        }
        .lib-selector-wrapper .lib-header .lib-title {
            font-size: 13px;
            font-weight: 600;
            color: #4a148c;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lib-selector-wrapper .lib-header .lib-title .arrow {
            font-size: 12px;
            transition: transform 0.2s;
            display: inline-block;
        }
        .lib-selector-wrapper .lib-header .lib-title .arrow.open {
            transform: rotate(90deg);
        }
        .lib-selector-wrapper .lib-header .lib-title .lib-stats {
            font-weight: 400;
            color: #6a1b9a;
            font-size: 12px;
            margin-left: 4px;
        }
        .lib-selector-wrapper .lib-body {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0 8px;
            display: none;
            flex-direction: column;
            max-height: 40vh;
        }
        .lib-selector-wrapper .lib-body.open {
            display: flex;
        }
        .lib-selector-wrapper .lib-body .tree-container {
            flex: 1;
            overflow-y: auto;
        }
        .lib-selector-wrapper .lib-body .lib-actions {
            display: flex;
            gap: 8px;
            padding: 8px 0 4px;
            border-top: 1px solid #ede7f6;
            margin-top: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .lib-selector-wrapper .lib-body .lib-actions button {
            padding: 4px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: #ede7f6;
            color: #4a148c;
            transition: background 0.2s;
            height: 32px;
            min-width: 60px;
        }
        .lib-selector-wrapper .lib-body .lib-actions button:hover {
            background: #d1c4e9;
        }
        .lib-selector-wrapper .lib-body .lib-actions .btn-confirm {
            background: #7b1fa2;
            color: #fff;
        }
        .lib-selector-wrapper .lib-body .lib-actions .btn-confirm:hover {
            background: #6a1b9a;
        }

        .lib-selector-wrapper .lib-body .tree-item {
            padding-left: 0;
            border-left: none;
            margin-left: 0;
        }
        .lib-selector-wrapper .lib-body .tree-node {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0 3px 8px;
            font-size: 13px;
            color: #1a1a2e;
            position: relative;
        }
        .lib-selector-wrapper .lib-body .tree-node .node-checkbox {
            width: 16px;
            height: 16px;
            accent-color: #7b1fa2;
            cursor: pointer;
            flex-shrink: 0;
        }
        .lib-selector-wrapper .lib-body .tree-node .node-label {
            flex: 1;
            word-break: break-all;
            cursor: default;
        }
        .lib-selector-wrapper .lib-body .tree-node .node-label .path-suffix {
            color: #999;
            font-size: 11px;
        }
        .lib-selector-wrapper .lib-body .tree-node.folder {
            font-weight: 600;
            color: #4a148c;
        }
        .lib-selector-wrapper .lib-body .tree-node.folder .node-label {
            font-weight: 600;
        }
        .lib-selector-wrapper .lib-body .tree-node::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e1bee7;
            opacity: 0.5;
        }
        .lib-selector-wrapper .lib-body .tree-item:last-child>.tree-node::before {
            height: 50%;
            bottom: auto;
        }
        .lib-selector-wrapper .lib-body .tree-item:only-child>.tree-node::before {
            display: none;
        }
        .lib-selector-wrapper .lib-body .tree-item .tree-item {
            padding-left: 20px;
        }
        .lib-selector-wrapper .lib-body .tree-item .tree-item .tree-node::before {
            left: -4px;
        }

        @media (prefers-color-scheme: dark) {
            .lib-selector-wrapper {
                background: #2a2a44;
                border-color: #3d3d5c;
            }
            .lib-selector-wrapper .lib-header .lib-title {
                color: #c9a8e6;
            }
            .lib-selector-wrapper .lib-header .lib-title .lib-stats {
                color: #b39ddb;
            }
            .lib-selector-wrapper .lib-body .tree-node {
                color: #e8e0f0;
            }
            .lib-selector-wrapper .lib-body .tree-node.folder {
                color: #c9a8e6;
            }
            .lib-selector-wrapper .lib-body .tree-node .node-checkbox {
                accent-color: #9c4dcc;
            }
            .lib-selector-wrapper .lib-body .tree-node .node-label .path-suffix {
                color: #777;
            }
            .lib-selector-wrapper .lib-body .tree-node::before {
                background: #5d3d7a;
            }
            .lib-selector-wrapper .lib-body .lib-actions {
                border-top-color: #3d3d5c;
            }
            .lib-selector-wrapper .lib-body .lib-actions button {
                background: #3d3d5c;
                color: #c9a8e6;
            }
            .lib-selector-wrapper .lib-body .lib-actions button:hover {
                background: #5d3d7a;
            }
            .lib-selector-wrapper .lib-body .lib-actions .btn-confirm {
                background: #7b1fa2;
                color: #fff;
            }
            .lib-selector-wrapper .lib-body .lib-actions .btn-confirm:hover {
                background: #9c4dcc;
            }
        }

        /* ================================================================
           预览面板（展开时隐藏单词卡片和键盘）
           ================================================================ */
        .preview-panel {
            display: none;
            flex-shrink: 0;
            background: #faf5ff;
            border-radius: 10px;
            padding: 0 16px;
            margin-bottom: 6px;
            border: 1px solid #ede7f6;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .preview-panel.open {
            display: flex;
            flex-direction: column;
            flex: 999 1 0;
            padding: 12px 16px;
            border-color: #ede7f6;
            min-height: 0;
        }
        .preview-panel.open~.word-card,
        .preview-panel.open~.keyboard {
            display: none;
        }

        .preview-panel .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #ede7f6;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 4px 8px;
            flex-shrink: 0;
        }
        .preview-panel .preview-title {
            font-size: 14px;
            font-weight: 700;
            color: #4a148c;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .preview-panel .preview-count {
            font-size: 12px;
            color: #6a1b9a;
            font-weight: 600;
            background: #f3e5f5;
            padding: 0 10px;
            border-radius: 12px;
            line-height: 24px;
        }
        .preview-panel .preview-list {
            flex: 1 1 0;
            overflow-y: auto;
            padding-right: 2px;
            min-height: 0;
        }
        .preview-panel .preview-list::-webkit-scrollbar {
            width: 4px;
        }
        .preview-panel .preview-list::-webkit-scrollbar-track {
            background: #f3e5f5;
            border-radius: 4px;
        }
        .preview-panel .preview-list::-webkit-scrollbar-thumb {
            background: #ce93d8;
            border-radius: 4px;
        }
        .preview-panel .preview-group {
            margin-bottom: 6px;
        }
        .preview-panel .preview-group:last-child {
            margin-bottom: 0;
        }
        .preview-panel .preview-group .group-title {
            font-size: 12px;
            font-weight: 600;
            color: #7b1fa2;
            padding: 2px 0 2px 4px;
            border-bottom: 1px dashed #e1bee7;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .preview-panel .preview-group .group-title .group-count {
            font-weight: 400;
            font-size: 11px;
            color: #999;
        }
        .preview-panel .preview-item {
            display: flex;
            align-items: center;
            gap: 6px 12px;
            padding: 2px 0 2px 8px;
            font-size: 13px;
            border-bottom: 1px solid #f8f0fa;
            flex-wrap: wrap;
        }
        .preview-panel .preview-item:last-child {
            border-bottom: none;
        }
        .preview-panel .preview-item .pword {
            font-weight: 700;
            color: #1a1a2e;
            min-width: 60px;
        }
        .preview-panel .preview-item .pphonetic {
            color: #6a1b9a;
            font-size: 12px;
            min-width: 60px;
            font-family: 'Segoe UI', 'Times New Roman', serif;
        }
        .preview-panel .preview-item .pmeaning {
            color: #4a148c;
            flex: 1;
            font-size: 13px;
        }
        .preview-panel .preview-empty {
            color: #999;
            text-align: center;
            padding: 16px 0;
            font-size: 14px;
        }

        /* 预览面板 - 深色模式 */
        @media (prefers-color-scheme: dark) {
            .preview-panel {
                background: #24243e;
                border-color: #3d3d5c;
            }
            .preview-panel.open {
                border-color: #3d3d5c;
            }
            .preview-panel .preview-header {
                border-bottom-color: #3d3d5c;
            }
            .preview-panel .preview-title {
                color: #c9a8e6;
            }
            .preview-panel .preview-count {
                color: #b39ddb;
                background: #2a2a44;
            }
            .preview-panel .preview-list::-webkit-scrollbar-track {
                background: #2a2a44;
            }
            .preview-panel .preview-list::-webkit-scrollbar-thumb {
                background: #5d3d7a;
            }
            .preview-panel .preview-group .group-title {
                color: #b39ddb;
                border-bottom-color: #3d3d5c;
            }
            .preview-panel .preview-group .group-title .group-count {
                color: #777;
            }
            .preview-panel .preview-item {
                border-bottom-color: #2a2a44;
            }
            .preview-panel .preview-item .pword {
                color: #e8e0f0;
            }
            .preview-panel .preview-item .pphonetic {
                color: #b39ddb;
            }
            .preview-panel .preview-item .pmeaning {
                color: #c9a8e6;
            }
            .preview-panel .preview-empty {
                color: #777;
            }
        }

        /* ===== 统计栏 ===== */
        .stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            background: #f3e5f5;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 6px;
            gap: 4px 12px;
            border: 1px solid #e1bee7;
            flex-shrink: 0;
            min-height: 44px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .stat-item {
            font-size: 13px;
            font-weight: 600;
            color: #4a148c;
            white-space: nowrap;
            transition: color 0.3s ease;
        }
        .stat-item .value {
            background: rgba(255, 255, 255, 0.7);
            padding: 0 8px;
            border-radius: 10px;
            font-weight: 700;
            color: #311b92;
            display: inline-block;
            min-width: 36px;
            text-align: center;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .stat-item .value.time {
            min-width: 52px;
        }
        .progress-wrap {
            flex: 1;
            min-width: 60px;
            height: 7px;
            background: #d1c4e9;
            border-radius: 10px;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7b1fa2, #ab47bc);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* ================================================================
           单词卡片
           ================================================================ */
        .word-card {
            background: #faf5ff;
            border-radius: 10px;
            padding: 24px 16px 12px;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.8), 0 4px 16px rgba(106, 27, 154, 0.08);
            margin-bottom: 8px;
            border: 1px solid #ede7f6;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            overflow: hidden;
            transition: padding 0.2s ease, min-height 0.2s ease, background 0.3s ease, border-color 0.3s ease;
        }

        .word-blanks-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 0;
            flex-shrink: 0;
        }
        .word-blanks {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px 3px;
            padding: 2px 0;
            will-change: transform, opacity;
        }
        .word-blanks.animate-in {
            animation: fadeSlideIn 0.3s ease-out forwards;
        }
        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 50px;
            font-size: 34px;
            font-weight: 700;
            border-radius: 10px;
            background: #ffffff;
            border: 2.5px solid #ce93d8;
            color: #1a1a2e;
            transition: all 0.2s ease;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            user-select: none;
            flex-shrink: 0;
        }
        .letter-slot.blank {
            border-color: #9c27b0;
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .letter-slot.blank::after {
            content: '_';
            color: #7b1fa2;
            font-weight: 300;
            opacity: 0.7;
        }
        .letter-slot.blank.filled {
            border-color: #2e7d32;
            background: #e8f5e9;
            color: #1b5e20;
        }
        .letter-slot.blank.filled::after {
            content: none;
        }
        .letter-slot.blank.wrong {
            border-color: #c62828;
            background: #ffebee;
            color: #b71c1c;
            animation: shake 0.35s ease;
        }
        .letter-slot.blank.wrong::after {
            content: none;
        }
        .letter-slot.blank.active {
            border-color: #7b1fa2;
            background: #ede7f6;
            box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.15);
            transform: scale(1.05);
        }
        .letter-slot.fixed {
            border-color: transparent;
            background: transparent;
            color: #1a1a2e;
            width: 36px;
            height: 46px;
            font-size: 34px;
        }
        .letter-slot.fixed::after {
            content: none;
        }
        .letter-slot.fixed.space {
            opacity: 0.3;
            background: transparent;
            border-color: transparent;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-5px);
            }
            40% {
                transform: translateX(5px);
            }
            60% {
                transform: translateX(-3px);
            }
            80% {
                transform: translateX(3px);
            }
        }

        .word-info {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 500;
            color: #4a148c;
            gap: 4px;
            flex-wrap: wrap;
            text-align: center;
            min-height: 28px;
            flex-shrink: 0;
            padding: 18px 0 12px;
            transition: color 0.3s ease, padding 0.2s ease;
        }
        .word-info .phonetic {
            font-family: 'Segoe UI', 'Times New Roman', serif;
            color: #6a1b9a;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        .word-info .meaning {
            font-weight: 600;
            color: #4a148c;
            transition: color 0.3s ease;
        }
        .word-info .divider {
            color: #ce93d8;
            font-weight: 300;
            margin: 0 2px;
            transition: color 0.3s ease;
        }

        .feedback {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            min-height: 24px;
            padding: 4px 0 0;
            color: #4a148c;
            margin-top: 18px;
            flex-shrink: 0;
            transition: color 0.3s ease, margin-top 0.2s ease;
        }
        .feedback.success {
            color: #1b5e20;
        }
        .feedback.error {
            color: #b71c1c;
        }
        .feedback.info {
            color: #e65100;
        }
        .error-msg {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 10px;

        /* ================================================================
           键盘区域
           ================================================================ */
        .keyboard {
            background: #f3e5f5;
            border-radius: 10px;
            padding: 8px 8px 6px;
            border: 1px solid #e1bee7;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: padding 0.2s ease, min-height 0.2s ease, background 0.3s ease, border-color 0.3s ease;
        }
        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }
        .kb-row:last-child {
            margin-bottom: 0;
        }
        .kb-key {
            flex: 1 1 0;
            min-width: 0;
            height: 64px;
            border: none;
            border-radius: 10px;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04), inset 0 1px 2px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.12s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 1px solid #d1c4e9;
            touch-action: manipulation;
        }
        .kb-key:active {
            transform: scale(0.92);
            background: #ede7f6;
        }
        .kb-key.special {
            flex: 1.5 1 0;
            background: #ede7f6;
            font-size: 16px;
            color: #4a148c;
        }
        .kb-key.special:active {
            background: #d1c4e9;
        }
        .kb-key.function {
            height: 38px;
            font-size: 15px;
            background: #ede7f6;
            border-color: #d1c4e9;
            flex: 1;
            border-radius: 10px;
            color: #4a148c;
        }
        .kb-key.function:active {
            background: #d1c4e9;
        }
        .kb-key.function.mode-btn {
            flex: 1.2;
            background: #e1bee7;
            border-color: #ce93d8;
            font-weight: 600;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
        }
        .kb-key.function.mode-btn.active {
            background: #7b1fa2;
            color: #fff;
            border-color: #7b1fa2;
            box-shadow: 0 2px 8px rgba(106, 27, 154, 0.3);
        }
        .kb-key.function.mode-btn.locked,
        .kb-key.function.locked {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }
        .kb-key.function.start-btn {
            flex: 1.3;
            background: linear-gradient(135deg, #7b1fa2, #9c27b0);
            color: #fff;
            border: none;
            box-shadow: 0 2px 8px rgba(106, 27, 154, 0.3);
        }
        .kb-key.function.start-btn:active {
            transform: scale(0.92);
        }
        .kb-key.function.start-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .kb-key.function.intensive-toggle {
            flex: 1.2;
            background: #e0e0e0;
            border-color: #bdbdbd;
            color: #555;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        .kb-key.function.intensive-toggle.on {
            background: #ffcc80;
            border-color: #ff9800;
            color: #e65100;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.3);
        }
        .kb-key.function.intensive-toggle.locked {
            opacity: 0.4;
            pointer-events: none;
        }
        .kb-key.correct-highlight {
            background: #c8e6c9;
            border-color: #2e7d32;
        }
        .kb-key.wrong-highlight {
            background: #ffcdd2;
            border-color: #c62828;
        }

        /* ===== 完成界面 ===== */
        .complete-overlay {
            text-align: center;
            padding: 20px 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .complete-overlay .big-icon {
            font-size: 0;
        }
        .complete-overlay h2 {
            font-size: 22px;
            color: #4a148c;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        .complete-overlay p {
            font-size: 15px;
            color: #6a1b9a;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        .complete-overlay .final-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 12px 0 16px;
            flex-wrap: wrap;
        }
        .complete-overlay .final-stats .num {
            font-size: 28px;
            font-weight: 800;
            color: #7b1fa2;
            display: block;
            transition: color 0.3s ease;
        }
        .complete-overlay .final-stats .label {
            font-size: 12px;
            color: #6a1b9a;
            opacity: 0.7;
            transition: color 0.3s ease;
        }
        .hidden {
            display: none !important;
        }

<body>
    <div class="app-container" id="app">
        <!-- 顶栏 -->
        <div class="header">
            <div class="brand">
                <span class="brand-icon">EN</span>
                <span class="title">单词记忆练习</span>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <label for="gradeSelect">词库</label>
                <select id="gradeSelect">

                </select>
            </div>
            <div class="toolbar-right">
                <button class="ctrl-btn secondary" id="previewBtn">预览词库</button>
                <button class="ctrl-btn secondary" id="resetCtrlBtn" disabled>重置</button>
            </div>
        </div>

        <!-- 词库选择面板 -->
        <div class="lib-selector-wrapper" id="libSelector">
            <div class="lib-header" id="libToggle">
                <span class="lib-title">
                    <span class="arrow" id="libArrow">▶</span>
                    <span id="libTitleText">点击这行展开词库</span>
                    <span class="lib-stats" id="libStats">(已选 0 个词库，共 0 项)</span>
                </span>
            </div>
            <div class="lib-body" id="libBody">
                <div class="tree-container" id="treeContainer">
                    <!-- 树形结构由 JS 动态生成 -->
                </div>
                <div class="lib-actions" id="libActions">
                    <button class="btn-confirm" id="libConfirm">确认</button>
                    <button id="libSelectAll">全选</button>
                    <button id="libDeselectAll">取消全选</button>
                </div>
            </div>
        </div>

        <!-- 统计栏 -->
        <div class="stats">
            <span class="stat-item">用时 <span class="value time" id="timerDisplay">00:00</span></span>
            <span class="stat-item">正确 <span class="value" id="accuracyDisplay">0/0</span></span>
            <span class="stat-item">进度 <span class="value" id="progressDisplay">0/0</span></span>
            <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <!-- 预览面板 -->
        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <span class="preview-title">词库预览</span>
                <span class="preview-count" id="previewCount">共 0 个单词</span>
            </div>
            <div class="preview-list" id="previewList">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 单词卡片 -->
        <div class="word-card" id="wordCard">
            <div class="word-blanks-wrapper">
                <div class="word-blanks" id="wordBlanks"></div>
            </div>
            <div class="word-info" id="wordInfo">
                <span class="phonetic" id="wordPhonetic"></span>
                <!-- 为分隔符添加 id，方便控制显示 -->
                <span class="divider" id="wordDivider">|</span>
                <span class="meaning" id="wordMeaning"></span>
