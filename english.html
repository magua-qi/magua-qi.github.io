            <div class="feedback" id="feedback">点击「开始」按钮开始练习</div>
        </div>

        <!-- 键盘区域 -->
        <div class="keyboard" id="keyboard">
            <div class="kb-row">
                <button class="kb-key function" data-action="prev">上一个</button>
                <button class="kb-key function" data-action="hint">提示</button>
                <button class="kb-key function" data-action="next">下一个</button>
                <button class="kb-key function mode-btn active" data-mode="practice">练习</button>
                <button class="kb-key function mode-btn" data-mode="dictation">听写</button>
                <button class="kb-key function intensive-toggle" id="intensiveBtn">纠错 关</button>
                <button class="kb-key function start-btn" id="mainCtrlBtn">开始</button>
            </div>
            <div class="kb-row">
                <button class="kb-key" data-letter="q">q</button><button class="kb-key" data-letter="w">w</button>
                <button class="kb-key" data-letter="e">e</button><button class="kb-key" data-letter="r">r</button>
                <button class="kb-key" data-letter="t">t</button><button class="kb-key" data-letter="y">y</button>
                <button class="kb-key" data-letter="u">u</button><button class="kb-key" data-letter="i">i</button>
                <button class="kb-key" data-letter="o">o</button><button class="kb-key" data-letter="p">p</button>
            </div>
            <div class="kb-row">
                <button class="kb-key" data-letter="a">a</button><button class="kb-key" data-letter="s">s</button>
                <button class="kb-key" data-letter="d">d</button><button class="kb-key" data-letter="f">f</button>
                <button class="kb-key" data-letter="g">g</button><button class="kb-key" data-letter="h">h</button>
                <button class="kb-key" data-letter="j">j</button><button class="kb-key" data-letter="k">k</button>
                <button class="kb-key" data-letter="l">l</button>
            </div>
            <div class="kb-row">
                <button class="kb-key special" data-letter="⌫">⬅️</button>
                <button class="kb-key" data-letter="z">z</button><button class="kb-key" data-letter="x">x</button>
                <button class="kb-key" data-letter="c">c</button><button class="kb-key" data-letter="v">v</button>
                <button class="kb-key" data-letter="b">b</button><button class="kb-key" data-letter="n">n</button>
                <button class="kb-key" data-letter="m">m</button>
                <button class="kb-key special" data-letter="ENT"> ✅</button>
            </div>
        </div>

        <!-- 完成界面 -->
        <div class="complete-overlay hidden" id="completeOverlay">
            <div class="big-icon"></div>
            <h2>全部完成！</h2>
            <p>你真是单词小达人！</p>
            <div class="final-stats">
                <div><span class="num" id="finalAccuracy">0/0</span><span class="label">正确单词数</span></div>
                <div><span class="num" id="finalTime">00:00</span><span class="label">用时</span></div>
                <div><span class="num" id="finalTotal">0</span><span class="label">完成单词</span></div>
            </div>
            <button class="ctrl-btn primary" id="restartFromCompleteBtn" style="margin:0 auto;">再来一次</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  全局变量
        // ============================================================
        let WORDS_DATA = null;
        const DATA_URL = 'https://magua-qi.github.io/englishwords.json';
        const STORAGE_KEY = 'wordMemoryState';

        // ---- 工具函数 ----
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        // ---- DOM 引用 ----
        const $ = id => document.getElementById(id);
        const dom = {
            gradeSelect: $('gradeSelect'),
            libSelector: $('libSelector'),
            libToggle: $('libToggle'),
            libBody: $('libBody'),
            libArrow: $('libArrow'),
            libTitleText: $('libTitleText'),
            libStats: $('libStats'),
            treeContainer: $('treeContainer'),
            libActions: $('libActions'),
            libSelectAll: $('libSelectAll'),
            libDeselectAll: $('libDeselectAll'),
            libConfirm: $('libConfirm'),
            timerDisplay: $('timerDisplay'),
            accuracyDisplay: $('accuracyDisplay'),
            progressDisplay: $('progressDisplay'),
            progressFill: $('progressFill'),
            wordBlanks: $('wordBlanks'),
            wordPhonetic: $('wordPhonetic'),
            wordMeaning: $('wordMeaning'),
            wordDivider: $('wordDivider'),
            feedback: $('feedback'),
            wordCard: $('wordCard'),
            keyboard: $('keyboard'),
            completeOverlay: $('completeOverlay'),
            finalAccuracy: $('finalAccuracy'),
            finalTime: $('finalTime'),
            finalTotal: $('finalTotal'),
            restartBtn: $('restartFromCompleteBtn'),
            mainCtrlBtn: $('mainCtrlBtn'),
            resetCtrlBtn: $('resetCtrlBtn'),
            intensiveBtn: $('intensiveBtn'),
            previewBtn: $('previewBtn'),
            previewPanel: $('previewPanel'),
            previewList: $('previewList'),
            previewCount: $('previewCount'),
            kbKeys: document.querySelectorAll('.kb-key[data-letter]'),
            functionKeys: document.querySelectorAll('.kb-key[data-action]'),
            modeButtons: document.querySelectorAll('.mode-btn'),
        };

        // ---- 状态 ----
        const state = {
            currentGrade: '',
            selectedPaths: [],
            words: [],
            currentIndex: 0,
            slots: [],
            activeSlotIndex: 0,
            totalWords: 0,
            completedWords: 0,
            correctWords: 0,
            startTime: null,
            timerInterval: null,
            elapsedSeconds: 0,
            isFinished: false,
            isPaused: false,
            isStarted: false,
            usedKeys: new Set(),
            mode: 'practice',
            wordErrorMap: {},
            intensiveMode: false,
            libPanelOpen: false,
            isPreviewing: false,
        };

        // ---- 获取学段列表（按JSON顺序） ----
        function getGradeList() {
            return Object.keys(WORDS_DATA);
        }

        // ---- 获取某个学段下的叶子节点 ----
        function getLeavesForGrade(grade) {
            if (!WORDS_DATA || !WORDS_DATA[grade]) return [];
            return getAllLeafNodes(WORDS_DATA[grade], [grade]);
        }

        // ---- 构建树形数据（过滤预备单元） ----
        function buildTreeData(grade) {
            const leaves = getLeavesForGrade(grade);
            const root = { children: {} };
            for (const leaf of leaves) {
                const path = leaf.path;
                if (path.length < 2) continue;
                let current = root;
                for (let i = 1; i < path.length; i++) {
                    const part = path[i];
                    if (part === '预备单元') {
                        if (!current.paths) current.paths = [];
                        current.paths.push(path.join('|||'));
                        break;
                    }
                    if (!current.children[part]) {
                        current.children[part] = { children: {}, paths: [] };
                    }
                    current = current.children[part];
                    if (i === path.length - 1) {
                        if (!current.paths) current.paths = [];
                        current.paths.push(path.join('|||'));
                    }
                }
            }

            function convertNode(node, name) {
                const result = { name, children: [], paths: node.paths || [] };
                for (const [key, child] of Object.entries(node.children)) {
                    result.children.push(convertNode(child, key));
                }
                return result;
            }
            const treeArray = [];
            for (const [key, node] of Object.entries(root.children)) {
                treeArray.push(convertNode(node, key));
            }
            return treeArray;
        }

        // ---- 获取节点下所有路径 ----
        function getAllPathsFromNode(node) {
            let paths = [];
            if (node.paths) paths = paths.concat(node.paths);
            for (const child of node.children) {
                paths = paths.concat(getAllPathsFromNode(child));
            }
            return paths;
        }

        // ---- 渲染树形面板 ----
        function renderLibTree() {
            const grade = state.currentGrade;
            if (!grade || !WORDS_DATA || !WORDS_DATA[grade]) {
                dom.treeContainer.innerHTML = '<div style="padding:8px;color:#999;">请选择学段</div>';
                return;
            }
            const tree = buildTreeData(grade);
            const container = dom.treeContainer;
            container.innerHTML = '';

            function renderNode(node, level) {
                const div = document.createElement('div');
                div.className = 'tree-item';

                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'tree-node' + (node.children.length > 0 ? ' folder' : '');

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'node-checkbox';
                const allPaths = getAllPathsFromNode(node);
                const selectedCount = allPaths.filter(p => state.selectedPaths.includes(p)).length;
                cb.checked = (selectedCount === allPaths.length && allPaths.length > 0);
                cb.indeterminate = (selectedCount > 0 && selectedCount < allPaths.length);
                cb.addEventListener('change', (e) => {
                    const paths = getAllPathsFromNode(node);
                    if (e.target.checked) {
                        for (const p of paths) {
                            if (!state.selectedPaths.includes(p)) {
                                state.selectedPaths.push(p);
                            }
                        }
                    } else {
                        state.selectedPaths = state.selectedPaths.filter(p => !paths.includes(p));
                    }
                    updateStatsDisplay();
                    applyLibrarySelection();
                    renderLibTree();
                });

                const label = document.createElement('span');
                label.className = 'node-label';
                const count = allPaths.length;
                label.textContent = `${node.name || '根'}`;
                if (node.children.length === 0 && count > 0) {
                    const firstPath = allPaths[0];
                    if (firstPath) {
                        const parts = firstPath.split('|||');
                        if (parts.length > 2) {
                            const suffix = parts.slice(0, -1).join(' > ');
                            const span = document.createElement('span');
                            span.className = 'path-suffix';
                            span.textContent = ` ${suffix}`;
                            label.appendChild(span);
                        }
                    }
                }

                nodeDiv.appendChild(cb);
                nodeDiv.appendChild(label);
                div.appendChild(nodeDiv);

                if (node.children.length > 0) {
                    const childContainer = document.createElement('div');
                    childContainer.className = 'tree-item';
                    for (const child of node.children) {
                        childContainer.appendChild(renderNode(child, level + 1));
                    }
                    div.appendChild(childContainer);
                }

                return div;
            }

            if (tree.length === 0) {
                container.innerHTML = '<div style="padding:8px;color:#999;">该学段下暂无词库</div>';
            } else {
                for (const node of tree) {
                    container.appendChild(renderNode(node, 0));
                }
            }
        }

        // ---- 更新统计显示 ----
        function updateStatsDisplay() {
            const total = state.totalWords || 0;
            const count = state.selectedPaths.length;
            dom.libStats.textContent = `(已选 ${count} 个词库，共 ${total} 个单词)`;
            dom.libTitleText.textContent = '点击这行展开词库';
        }

        // ---- 切换面板折叠 ----
        function toggleLibPanel() {
            state.libPanelOpen = !state.libPanelOpen;
            dom.libBody.classList.toggle('open', state.libPanelOpen);
            dom.libArrow.classList.toggle('open', state.libPanelOpen);
            dom.libArrow.textContent = state.libPanelOpen ? '▼' : '▶';
            if (state.libPanelOpen) {
                renderLibTree();
            }
        }

        // ---- 全选当前学段 ----
        function selectAllCurrentGrade() {
            const grade = state.currentGrade;
            if (!grade || !WORDS_DATA || !WORDS_DATA[grade]) return;
            const tree = buildTreeData(grade);
            let allPaths = [];
            for (const node of tree) {
                allPaths = allPaths.concat(getAllPathsFromNode(node));
            }
            for (const p of allPaths) {
                if (!state.selectedPaths.includes(p)) {
                    state.selectedPaths.push(p);
                }
            }
            updateStatsDisplay();
            applyLibrarySelection();
            renderLibTree();
        }

        // ---- 取消全选 ----
        function deselectAllCurrentGrade() {
            const grade = state.currentGrade;
            if (!grade || !WORDS_DATA || !WORDS_DATA[grade]) return;
            const tree = buildTreeData(grade);
            let allPaths = [];
            for (const node of tree) {
                allPaths = allPaths.concat(getAllPathsFromNode(node));
            }
            state.selectedPaths = state.selectedPaths.filter(p => !allPaths.includes(p));
            updateStatsDisplay();
            applyLibrarySelection();
            renderLibTree();
        }

        // ---- 确认（关闭面板） ----
        function confirmLibSelection() {
            if (state.libPanelOpen) {
                toggleLibPanel();
            }
        }

        // ---- 获取预览单词列表 ----
        function getPreviewWords() {
            const allWords = [];
            const wordSet = new Set();
            for (const pathStr of state.selectedPaths) {
                const pathArr = pathStr.split('|||');
                const words = getWordsByPath(pathArr);
                if (words) {
                    for (const w of words) {
                        if (!wordSet.has(w.word)) {
                            wordSet.add(w.word);
                            allWords.push({ ...w, path: pathStr });
                        }
                    }
                }
            }
            return allWords;
        }

        // ---- 渲染预览面板 ----
        function renderPreview() {
            const words = getPreviewWords();
            const container = dom.previewList;
            const countEl = dom.previewCount;

            countEl.textContent = `共 ${words.length} 个单词`;

            if (words.length === 0) {
                container.innerHTML = '<div class="preview-empty">暂无单词，请选择词库</div>';
                return;
            }

            const groups = {};
            for (const w of words) {
                if (!groups[w.path]) groups[w.path] = [];
                groups[w.path].push(w);
            }

            let html = '';
            for (const [path, wordList] of Object.entries(groups)) {
                const pathParts = path.split('|||');
                const displayPath = pathParts.slice(1).join(' > ') || pathParts[0] || '未命名';
                html += `<div class="preview-group">
                            <div class="group-title">
                                <span>${displayPath}</span>
                                <span class="group-count">${wordList.length} 词</span>
                            </div>`;
                for (const w of wordList) {
                    html += `<div class="preview-item">
                                <span class="pword">${w.word}</span>
                                <span class="pphonetic">${w.phonetic || ''}</span>
                                <span class="pmeaning">${w.meaning || ''}</span>
                            </div>`;
                }
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // ---- 预览开关 ----
        function togglePreview() {
            if (state.isStarted || state.totalWords === 0) {
                updateFeedback('预览功能在当前状态下不可用', 'error');
                return;
            }

            state.isPreviewing = !state.isPreviewing;
            if (state.isPreviewing) {
                renderPreview();
                dom.previewPanel.classList.add('open');
                dom.previewBtn.textContent = '取消预览';
                updateFeedback('词库预览已打开', 'info');
            } else {
                dom.previewPanel.classList.remove('open');
                dom.previewBtn.textContent = '预览词库';
                updateFeedback('预览已关闭', 'info');
            }
            updatePreviewButtonState();
        }

        // ---- 更新预览按钮状态 ----
        function updatePreviewButtonState() {
            const btn = dom.previewBtn;
            const isLocked = state.isStarted || state.totalWords === 0;

            if (isLocked) {
                if (state.isPreviewing) {
                    state.isPreviewing = false;
                    dom.previewPanel.classList.remove('open');
                    dom.previewBtn.textContent = '预览词库';
                }
                btn.disabled = true;
                btn.textContent = '预览词库';
                return;
            }

            btn.disabled = false;
            if (state.isPreviewing) {
                btn.textContent = '取消预览';
            } else {
                btn.textContent = '预览词库';
            }
        }

        // ---- 强制关闭预览 ----
        function closePreview() {
            if (state.isPreviewing) {
                state.isPreviewing = false;
                dom.previewPanel.classList.remove('open');
                dom.previewBtn.textContent = '预览词库';
                updatePreviewButtonState();
            }
        }

        // ---- 应用词库选择 ----
        function applyLibrarySelection() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.isStarted = false;
            state.isPaused = false;
            state.isFinished = false;
            state.completedWords = 0;
            state.correctWords = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.startTime = null;
            state.slots = [];
            state.activeSlotIndex = 0;

            closePreview();

            const allWords = [];
            const wordSet = new Set();
            for (const pathStr of state.selectedPaths) {
                const pathArr = pathStr.split('|||');
                const words = getWordsByPath(pathArr);
                if (words) {
                    for (const w of words) {
                        if (!wordSet.has(w.word)) {
                            wordSet.add(w.word);
                            allWords.push(w);
                        }
                    }
                }
            }

            if (state.intensiveMode) {
                const errorWords = allWords.filter(w => state.wordErrorMap[w.word] && state.wordErrorMap[w.word] > 0);
                state.words = errorWords.length > 0 ? shuffle([...errorWords]) : shuffle([...allWords]);
            } else {
                state.words = shuffle([...allWords]);
            }
            state.totalWords = state.words.length;
            updateStatsDisplay();
            dom.completeOverlay.classList.add('hidden');
            dom.wordCard.classList.remove('hidden');
            dom.keyboard.classList.remove('hidden');
            renderWord();
            updateStats();
            updateControlButtons();
            enableInteraction(false);
            updatePreviewButtonState();
            if (state.totalWords > 0) {
                updateFeedback(`已选择 ${state.selectedPaths.length} 个词库，共 ${state.totalWords} 个单词`, 'success');
            } else {
                updateFeedback('请选择至少一个词库', 'info');
            }
            // 保存状态（重置后）
            saveState();
        }

        // ---- 切换学段 ----
        function switchGrade(grade) {
            if (grade === state.currentGrade) return;
            state.currentGrade = grade;
            state.selectedPaths = [];
            updateStatsDisplay();
            applyLibrarySelection();
            if (state.libPanelOpen) {
                renderLibTree();
            }
            saveState();
        }

        // ---- 多层目录支持 ----
        function getAllLeafNodes(data, path = []) {
            let leaves = [];
            if (Array.isArray(data)) {
                leaves.push({ path: [...path], words: data });
            } else if (data && typeof data === 'object') {
                for (const [key, value] of Object.entries(data)) {
                    const newPath = [...path, key];
                    const childLeaves = getAllLeafNodes(value, newPath);
                    leaves = leaves.concat(childLeaves);
                }
            }
            return leaves;
        }

        function getWordsByPath(pathArray) {
            if (!WORDS_DATA) return null;
            let data = WORDS_DATA;
            for (const key of pathArray) {
                if (data && typeof data === 'object' && key in data) {
                    data = data[key];
                } else {
                    return null;
                }
            }
            return Array.isArray(data) ? data : null;
        }

        // ---- 生成 slots（空格自动固定） ----
        function generateSlots(wordObj, mode) {
            const word = wordObj.word;
            const chars = word.split('');
            const nonSpaceIndices = [];
            for (let i = 0; i < chars.length; i++) {
                if (chars[i] !== ' ') {
                    nonSpaceIndices.push(i);
                }
            }

            let blankIndices = new Set();
            if (nonSpaceIndices.length > 0) {
                if (mode === 'practice') {
                    const blankCount = Math.max(1, Math.min(nonSpaceIndices.length - 1, Math.floor(nonSpaceIndices.length *
                        0.4)));
                    const shuffled = shuffle([...nonSpaceIndices]);
                    const selected = shuffled.slice(0, blankCount);
                    blankIndices = new Set(selected);
                } else {
                    blankIndices = new Set(nonSpaceIndices);
                }
            }

            if (blankIndices.size === 0 && nonSpaceIndices.length > 0) {
                blankIndices.add(nonSpaceIndices[0]);
            }

            const slots = chars.map((char, idx) => {
                const isBlank = blankIndices.has(idx);
                return {
                    char: char,
                    isBlank: isBlank && char !== ' ',
                    filled: false,
                    correct: false,
                    wrong: false,
                    value: '',
                    isSpace: char === ' ',
                };
            });
            return slots;
        }

        // ---- 核心逻辑 ----
        function initGame() {
            try {
                console.log('初始化游戏（无缓存）');
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }

                const grades = getGradeList();
                if (grades.length === 0) {
                    dom.wordBlanks.innerHTML = '<span style="color:#999;">无可用词库</span>';
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    dom.progressDisplay.textContent = '0/0';
                    dom.progressFill.style.width = '0%';
                    dom.accuracyDisplay.textContent = '0/0';
                    dom.timerDisplay.textContent = '00:00';
                    dom.feedback.textContent = '请检查词库数据';
                    dom.feedback.className = 'feedback info';
                    state.isFinished = true;
                    state.totalWords = 0;
                    state.isStarted = false;
                    state.isPaused = false;
                    state.words = [];
                    state.wordErrorMap = {};
                    state.intensiveMode = false;
                    state.isPreviewing = false;
                    enableInteraction(false);
                    updateControlButtons();
                    updateIntensiveButton();
                    updateStatsDisplay();
                    updatePreviewButtonState();
                    return;
                }

                const defaultGrade = grades[0];
                state.currentGrade = defaultGrade;
                dom.gradeSelect.value = defaultGrade;
                state.selectedPaths = [];
                updateStatsDisplay();

                state.words = [];
                state.totalWords = 0;
                state.completedWords = 0;
                state.correctWords = 0;
                state.elapsedSeconds = 0;
                state.currentIndex = 0;
                state.isFinished = false;
                state.usedKeys = new Set();
                state.isStarted = false;
                state.isPaused = false;
                state.startTime = null;
                state.slots = [];
                state.activeSlotIndex = 0;
                state.mode = 'practice';
                state.isPreviewing = false;

                dom.completeOverlay.classList.add('hidden');
                dom.wordCard.classList.remove('hidden');
                dom.keyboard.classList.remove('hidden');
                dom.kbKeys.forEach(k => k.className = 'kb-key');
                dom.modeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === 'practice');
                });
                updateIntensiveButton();
                updateStatsDisplay();
                dom.previewPanel.classList.remove('open');
                dom.previewBtn.textContent = '预览词库';

                renderWord();
                updateStats();
                updateFeedback('请选择词库，然后点击「开始」', 'info');
                enableInteraction(false);
                updateControlButtons();
                updatePreviewButtonState();
                dom.resetCtrlBtn.disabled = false;

                state.libPanelOpen = false;
                dom.libBody.classList.remove('open');
                dom.libArrow.classList.remove('open');
                dom.libArrow.textContent = '▶';

                // 尝试恢复保存的状态
                if (loadState()) {
                    // 已恢复，刷新界面
                    refreshUIAfterLoad();
                }

                console.log('初始化完成（无缓存，面板默认收起）');
            } catch (err) {
                console.error(err);
                updateFeedback('初始化失败：' + err.message, 'error');
            }
        }

        // ---- 刷新界面（加载状态后调用） ----
        function refreshUIAfterLoad() {
            // 更新选择框
            dom.gradeSelect.value = state.currentGrade;
            // 更新统计显示
            updateStatsDisplay();
            // 更新按钮状态
            updateIntensiveButton();
            updateControlButtons();
            updatePreviewButtonState();
            // 渲染单词
            renderWord();
            updateStats();
            // 如果已完成，显示完成界面
            if (state.isFinished) {
                dom.wordCard.classList.add('hidden');
                dom.keyboard.classList.add('hidden');
                dom.completeOverlay.classList.remove('hidden');
                dom.finalAccuracy.textContent = `${state.correctWords}/${state.totalWords}`;
                dom.finalTime.textContent = formatTime(state.elapsedSeconds);
                dom.finalTotal.textContent = state.completedWords;
                dom.progressFill.style.width = '100%';
                dom.progressDisplay.textContent = `${state.completedWords}/${state.totalWords}`;
                enableInteraction(false);
            } else if (state.isStarted && !state.isPaused) {
                // 继续计时
                state.startTime = Date.now() - state.elapsedSeconds * 1000;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                    updateTimerDisplay();
                }, 200);
                enableInteraction(true);
                updateFeedback('练习已恢复', 'info');
            } else if (state.isStarted && state.isPaused) {
                // 暂停状态
                enableInteraction(false);
                updateFeedback('练习已暂停', 'info');
            } else {
                // 未开始
                enableInteraction(false);
                if (state.totalWords > 0) {
                    updateFeedback('点击「开始」开始练习', 'info');
                } else {
                    updateFeedback('请选择词库', 'info');
                }
            }
            // 如果预览状态被保存，但这里不保存预览状态，忽略
        }

        // ---- 加载指定索引的单词 ----
        function goToWord(index) {
            if (state.isFinished) return;
            if (index < 0 || index >= state.totalWords) return;
            state.currentIndex = index;
            const wordObj = state.words[index];
            if (!wordObj) return;
            const word = wordObj.word;
            const chars = word.split('');
            const isCompleted = (index < state.completedWords);
            if (isCompleted) {
                state.slots = chars.map((char) => ({
                    char,
                    isBlank: false,
                    filled: true,
                    correct: true,
                    wrong: false,
                    value: char,
                    isSpace: char === ' ',
                }));
                state.activeSlotIndex = -1;
                updateFeedback('已完成的单词', 'success');
            } else {
                state.slots = generateSlots(wordObj, state.mode);
                state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                if (state.isStarted && !state.isPaused) {
                    updateFeedback('点击键盘填入字母，填完后按 ✅ 确认', 'info');
                }
            }
            state.usedKeys = new Set();
            dom.kbKeys.forEach(k => k.className = 'kb-key');
            renderWord();
            updateStats();
            if (state.isStarted && !state.isPaused && !state.isFinished) {
                enableInteraction(true);
            } else {
                enableInteraction(false);
            }
        }

        function loadWord() {
            try {
                if (state.currentIndex >= state.totalWords) {
                    finishGame();
                    return;
                }
                goToWord(state.currentIndex);
            } catch (err) {
                console.error(err);
                updateFeedback('加载单词出错', 'error');
            }
        }

        // ---- 渲染 ----
        function renderWord() {
            try {
                if (!state.isStarted) {
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    // 隐藏分隔符
                    if (dom.wordDivider) dom.wordDivider.style.display = 'none';
                    if (state.totalWords === 0) {
                        dom.wordBlanks.innerHTML = '<span style="color:#999; font-size:18px;">请先选择词库</span>';
                    } else {
                        dom.wordBlanks.innerHTML = '<span style="color:#999; font-size:18px;">点击「开始」按钮开始练习</span>';
                    }
                    return;
                }

                const wordObj = state.words[state.currentIndex];
                if (!wordObj) {
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    if (dom.wordDivider) dom.wordDivider.style.display = 'none';
                    dom.wordBlanks.innerHTML = '<span style="color:#999;">数据异常</span>';
                    return;
                }
                const phonetic = wordObj.phonetic || '';
                const meaning = wordObj.meaning || '';
                dom.wordPhonetic.textContent = phonetic;
                dom.wordMeaning.textContent = meaning;

                // 控制分隔符显示：当音标和释义都为空时隐藏
                if (dom.wordDivider) {
                    dom.wordDivider.style.display = (phonetic.trim() === '' && meaning.trim() === '') ? 'none' : '';
                }

                const container = dom.wordBlanks;
                container.innerHTML = '';
                container.classList.remove('animate-in');

                if (!state.slots || state.slots.length === 0) {
                    container.innerHTML = '<span style="color:#999;">无数据</span>';
                    return;
                }

                state.slots.forEach((slot, idx) => {
                    const el = document.createElement('span');
                    el.className = 'letter-slot';
                    el.dataset.index = idx;
                    if (slot.isSpace) {
                        el.classList.add('fixed', 'space');
                        el.textContent = '\u00A0';
                    } else if (slot.isBlank) {
                        el.classList.add('blank');
                        if (slot.filled && slot.correct) {
                            el.classList.add('filled');
                            el.textContent = slot.value;
                        } else if (slot.filled && slot.wrong) {
                            el.classList.add('wrong');
                            el.textContent = slot.value;
                        } else if (slot.filled) {
                            el.classList.add('filled');
                            el.textContent = slot.value;
                        } else {
                            el.textContent = '';
                        }
                        if (idx === state.activeSlotIndex && !slot.filled) {
                            el.classList.add('active');
                        }
                    } else {
                        el.classList.add('fixed');
                        el.textContent = slot.char;
                    }
                    if (!slot.isSpace) {
                        el.addEventListener('click', () => {
                            if (state.isFinished) return;
                            if (!state.isStarted || state.isPaused) {
                                updateFeedback('请先开始练习', 'info');
                                return;
                            }
                            if (slot.isBlank && !slot.filled) {
                                setActiveSlot(idx);
                            }
                        });
                    }
                    container.appendChild(el);
                });

                void container.offsetWidth;
                container.classList.add('animate-in');

            } catch (err) {
                console.error(err);
                dom.wordBlanks.innerHTML = `<span class="error-msg">渲染错误</span>`;
            }
        }

        function setActiveSlot(index) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            const slot = state.slots[index];
            if (!slot || !slot.isBlank || slot.filled) return;
            state.activeSlotIndex = index;
            renderWord();
            const allSlots = dom.wordBlanks.querySelectorAll('.letter-slot');
            allSlots.forEach((el, i) => {
                if (i === index && state.slots[i].isBlank && !state.slots[i].filled) {
                    el.classList.add('active');
                }
            });
        }

        // ---- 验证函数 ----
        function validateWord() {
            const blanks = state.slots.filter(s => s.isBlank);
            if (blanks.some(s => !s.filled)) {
                updateFeedback('还有空位未填，请继续输入', 'info');
                return false;
            }
            let correctCount = 0;
            let wrongCount = 0;
            const currentWord = state.words[state.currentIndex].word;
            for (const slot of blanks) {
                if (slot.value.toLowerCase() === slot.char.toLowerCase()) {
                    slot.correct = true;
                    slot.wrong = false;
                    correctCount++;
                } else {
                    slot.correct = false;
                    slot.wrong = true;
                    wrongCount++;
                    if (!state.wordErrorMap[currentWord]) {
                        state.wordErrorMap[currentWord] = 0;
                    }
                    state.wordErrorMap[currentWord]++;
                }
            }

            const isAllCorrect = (wrongCount === 0);
            state.completedWords++;

            if (isAllCorrect) {
                state.correctWords++;
                updateFeedback('全部正确！', 'success');
            } else {
                updateFeedback(`有 ${wrongCount} 个错误`, 'error');
            }

            if (state.mode === 'dictation') {
                const nextIndex = state.currentIndex + 1;
                if (nextIndex < state.totalWords) {
                    goToWord(nextIndex);
                } else {
                    finishGame();
                }
                updateStats();
                saveState();
                return true;
            } else {
                if (isAllCorrect) {
                    const nextIndex = state.currentIndex + 1;
                    if (nextIndex < state.totalWords) {
                        setTimeout(() => {
                            goToWord(nextIndex);
                        }, 400);
                    } else {
                        setTimeout(() => {
                            finishGame();
                        }, 400);
                    }
                    updateStats();
                    saveState();
                    return true;
                } else {
                    updateFeedback('有错误，请重新输入', 'error');
                    for (const slot of state.slots) {
                        if (slot.isBlank) {
                            slot.filled = false;
                            slot.correct = false;
                            slot.wrong = false;
                            slot.value = '';
                        }
                    }
                    state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                    state.completedWords--;
                    renderWord();
                    updateStats();
                    saveState();
                    return false;
                }
            }
        }

        // ---- 键盘输入 ----
        function handleKeyInput(letter) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            if (state.currentIndex < state.completedWords) {
                updateFeedback('该单词已完成，不可编辑', 'info');
                return;
            }
            try {
                if (letter === '⌫') {
                    for (let i = state.slots.length - 1; i >= 0; i--) {
                        const s = state.slots[i];
                        if (s.isBlank && s.filled) {
                            s.filled = false;
                            s.correct = false;
                            s.wrong = false;
                            s.value = '';
                            state.activeSlotIndex = i;
                            renderWord();
                            updateFeedback('已退格', 'info');
                            return;
                        }
                    }
                    updateFeedback('没有可退格的内容', 'info');
                    return;
                }
                if (letter === 'ENT') {
                    validateWord();
                    return;
                }
                let activeIdx = state.activeSlotIndex;
                let slot = state.slots[activeIdx];
                if (!slot || !slot.isBlank || slot.filled) {
                    const first = state.slots.findIndex(s => s.isBlank && !s.filled);
                    if (first === -1) {
                        updateFeedback('所有空位已填，请按 ✅ 确认', 'success');
                        return;
                    }
                    activeIdx = first;
                    state.activeSlotIndex = activeIdx;
                    renderWord();
                    slot = state.slots[activeIdx];
                }
                if (!slot.isBlank || slot.filled) return;

                slot.filled = true;
                slot.value = letter;
                slot.correct = false;
                slot.wrong = false;

                const next = state.slots.findIndex((s, idx) => s.isBlank && !s.filled && idx > activeIdx);
                if (next !== -1) {
                    state.activeSlotIndex = next;
                } else {
                    updateFeedback('所有空位已填，请按 ✅ 确认', 'success');
                    state.activeSlotIndex = -1;
                }
                renderWord();
                updateStats();
            } catch (err) {
                console.error(err);
                updateFeedback('输入处理出错', 'error');
            }
        }

        // ---- 提示 ----
        function useHint() {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            if (state.currentIndex < state.completedWords) {
                updateFeedback('该单词已完成', 'info');
                return;
            }
            try {
                const blankIdx = state.slots.findIndex(s => s.isBlank && !s.filled);
                if (blankIdx === -1) {
                    updateFeedback('所有空位已填，请按 ✅ 确认', 'success');
                    return;
                }
                const slot = state.slots[blankIdx];
                updateFeedback(`提示：正确字母是 “${slot.char}”`, 'info');
            } catch (err) {
                console.error(err);
                updateFeedback('提示功能出错', 'error');
            }
        }

        // ---- 模式切换 ----
        function switchMode(mode) {
            if (state.isStarted) {
                updateFeedback('练习进行中，模式已锁定', 'error');
                return;
            }
            if (state.mode === mode) return;
            state.mode = mode;
            dom.modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (state.words.length > 0 && state.currentIndex < state.totalWords && state.currentIndex >= state
                .completedWords) {
                const wordObj = state.words[state.currentIndex];
                state.slots = generateSlots(wordObj, mode);
                state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                dom.kbKeys.forEach(k => k.className = 'kb-key');
                renderWord();
                updateFeedback(`已切换至 ${mode === 'practice' ? '练习' : '听写'} 模式`, 'info');
            }
            saveState();
        }

        // ---- 切换纠错模式 ----
        function toggleIntensiveMode() {
            if (state.isStarted && !state.isPaused && !state.isFinished) {
                updateFeedback('练习进行中，请先暂停再切换纠错模式', 'error');
                return;
            }
            state.intensiveMode = !state.intensiveMode;
            updateIntensiveButton();
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.isStarted = false;
            state.isPaused = false;
            state.isFinished = false;
            state.completedWords = 0;
            state.correctWords = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.startTime = null;
            state.slots = [];
            state.activeSlotIndex = 0;

            applyLibrarySelection();
            const msg = state.intensiveMode ? `纠错模式已开 仅练习高频错词 ${getErrorWordCount()}个` : '纠错模式已关 练习完整词库';
            updateFeedback(msg, 'info');
            saveState();
        }

        function getErrorWordCount() {
            if (!state.words || state.words.length === 0) return 0;
            return state.words.filter(w => state.wordErrorMap[w.word] && state.wordErrorMap[w.word] > 0).length;
        }

        function updateIntensiveButton() {
            const label = state.intensiveMode ? `纠错 开` : '纠错 关';
            dom.intensiveBtn.textContent = label;
            dom.intensiveBtn.classList.toggle('on', state.intensiveMode);
        }

        function finishGame() {
            try {
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                state.isFinished = true;
                state.isStarted = false;
                state.isPaused = false;
                dom.wordCard.classList.add('hidden');
                dom.keyboard.classList.add('hidden');
                dom.completeOverlay.classList.remove('hidden');
                dom.finalAccuracy.textContent = `${state.correctWords}/${state.totalWords}`;
                dom.finalTime.textContent = formatTime(state.elapsedSeconds);
                dom.finalTotal.textContent = state.completedWords;
                dom.progressFill.style.width = '100%';
                dom.progressDisplay.textContent = `${state.completedWords}/${state.totalWords}`;
                enableInteraction(false);
                updateControlButtons();
                updatePreviewButtonState();
                saveState();
            } catch (err) {
                console.error(err);
            }
        }

        // ---- 导航 ----
        function goPrev() {
            if (state.isFinished) return;
            if (state.currentIndex > 0) {
                goToWord(state.currentIndex - 1);
            }
        }

        function goNext() {
            if (state.isFinished) return;
            if (state.currentIndex < state.totalWords - 1) {
                goToWord(state.currentIndex + 1);
            }
        }

        // ---- 开始/暂停/继续 ----
        function toggleMainControl() {
            if (!state.isStarted) {
                if (state.totalWords === 0) {
                    updateFeedback('请先选择有效词库', 'error');
                    return;
                }
                closePreview();

                state.isStarted = true;
                state.isPaused = false;
                state.startTime = Date.now() - state.elapsedSeconds * 1000;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                    updateTimerDisplay();
                }, 200);
                enableInteraction(true);
                updateFeedback('练习开始！', 'success');
                updateControlButtons();
                updatePreviewButtonState();
                updateStats();
                if (state.totalWords > 0 && state.currentIndex === 0 && state.completedWords === 0) {
                    loadWord();
                } else {
                    renderWord();
                }
                saveState();
            } else if (state.isPaused) {
                state.isPaused = false;
                state.startTime = Date.now() - state.elapsedSeconds * 1000;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                    updateTimerDisplay();
                }, 200);
                enableInteraction(true);
                updateFeedback('继续练习', 'info');
                updateControlButtons();
                updatePreviewButtonState();
                saveState();
            } else {
                state.isPaused = true;
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                enableInteraction(false);
                updateFeedback('已暂停', 'info');
                updateControlButtons();
                updatePreviewButtonState();
                saveState();
            }
        }

        function updateTimerDisplay() {
            dom.timerDisplay.textContent = formatTime(state.elapsedSeconds);
        }

        function updateStats() {
            const total = state.totalWords;
            const done = state.completedWords;
            const progress = total > 0 ? Math.round((done / total) * 100) : 0;
            dom.progressDisplay.textContent = `${done}/${total}`;
            dom.progressFill.style.width = `${progress}%`;
            dom.accuracyDisplay.textContent = `${state.correctWords}/${total}`;
            updateTimerDisplay();
        }

        // ---- 控制按钮状态 ----
        function updateControlButtons() {
            const hasValidWords = state.totalWords > 0 && !state.isFinished;
            if (!state.isStarted) {
                dom.mainCtrlBtn.textContent = '开始';
                dom.mainCtrlBtn.disabled = !hasValidWords;
                dom.resetCtrlBtn.disabled = true;
            } else if (state.isPaused) {
                dom.mainCtrlBtn.textContent = '继续';
                dom.mainCtrlBtn.disabled = false;
                dom.resetCtrlBtn.disabled = false;
            } else {
                dom.mainCtrlBtn.textContent = '暂停';
                dom.mainCtrlBtn.disabled = false;
                dom.resetCtrlBtn.disabled = false;
            }
            if (state.isFinished) {
                dom.mainCtrlBtn.disabled = true;
                dom.resetCtrlBtn.disabled = true;
            }
            if (!hasValidWords && !state.isStarted) {
                dom.mainCtrlBtn.disabled = true;
            }
            const modeLocked = state.isStarted && !state.isFinished;
            dom.modeButtons.forEach(btn => {
                if (modeLocked) {
                    btn.classList.add('locked');
                } else {
                    btn.classList.remove('locked');
                }
            });
            if (state.isStarted && !state.isPaused && !state.isFinished) {
                dom.intensiveBtn.classList.add('locked');
            } else {
                dom.intensiveBtn.classList.remove('locked');
            }
            if (!state.isStarted && state.totalWords > 0) {
                dom.resetCtrlBtn.disabled = false;
            }
            updatePreviewButtonState();
        }

        // ---- 启用/禁用交互 ----
        function enableInteraction(enabled) {
            dom.kbKeys.forEach(k => {
                k.style.pointerEvents = enabled ? 'auto' : 'none';
                k.style.opacity = enabled ? '1' : '0.5';
            });
            dom.functionKeys.forEach(k => {
                if (k.dataset.mode) return;
                if (k.id === 'intensiveBtn') return;
                k.style.pointerEvents = enabled ? 'auto' : 'none';
                k.style.opacity = enabled ? '1' : '0.5';
            });
            dom.modeButtons.forEach(k => {
                if (k.classList.contains('locked')) {
                    k.style.pointerEvents = 'none';
                    k.style.opacity = '0.5';
                } else {
                    k.style.pointerEvents = 'auto';
                    k.style.opacity = '1';
                }
            });
            const intensive = dom.intensiveBtn;
            if (intensive.classList.contains('locked')) {
                intensive.style.pointerEvents = 'none';
                intensive.style.opacity = '0.5';
            } else {
                intensive.style.pointerEvents = 'auto';
                intensive.style.opacity = '1';
            }
            const slots = dom.wordBlanks.querySelectorAll('.letter-slot');
            slots.forEach(el => {
                el.style.pointerEvents = enabled ? 'auto' : 'none';
                el.style.opacity = enabled ? '1' : '0.6';
            });
        }

        // ---- 反馈 ----
        function updateFeedback(msg, type = 'info') {
            dom.feedback.textContent = msg;
            dom.feedback.className = 'feedback ' + type;
            clearTimeout(dom.feedback._timeout);
            if (type === 'success' || type === 'error') {
                dom.feedback._timeout = setTimeout(() => {
                    if (!state.isFinished && state.isStarted && !state.isPaused) {
                        dom.feedback.className = 'feedback info';
                        dom.feedback.textContent = '点击键盘填入字母，填完后按 ✅ 确认';
                    }
                }, 2500);
            }
        }

        // ---- 重置 ----
        function resetProgress() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.isStarted = false;
            state.isPaused = false;
            state.isFinished = false;
            state.completedWords = 0;
            state.correctWords = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.startTime = null;
            closePreview();
            applyLibrarySelection();
            dom.completeOverlay.classList.add('hidden');
            dom.wordCard.classList.remove('hidden');
            dom.keyboard.classList.remove('hidden');
            renderWord();
            updateStats();
            updateControlButtons();
            updatePreviewButtonState();
            enableInteraction(false);
            updateFeedback('已重置，请选择模式后点击「开始」', 'info');
            // 清除缓存
            localStorage.removeItem(STORAGE_KEY);
        }

        // ============================================================
        //  缓存相关函数
        // ============================================================
        function saveState() {
            try {
                const data = {
                    grade: state.currentGrade,
                    selectedPaths: state.selectedPaths,
                    wordsOrder: state.words.map(w => w.word),
                    currentIndex: state.currentIndex,
                    completedWords: state.completedWords,
                    correctWords: state.correctWords,
                    elapsedSeconds: state.elapsedSeconds,
                    mode: state.mode,
                    intensiveMode: state.intensiveMode,
                    wordErrorMap: state.wordErrorMap,
                    isStarted: state.isStarted,
                    isPaused: state.isPaused,
                    isFinished: state.isFinished,
                    // 不保存 slots, activeSlotIndex, 等动态渲染状态
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('保存状态失败:', e);
            }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                // 基本字段检查
                if (!data.grade || !data.selectedPaths || !data.wordsOrder) return false;

                // 设置学段和选择路径
                state.currentGrade = data.grade;
                state.selectedPaths = data.selectedPaths;

                // 提取所有单词
                const allWords = [];
                const wordSet = new Set();
                for (const pathStr of state.selectedPaths) {
                    const pathArr = pathStr.split('|||');
                    const words = getWordsByPath(pathArr);
                    if (words) {
                        for (const w of words) {
                            if (!wordSet.has(w.word)) {
                                wordSet.add(w.word);
                                allWords.push(w);
                            }
                        }
                    }
                }

                // 根据保存的顺序重建 words 数组
                const wordMap = {};
                for (const w of allWords) {
                    wordMap[w.word] = w;
                }
                const orderedWords = [];
                for (const w of data.wordsOrder) {
                    if (wordMap[w]) {
                        orderedWords.push(wordMap[w]);
                        delete wordMap[w]; // 避免重复
                    }
                }
                // 追加剩余未在保存顺序中的单词（例如新增的）
                for (const w of allWords) {
                    if (wordMap[w.word]) {
                        orderedWords.push(w);
                    }
                }

                state.words = orderedWords;
                state.totalWords = state.words.length;
                // 恢复其他状态
                state.currentIndex = Math.min(data.currentIndex, state.totalWords - 1);
                state.completedWords = Math.min(data.completedWords, state.totalWords);
                state.correctWords = data.correctWords || 0;
                state.elapsedSeconds = data.elapsedSeconds || 0;
                state.mode = data.mode || 'practice';
                state.intensiveMode = data.intensiveMode || false;
                state.wordErrorMap = data.wordErrorMap || {};
                state.isStarted = data.isStarted || false;
                state.isPaused = data.isPaused || false;
                state.isFinished = data.isFinished || false;

                // 如果已完成，确保完成界面显示
                if (state.isFinished) {
                    state.isStarted = false;
                    state.isPaused = false;
                }

                // 如果当前索引超出范围，调整
                if (state.currentIndex >= state.totalWords) state.currentIndex = state.totalWords - 1;
                if (state.currentIndex < 0) state.currentIndex = 0;

                // 同步选中的学段下拉框
                dom.gradeSelect.value = state.currentGrade;

                // 更新模式按钮
                dom.modeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === state.mode);
                });

                // 更新纠错按钮
                updateIntensiveButton();

                // 更新统计显示
                updateStatsDisplay();

                // 重置 slots 和 activeSlotIndex 将在 refreshUIAfterLoad 中根据当前单词生成
                state.slots = [];
                state.activeSlotIndex = 0;
                state.startTime = null;
                state.timerInterval = null;
                state.usedKeys = new Set();

                return true;
            } catch (e) {
                console.warn('加载状态失败:', e);
                return false;
            }
        }

        // ---- 事件绑定 ----
        dom.gradeSelect.addEventListener('change', function() {
            const grade = this.value;
            if (grade && grade !== state.currentGrade) {
                switchGrade(grade);
            }
        });

        dom.libToggle.addEventListener('click', toggleLibPanel);

        dom.libSelectAll.addEventListener('click', selectAllCurrentGrade);
        dom.libDeselectAll.addEventListener('click', deselectAllCurrentGrade);
        dom.libConfirm.addEventListener('click', confirmLibSelection);

        dom.previewBtn.addEventListener('click', togglePreview);

        dom.kbKeys.forEach(key => {
            key.addEventListener('click', function() {
                const letter = this.dataset.letter;
                if (letter) handleKeyInput(letter);
            });
            key.addEventListener('touchstart', function(e) {
                // 防止页面缩放
            }, { passive: true });
        });

        dom.functionKeys.forEach(key => {
            key.addEventListener('click', function() {
                const action = this.dataset.action;
                if (action === 'prev') goPrev();
                else if (action === 'hint') useHint();
                else if (action === 'next') goNext();
            });
        });

        dom.modeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const mode = this.dataset.mode;
                switchMode(mode);
            });
        });

        dom.intensiveBtn.addEventListener('click', toggleIntensiveMode);

        document.addEventListener('keydown', function(e) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) return;
            const key = e.key.toUpperCase();
            if (key === 'BACKSPACE' || key === 'DELETE') {
                e.preventDefault();
                handleKeyInput('⌫');
                return;
            }
            if (key === 'ENTER') {
                e.preventDefault();
                handleKeyInput('ENT');
                return;
            }
            const lowerKey = e.key.toLowerCase();
            if (/^[a-z]$/.test(lowerKey)) {
                e.preventDefault();
                handleKeyInput(lowerKey);
            }
        });

        dom.restartBtn.addEventListener('click', function() {
            state.isStarted = false;
            state.isPaused = false;
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            resetProgress();
        });

        dom.mainCtrlBtn.addEventListener('click', toggleMainControl);
        dom.resetCtrlBtn.addEventListener('click', function() {
            dom.restartBtn.click();
        });

        // ============================================================
        //  数据加载、构建下拉框并启动
        // ============================================================
        function initApp() {
            const grades = getGradeList();
            dom.gradeSelect.innerHTML = '';
            for (const g of grades) {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                dom.gradeSelect.appendChild(opt);
            }

            state.currentGrade = grades[0] || '';
            state.selectedPaths = [];
            state.intensiveMode = false;
            state.isPreviewing = false;

            if (state.currentGrade) {
                dom.gradeSelect.value = state.currentGrade;
            }

            dom.modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === state.mode);
            });
            updateIntensiveButton();
            updateStatsDisplay();

            state.words = [];
            state.totalWords = 0;
            state.completedWords = 0;
            state.correctWords = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.isFinished = false;
            state.usedKeys = new Set();
            state.isStarted = false;
            state.isPaused = false;
            state.startTime = null;
            state.slots = [];
            state.activeSlotIndex = 0;
            state.mode = 'practice';
            state.isPreviewing = false;

            dom.completeOverlay.classList.add('hidden');
            dom.wordCard.classList.remove('hidden');
            dom.keyboard.classList.remove('hidden');
            dom.kbKeys.forEach(k => k.className = 'kb-key');
            dom.modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === 'practice');
            });
            updateIntensiveButton();
            updateStatsDisplay();
            dom.previewPanel.classList.remove('open');
            dom.previewBtn.textContent = '预览词库';

            renderWord();
            updateStats();
            updateFeedback('请选择词库，然后点击「开始」', 'info');
            enableInteraction(false);
            updateControlButtons();
            updatePreviewButtonState();
            dom.resetCtrlBtn.disabled = false;

            state.libPanelOpen = false;
            dom.libBody.classList.remove('open');
            dom.libArrow.classList.remove('open');
            dom.libArrow.textContent = '▶';

            // 尝试恢复保存的状态
            if (loadState()) {
                refreshUIAfterLoad();
            }

            console.log('单词记忆工具已启动（无缓存，面板默认收起）');
        }

        // ---- 加载 JSON 数据 ----
        async function loadData() {
            try {
                dom.feedback.textContent = '加载词库中...';
                dom.feedback.className = 'feedback info';

                const response = await fetch(DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                WORDS_DATA = json;

                if (typeof WORDS_DATA !== 'object' || Object.keys(WORDS_DATA).length === 0) {
                    throw new Error('词库数据为空或格式错误');
                }

                console.log('词库加载成功，共', Object.keys(WORDS_DATA).length, '个分类');
                dom.feedback.textContent = '词库加载成功！';
                dom.feedback.className = 'feedback success';

                initApp();
            } catch (err) {
                console.error('加载词库失败:', err);
                document.querySelector('.app-container').innerHTML = `
                        <div style="text-align:center;padding:40px;color:#c62828;">
                            <h2>词库加载失败</h2>
                            <p>无法从 <code>${DATA_URL}</code> 加载词库数据</p>
                            <p style="font-size:14px;color:#999;">${err.message}</p>
                            <button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;border:none;border-radius:30px;background:#7b1fa2;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">重新加载</button>
                        </div>
                    `;
            }
        }

        // ---- 启动 ----
        loadData();
    </script>
</body>
</html>
