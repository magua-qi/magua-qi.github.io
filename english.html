<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词记忆练习</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237b1fa2'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        /* ================================================================
           全局重置 & 基础布局
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #f5f0f8;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        /* ================================================================
           主容器
           ================================================================ */
        .app-container {
            max-width: 820px;
            width: 100%;
            height: 100%;
            max-height: 92vh;
            min-height: 480px;
            background: #ffffff;
            border-radius: 10px;
            padding: 10px 10px 12px;
            box-shadow: 0 8px 32px rgba(106, 13, 173, 0.12);
            border: 1px solid #ede7f6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: padding 0.2s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* ===== 顶栏 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 6px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 25px;
            height: 25px;
            background: #7b1fa2;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            flex-shrink: 0;
            user-select: none;
            transition: background 0.3s ease;
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            color: #4a148c;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            background: #f3e5f5;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            flex-shrink: 0;
            border: 1px solid #e1bee7;
            transition: background 0.3s ease, border-color 0.3s ease;
            min-height: 52px;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .toolbar-left label {
            font-size: 13px;
            font-weight: 600;
            color: #6a1b9a;
            white-space: nowrap;
            transition: color 0.3s ease;
        }
        .toolbar-left select {
            padding: 6px 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            background: #ffffff;
            color: #4a148c;
            outline: none;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            width: 100%;
            min-width: 120px;
            max-width: 320px;
            transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
            height: 36px;
        }
        .toolbar-left select optgroup {
            font-weight: 700;
            color: #6a1b9a;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .ctrl-btn {
            padding: 5px 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ede7f6;
            color: #4a148c;
            border: 1px solid #d1c4e9;
            white-space: nowrap;
            height: 36px;
        }
        .ctrl-btn:hover {
            background: #d1c4e9;
            transform: scale(1.02);
        }
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        .ctrl-btn.primary {
            background: linear-gradient(135deg, #7b1fa2, #9c27b0);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(106, 27, 154, 0.25);
        }
        .ctrl-btn.primary:hover {
            box-shadow: 0 6px 20px rgba(106, 27, 154, 0.35);
        }
        .ctrl-btn.secondary {
            background: #fff3e0;
            border-color: #ffcc80;
            color: #e65100;
        }
        .ctrl-btn.secondary:hover {
            background: #ffe0b2;
        }
        .ctrl-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none;
        }

        /* ===== 统计栏 ===== */
        .stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            background: #f3e5f5;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            gap: 4px 12px;
            border: 1px solid #e1bee7;
            flex-shrink: 0;
            min-height: 44px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .stat-item {
            font-size: 13px;
            font-weight: 600;
            color: #4a148c;
            white-space: nowrap;
            transition: color 0.3s ease;
        }
        .stat-item .value {
            background: rgba(255, 255, 255, 0.7);
            padding: 0 8px;
            border-radius: 10px;
            font-weight: 700;
            color: #311b92;
            display: inline-block;
            min-width: 36px;
            text-align: center;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .stat-item .value.time {
            min-width: 52px;
        }
        .progress-wrap {
            flex: 1;
            min-width: 60px;
            height: 7px;
            background: #d1c4e9;
            border-radius: 10px;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7b1fa2, #ab47bc);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* ================================================================
           单词卡片
           ================================================================ */
        .word-card {
            background: #faf5ff;
            border-radius: 10px;
            padding: 24px 16px 12px;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.8), 0 4px 16px rgba(106, 27, 154, 0.08);
            margin-bottom: 8px;
            border: 1px solid #ede7f6;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            overflow: hidden;
            transition: padding 0.2s ease, min-height 0.2s ease, background 0.3s ease, border-color 0.3s ease;
        }

        /* ---- 第一行：字母格 ---- */
        .word-blanks-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 0;
            flex-shrink: 0;
        }
        .word-blanks {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px 3px;
            padding: 2px 0;
            will-change: transform, opacity;
            min-height: 44px;
        }
        .word-blanks.animate-in {
            animation: fadeSlideIn 0.3s ease-out forwards;
        }
        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 50px;
            font-size: 34px;
            font-weight: 700;
            border-radius: 10px;
            background: #ffffff;
            border: 2.5px solid #ce93d8;
            color: #1a1a2e;
            transition: all 0.2s ease;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            user-select: none;
            flex-shrink: 0;
        }
        .letter-slot.blank {
            border-color: #9c27b0;
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .letter-slot.blank::after {
            content: '_';
            color: #7b1fa2;
            font-weight: 300;
            opacity: 0.7;
        }
        .letter-slot.blank.filled {
            border-color: #2e7d32;
            background: #e8f5e9;
            color: #1b5e20;
        }
        .letter-slot.blank.filled::after {
            content: none;
        }
        .letter-slot.blank.wrong {
            border-color: #c62828;
            background: #ffebee;
            color: #b71c1c;
            animation: shake 0.35s ease;
        }
        .letter-slot.blank.wrong::after {
            content: none;
        }
        .letter-slot.blank.active {
            border-color: #7b1fa2;
            background: #ede7f6;
            box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.15);
            transform: scale(1.05);
        }
        .letter-slot.fixed {
            border-color: transparent;
            background: transparent;
            color: #1a1a2e;
            width: 36px;
            height: 46px;
            font-size: 34px;
        }
        .letter-slot.fixed::after {
            content: none;
        }
        .letter-slot.fixed.space {
            /* 空格占位，保持宽度 */
            opacity: 0.3;
            background: transparent;
            border-color: transparent;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-5px);
            }
            40% {
                transform: translateX(5px);
            }
            60% {
                transform: translateX(-3px);
            }
            80% {
                transform: translateX(3px);
            }
        }

        /* ---- 第二行：音标+释义 ---- */
        .word-info {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 500;
            color: #4a148c;
            gap: 4px;
            flex-wrap: wrap;
            text-align: center;
            min-height: 28px;
            flex-shrink: 0;
            padding: 18px 0 12px;
            transition: color 0.3s ease, padding 0.2s ease;
        }
        .word-info .phonetic {
            font-family: 'Segoe UI', 'Times New Roman', serif;
            color: #6a1b9a;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        .word-info .meaning {
            font-weight: 600;
            color: #4a148c;
            transition: color 0.3s ease;
        }
        .word-info .divider {
            color: #ce93d8;
            font-weight: 300;
            margin: 0 2px;
            transition: color 0.3s ease;
        }

        /* ---- 反馈信息 ---- */
        .feedback {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            min-height: 24px;
            padding: 4px 0 0;
            color: #4a148c;
            margin-top: 18px;
            flex-shrink: 0;
            transition: color 0.3s ease, margin-top 0.2s ease;
        }
        .feedback.success {
            color: #1b5e20;
        }
        .feedback.error {
            color: #b71c1c;
        }
        .feedback.info {
            color: #e65100;
        }
        .error-msg {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 10px;
            margin: 8px 0;
        }

        /* ================================================================
           键盘区域
           ================================================================ */
        .keyboard {
            background: #f3e5f5;
            border-radius: 10px;
            padding: 8px 8px 6px;
            border: 1px solid #e1bee7;
            flex-shrink: 0;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: padding 0.2s ease, min-height 0.2s ease, background 0.3s ease, border-color 0.3s ease;
        }
        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }
        .kb-row:last-child {
            margin-bottom: 0;
        }
        .kb-key {
            flex: 1 1 0;
            min-width: 0;
            height: 64px;
            border: none;
            border-radius: 10px;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04), inset 0 1px 2px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.12s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 1px solid #d1c4e9;
            touch-action: manipulation;
        }
        .kb-key:active {
            transform: scale(0.92);
            background: #ede7f6;
        }
        .kb-key.special {
            flex: 1.5 1 0;
            background: #ede7f6;
            font-size: 16px;
            color: #4a148c;
        }
        .kb-key.special:active {
            background: #d1c4e9;
        }
        .kb-key.function {
            height: 38px;
            font-size: 15px;
            background: #ede7f6;
            border-color: #d1c4e9;
            flex: 1;
            border-radius: 10px;
            color: #4a148c;
        }
        .kb-key.function:active {
            background: #d1c4e9;
        }
        .kb-key.function.mode-btn {
            flex: 1.2;
            background: #e1bee7;
            border-color: #ce93d8;
            font-weight: 600;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
        }
        .kb-key.function.mode-btn.active {
            background: #7b1fa2;
            color: #fff;
            border-color: #7b1fa2;
            box-shadow: 0 2px 8px rgba(106, 27, 154, 0.3);
        }
        .kb-key.function.mode-btn.locked,
        .kb-key.function.locked {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }
        .kb-key.function.start-btn {
            flex: 1.3;
            background: linear-gradient(135deg, #7b1fa2, #9c27b0);
            color: #fff;
            border: none;
            box-shadow: 0 2px 8px rgba(106, 27, 154, 0.3);
        }
        .kb-key.function.start-btn:active {
            transform: scale(0.92);
        }
        .kb-key.function.start-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .kb-key.correct-highlight {
            background: #c8e6c9;
            border-color: #2e7d32;
        }
        .kb-key.wrong-highlight {
            background: #ffcdd2;
            border-color: #c62828;
        }

        /* ===== 完成界面 ===== */
        .complete-overlay {
            text-align: center;
            padding: 20px 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .complete-overlay .big-icon {
            font-size: 0;
        }
        .complete-overlay h2 {
            font-size: 22px;
            color: #4a148c;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        .complete-overlay p {
            font-size: 15px;
            color: #6a1b9a;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        .complete-overlay .final-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 12px 0 16px;
            flex-wrap: wrap;
        }
        .complete-overlay .final-stats .num {
            font-size: 28px;
            font-weight: 800;
            color: #7b1fa2;
            display: block;
            transition: color 0.3s ease;
        }
        .complete-overlay .final-stats .label {
            font-size: 12px;
            color: #6a1b9a;
            opacity: 0.7;
            transition: color 0.3s ease;
        }
        .hidden {
            display: none !important;
        }

        /* ================================================================
           ★★★ 深色模式 ★★★
           ================================================================ */
        @media (prefers-color-scheme: dark) {
            body {
                background: #12121e;
            }
            .app-container {
                background: #1e1e32;
                border-color: #3d3d5c;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            }
            .title {
                color: #c9a8e6;
            }
            .brand-icon {
                background: #9c4dcc;
            }
            .toolbar {
                background: #2a2a44;
                border-color: #3d3d5c;
            }
            .toolbar-left label {
                color: #c9a8e6;
            }
            .toolbar-left select {
                background: #2d2d4a;
                color: #e0d0f0;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            }
            .toolbar-left select optgroup {
                color: #c9a8e6;
            }
            .toolbar-left select option {
                background: #2d2d4a;
                color: #e0d0f0;
            }
            .ctrl-btn {
                background: #2d2d4a;
                color: #c9a8e6;
                border-color: #4d4d6a;
            }
            .ctrl-btn:hover {
                background: #3d3d5c;
            }
            .ctrl-btn.primary {
                background: linear-gradient(135deg, #7b1fa2, #9c27b0);
                color: #fff;
            }
            .ctrl-btn.secondary {
                background: #3d2a1a;
                border-color: #8a6a3a;
                color: #f0c8a0;
            }
            .ctrl-btn.secondary:hover {
                background: #4d3a2a;
            }
            .stats {
                background: #2a2a44;
                border-color: #3d3d5c;
            }
            .stat-item {
                color: #c9a8e6;
            }
            .stat-item .value {
                background: rgba(255, 255, 255, 0.08);
                color: #e0d0f0;
            }
            .progress-wrap {
                background: #3d3d5c;
            }
            .progress-fill {
                background: linear-gradient(90deg, #9c4dcc, #ce93d8);
            }
            .word-card {
                background: #24243e;
                border-color: #3d3d5c;
                box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.04), 0 4px 16px rgba(0, 0, 0, 0.3);
            }
            .letter-slot {
                background: #1e1e32;
                border-color: #6d4d8a;
                color: #e8e0f0;
            }
            .letter-slot.fixed {
                background: transparent;
                color: #e8e0f0;
            }
            .letter-slot.fixed.space {
                opacity: 0.2;
            }
            .letter-slot.blank {
                border-color: #8d4dba;
                background: #2a2a4a;
                color: #c9a8e6;
            }
            .letter-slot.blank.filled {
                border-color: #4caf50;
                background: #1a3a1a;
                color: #81c784;
            }
            .letter-slot.blank.wrong {
                border-color: #e53935;
                background: #3a1a1a;
                color: #ef9a9a;
            }
            .letter-slot.blank.active {
                border-color: #9c4dcc;
                background: #2a2a4a;
                box-shadow: 0 0 0 3px rgba(156, 77, 204, 0.25);
            }
            .word-info {
                color: #c9a8e6;
            }
            .word-info .phonetic {
                color: #b39ddb;
            }
            .word-info .meaning {
                color: #c9a8e6;
            }
            .word-info .divider {
                color: #6d4d8a;
            }
            .feedback {
                color: #c9a8e6;
            }
            .feedback.success {
                color: #81c784;
            }
            .feedback.error {
                color: #ef9a9a;
            }
            .feedback.info {
                color: #ffb74d;
            }
            .error-msg {
                color: #ef9a9a;
                background: #3a1a1a;
            }
            .keyboard {
                background: #2a2a44;
                border-color: #3d3d5c;
            }
            .kb-key {
                background: #1e1e32;
                color: #e8e0f0;
                border-color: #3d3d5c;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.04);
            }
            .kb-key:active {
                background: #2d2d4a;
            }
            .kb-key.special {
                background: #2d2d4a;
                color: #c9a8e6;
            }
            .kb-key.special:active {
                background: #3d3d5c;
            }
            .kb-key.function {
                background: #2d2d4a;
                border-color: #3d3d5c;
                color: #c9a8e6;
            }
            .kb-key.function:active {
                background: #3d3d5c;
            }
            .kb-key.function.mode-btn {
                background: #3d2d5a;
                border-color: #5d3d7a;
                color: #c9a8e6;
            }
            .kb-key.function.mode-btn.active {
                background: #7b1fa2;
                color: #fff;
                border-color: #7b1fa2;
                box-shadow: 0 2px 8px rgba(106, 27, 154, 0.4);
            }
            .kb-key.function.mode-btn.locked,
            .kb-key.function.locked {
                opacity: 0.3;
            }
            .kb-key.function.start-btn {
                background: linear-gradient(135deg, #7b1fa2, #9c27b0);
                color: #fff;
            }
            .kb-key.correct-highlight {
                background: #1a3a1a;
                border-color: #4caf50;
            }
            .kb-key.wrong-highlight {
                background: #3a1a1a;
                border-color: #e53935;
            }
            .complete-overlay h2 {
                color: #c9a8e6;
            }
            .complete-overlay p {
                color: #b39ddb;
            }
            .complete-overlay .final-stats .num {
                color: #ce93d8;
            }
            .complete-overlay .final-stats .label {
                color: #b39ddb;
            }
        }

        /* ================================================================
           ★★★ 响应式适配 – 手机端 ★★★
           ================================================================ */
        @media (max-width: 820px) {
            .app-container {
                max-height: 94vh;
                padding: 8px 8px 10px;

            }

<body>
    <div class="app-container" id="app">
        <!-- 顶栏 -->
        <div class="header">

    <!-- ================================================================
         主程序脚本（空格不填空 + 完整词库路径）
         ================================================================ -->
    <script>
        // ============================================================
        //  全局变量
        // ============================================================
        let WORDS_DATA = null;
        const DATA_URL = 'https://magua-qi.github.io/englishwords.json';

        // ---- 工具函数 ----
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        // ---- 缓存操作 ----
        const STORAGE_KEY = 'wordGameFullData_v6';

        function saveCache() {
            try {
                const data = {
                    gradePath: state.gradePath,
                    words: state.words,
                    currentIndex: state.currentIndex,
                    completedWords: state.completedWords,
                    correctWords: state.correctWords,
                    slots: state.slots,
                    activeSlotIndex: state.activeSlotIndex,
                    mode: state.mode,
                    isStarted: state.isStarted,
                    isPaused: state.isPaused,
                    elapsedSeconds: state.elapsedSeconds,
                    wordErrorMap: state.wordErrorMap,
                    timestamp: Date.now()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadCache() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data && typeof data === 'object' && data.gradePath && Array.isArray(data.words) && data.words
                        .length > 0) {
                        return data;
                    }
                }
            } catch (e) { /* ignore */ }
            return null;
        }

        function clearCache() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) { /* ignore */ }
        }

        // ---- DOM 引用 ----
        const $ = id => document.getElementById(id);
        const dom = {
            gradeSelect: $('gradeSelect'),
            timerDisplay: $('timerDisplay'),
            accuracyDisplay: $('accuracyDisplay'),
            progressDisplay: $('progressDisplay'),
            progressFill: $('progressFill'),
            wordBlanks: $('wordBlanks'),
            wordPhonetic: $('wordPhonetic'),
            wordMeaning: $('wordMeaning'),
            feedback: $('feedback'),
            wordCard: $('wordCard'),
            keyboard: $('keyboard'),
            completeOverlay: $('completeOverlay'),
            finalAccuracy: $('finalAccuracy'),
            finalTime: $('finalTime'),
            finalTotal: $('finalTotal'),
            restartBtn: $('restartFromCompleteBtn'),
            mainCtrlBtn: $('mainCtrlBtn'),
            resetCtrlBtn: $('resetCtrlBtn'),
            intensiveBtn: $('intensiveBtn'),
            kbKeys: document.querySelectorAll('.kb-key[data-letter]'),
            functionKeys: document.querySelectorAll('.kb-key[data-action]'),
            modeButtons: document.querySelectorAll('.mode-btn'),
        };

        // ---- 状态 ----
        const state = {
            gradePath: [],
            words: [],
            currentIndex: 0,
            slots: [],
            activeSlotIndex: 0,
            totalWords: 0,
            completedWords: 0,
            correctWords: 0,
            startTime: null,
            timerInterval: null,
            elapsedSeconds: 0,
            isFinished: false,
            isPaused: false,
            isStarted: false,
            usedKeys: new Set(),
            mode: 'practice',
            wordErrorMap: {},
        };

        // ---- UI 更新 ----
        function updateFeedback(msg, type = 'info') {
            dom.feedback.textContent = msg;
            dom.feedback.className = 'feedback ' + type;
            clearTimeout(dom.feedback._timeout);
            if (type === 'success' || type === 'error') {
                dom.feedback._timeout = setTimeout(() => {
                    if (!state.isFinished && state.isStarted && !state.isPaused) {
                        dom.feedback.className = 'feedback info';
                        dom.feedback.textContent = '点击键盘填入字母，填完后按 ✅ 确认';
                    }
                }, 2500);
            }
        }

        function updateTimerDisplay() {
            dom.timerDisplay.textContent = formatTime(state.elapsedSeconds);
        }

        function updateStats() {
            const total = state.totalWords;
            const done = state.completedWords;
            const progress = total > 0 ? Math.round((done / total) * 100) : 0;
            dom.progressDisplay.textContent = `${done}/${total}`;
            dom.progressFill.style.width = `${progress}%`;
            dom.accuracyDisplay.textContent = `${state.correctWords}/${total}`;
            updateTimerDisplay();
            if (state.isStarted || state.completedWords > 0) {
                saveCache();
            }
        }

        // ---- 控制按钮状态 ----
        function updateControlButtons() {
            const hasValidWords = state.totalWords > 0 && !state.isFinished;
            if (!state.isStarted) {
                dom.mainCtrlBtn.textContent = '开始';
                dom.mainCtrlBtn.disabled = !hasValidWords;
                dom.resetCtrlBtn.disabled = true;
                dom.intensiveBtn.classList.remove('locked');
            } else if (state.isPaused) {
                dom.mainCtrlBtn.textContent = '继续';
                dom.mainCtrlBtn.disabled = false;
                dom.resetCtrlBtn.disabled = false;
                dom.resetCtrlBtn.textContent = '重新开始';
                dom.intensiveBtn.classList.add('locked');
            } else {
                dom.mainCtrlBtn.textContent = '暂停';
                dom.mainCtrlBtn.disabled = false;
                dom.resetCtrlBtn.disabled = false;
                dom.resetCtrlBtn.textContent = '重新开始';
                dom.intensiveBtn.classList.add('locked');
            }
            if (state.isFinished) {
                dom.mainCtrlBtn.disabled = true;
                dom.resetCtrlBtn.disabled = true;
                dom.intensiveBtn.classList.remove('locked');
            }
            if (!hasValidWords && !state.isStarted) {
                dom.mainCtrlBtn.disabled = true;
            }
            const modeLocked = state.isStarted && !state.isFinished;
            dom.modeButtons.forEach(btn => {
                if (modeLocked) {
                    btn.classList.add('locked');
                } else {
                    btn.classList.remove('locked');
                }
            });
            if (!state.isStarted && state.totalWords > 0) {
                dom.resetCtrlBtn.disabled = false;
            }
        }

        // ---- 重置进度（保留错词记录） ----
        function resetProgress() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.isStarted = false;
            state.isPaused = false;
            state.isFinished = false;
            state.completedWords = 0;
            state.correctWords = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.startTime = null;
            const words = getWordsByPath(state.gradePath);
            if (words && words.length > 0) {
                state.words = shuffle([...words]);
                state.totalWords = state.words.length;
            }
            state.slots = [];
            state.activeSlotIndex = 0;
            renderWord();
            updateStats();
            updateControlButtons();
            enableInteraction(false);
            updateFeedback('已重置，请选择模式后点击「开始」', 'info');
            saveCache();
        }

        // ---- 开始/暂停/继续 ----
        function toggleMainControl() {
            if (!state.isStarted) {
                if (!state.gradePath || state.totalWords === 0) {
                    updateFeedback('请先选择有效词库', 'error');
                    return;
                }
                state.isStarted = true;
                state.isPaused = false;
                state.startTime = Date.now() - state.elapsedSeconds * 1000;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                    updateTimerDisplay();
                    saveCache();
                }, 200);
                enableInteraction(true);
                updateFeedback('练习开始！', 'success');
                updateControlButtons();
                updateStats();
                if (state.totalWords > 0 && state.currentIndex === 0 && state.completedWords === 0) {
                    loadWord();
                } else {
                    renderWord();
                }
                saveCache();
            } else if (state.isPaused) {
                state.isPaused = false;
                state.startTime = Date.now() - state.elapsedSeconds * 1000;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                    updateTimerDisplay();
                    saveCache();
                }, 200);
                enableInteraction(true);
                updateFeedback('继续练习', 'info');
                updateControlButtons();
                saveCache();
            } else {
                state.isPaused = true;
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                enableInteraction(false);
                updateFeedback('已暂停', 'info');
                updateControlButtons();
                saveCache();
            }
        }

        // ---- 启用/禁用交互 ----
        function enableInteraction(enabled) {
            dom.kbKeys.forEach(k => {
                k.style.pointerEvents = enabled ? 'auto' : 'none';
                k.style.opacity = enabled ? '1' : '0.5';
            });
            dom.functionKeys.forEach(k => {
                if (k.dataset.mode) return;
                if (k.id === 'intensiveBtn') return;
                k.style.pointerEvents = enabled ? 'auto' : 'none';
                k.style.opacity = enabled ? '1' : '0.5';
            });
            dom.modeButtons.forEach(k => {
                if (k.classList.contains('locked')) {
                    k.style.pointerEvents = 'none';
                    k.style.opacity = '0.5';
                } else {
                    k.style.pointerEvents = 'auto';
                    k.style.opacity = '1';
                }
            });
            const intensive = dom.intensiveBtn;
            if (intensive.classList.contains('locked')) {
                intensive.style.pointerEvents = 'none';
                intensive.style.opacity = '0.5';
            } else {
                intensive.style.pointerEvents = 'auto';
                intensive.style.opacity = '1';
            }
            const slots = dom.wordBlanks.querySelectorAll('.letter-slot');
            slots.forEach(el => {
                el.style.pointerEvents = enabled ? 'auto' : 'none';
                el.style.opacity = enabled ? '1' : '0.6';
            });
        }

        // ================================================================
        //  多层目录支持（深度优先遍历，保留JSON顺序）
        // ================================================================
        function getAllLeafNodes(data, path = []) {
            let leaves = [];
            if (Array.isArray(data)) {
                leaves.push({ path: [...path], words: data });
            } else if (data && typeof data === 'object') {
                for (const [key, value] of Object.entries(data)) {
                    const newPath = [...path, key];
                    const childLeaves = getAllLeafNodes(value, newPath);
                    leaves = leaves.concat(childLeaves);
                }
            }
            return leaves;
        }

        function getWordsByPath(pathArray) {
            if (!WORDS_DATA) return null;
            let data = WORDS_DATA;
            for (const key of pathArray) {
                if (data && typeof data === 'object' && key in data) {
                    data = data[key];
                } else {
                    return null;
                }
            }
            return Array.isArray(data) ? data : null;
        }

        // ---- 词库下拉菜单：按JSON顺序分级，显示完整路径 ----
        function buildGradeSelect() {
            const select = dom.gradeSelect;
            select.innerHTML = '';
            if (!WORDS_DATA) {
                const opt = document.createElement('option');
                opt.textContent = '加载中...';
                select.appendChild(opt);
                return;
            }

            const topKeys = Object.keys(WORDS_DATA);
            if (topKeys.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = '无可用词库';
                select.appendChild(opt);
                return;
            }

            for (const topKey of topKeys) {
                const leaves = getAllLeafNodes(WORDS_DATA[topKey], [topKey]);
                if (leaves.length === 0) continue;

                const optgroup = document.createElement('optgroup');
                optgroup.label = topKey;
                for (const leaf of leaves) {
                    const option = document.createElement('option');
                    option.value = leaf.path.join('|||');
                    // 显示完整路径
                    option.textContent = leaf.path.join(' > ');
                    optgroup.appendChild(option);
                }
                select.appendChild(optgroup);
            }
        }

        // ---- 生成 slots（空格自动固定） ----
        function generateSlots(wordObj, mode) {
            const word = wordObj.word;
            const chars = word.split('');
            // 空格位置不参与填空
            const nonSpaceIndices = [];
            const fixedIndices = new Set();
            for (let i = 0; i < chars.length; i++) {
                if (chars[i] === ' ') {
                    fixedIndices.add(i);
                } else {
                    nonSpaceIndices.push(i);
                }
            }

            let blankIndices = new Set();
            if (nonSpaceIndices.length > 0) {
                if (mode === 'practice') {
                    // 练习模式：抽取约 40% 的字母作为填空（至少1个）
                    const blankCount = Math.max(1, Math.min(nonSpaceIndices.length - 1, Math.floor(nonSpaceIndices.length *
                    0.4)));
                    const shuffled = shuffle([...nonSpaceIndices]);
                    const selected = shuffled.slice(0, blankCount);
                    blankIndices = new Set(selected);
                } else {
                    // 听写模式：所有非空格字母都填空
                    blankIndices = new Set(nonSpaceIndices);
                }
            }

            // 如果填空数为0（例如只有空格或长度为1），强制至少一个字母填空
            if (blankIndices.size === 0 && nonSpaceIndices.length > 0) {
                blankIndices.add(nonSpaceIndices[0]);
            }

            const slots = chars.map((char, idx) => {
                const isBlank = blankIndices.has(idx);
                // 空格永远是固定
                const isFixed = !isBlank || char === ' ';
                return {
                    char: char,
                    isBlank: isBlank && char !== ' ',
                    filled: false,
                    correct: false,
                    wrong: false,
                    value: '',
                    isSpace: char === ' ',
                };
            });
            return slots;
        }

        // ---- 核心逻辑 ----
        function initGame(gradePath, resume = false) {
            try {
                console.log('初始化词库路径:', gradePath, '恢复模式:', resume);
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }

                let pathArray;
                if (typeof gradePath === 'string') {
                    pathArray = gradePath.split('|||');
                } else if (Array.isArray(gradePath)) {
                    pathArray = gradePath;
                } else {
                    pathArray = [];
                }
                state.gradePath = pathArray;

                let cache = null;
                if (resume) {
                    cache = loadCache();
                    if (cache && cache.gradePath && Array.isArray(cache.gradePath)) {
                        const cachePathStr = cache.gradePath.join('|||');
                        const currentPathStr = pathArray.join('|||');
                        if (cachePathStr === currentPathStr) {
                            console.log('找到有效缓存，正在恢复...');
                            state.words = cache.words || [];
                            state.currentIndex = cache.currentIndex || 0;
                            state.completedWords = cache.completedWords || 0;
                            state.correctWords = cache.correctWords || 0;
                            state.slots = cache.slots || [];
                            state.activeSlotIndex = cache.activeSlotIndex || 0;
                            state.mode = cache.mode || 'practice';
                            state.isStarted = cache.isStarted || false;
                            state.isPaused = true;
                            state.elapsedSeconds = cache.elapsedSeconds || 0;
                            state.wordErrorMap = cache.wordErrorMap || {};
                            state.totalWords = state.words.length;
                            state.isFinished = (state.completedWords >= state.totalWords && state.totalWords > 0);
                            state.usedKeys = new Set();
                            state.startTime = null;

                            dom.gradeSelect.value = pathArray.join('|||');
                            dom.completeOverlay.classList.add('hidden');
                            dom.wordCard.classList.remove('hidden');
                            dom.keyboard.classList.remove('hidden');
                            dom.kbKeys.forEach(k => k.className = 'kb-key');
                            dom.modeButtons.forEach(btn => {
                                btn.classList.toggle('active', btn.dataset.mode === state.mode);
                            });

                            if (state.isFinished) {
                                finishGame();
                            } else {
                                if (!state.slots || state.slots.length === 0) {
                                    const wordObj = state.words[state.currentIndex];
                                    if (wordObj) {
                                        state.slots = generateSlots(wordObj, state.mode);
                                        state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                                    }
                                }
                                renderWord();
                            }
                            updateStats();
                            updateControlButtons();
                            enableInteraction(false);
                            if (state.isStarted) {
                                updateFeedback('已暂停，点击「继续」恢复', 'info');
                            } else {
                                updateFeedback('点击「开始」按钮开始练习', 'info');
                            }
                            dom.resetCtrlBtn.disabled = false;
                            console.log('缓存恢复完成（强制暂停）');
                            return;
                        } else {
                            console.log('缓存路径不匹配，忽略缓存');
                            clearCache();
                        }
                    } else {
                        console.log('缓存无效或路径不匹配');
                        clearCache();
                    }
                }

                const words = getWordsByPath(pathArray);
                if (!words || words.length === 0) {
                    dom.wordBlanks.innerHTML = '<span style="color:#999;">该词库暂无词汇</span>';
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    dom.progressDisplay.textContent = '0/0';
                    dom.progressFill.style.width = '0%';
                    dom.accuracyDisplay.textContent = '0/0';
                    dom.timerDisplay.textContent = '00:00';
                    dom.feedback.textContent = '请选择有效词库';
                    dom.feedback.className = 'feedback info';
                    state.isFinished = true;
                    state.totalWords = 0;
                    state.isStarted = false;
                    state.isPaused = false;
                    state.words = [];
                    state.gradePath = pathArray;
                    state.wordErrorMap = {};
                    enableInteraction(false);
                    updateControlButtons();
                    clearCache();
                    return;
                }

                state.words = shuffle([...words]);
                state.totalWords = state.words.length;
                state.completedWords = 0;
                state.correctWords = 0;
                state.elapsedSeconds = 0;
                state.currentIndex = 0;
                state.isFinished = false;
                state.usedKeys = new Set();
                state.isStarted = false;
                state.isPaused = false;
                state.startTime = null;
                state.slots = [];
                state.activeSlotIndex = 0;
                state.mode = 'practice';

                dom.completeOverlay.classList.add('hidden');
                dom.wordCard.classList.remove('hidden');
                dom.keyboard.classList.remove('hidden');
                dom.kbKeys.forEach(k => k.className = 'kb-key');
                dom.gradeSelect.value = pathArray.join('|||');
                dom.modeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === 'practice');
                });

                renderWord();
                updateStats();
                updateFeedback('点击「开始」按钮开始练习', 'info');
                enableInteraction(false);
                updateControlButtons();
                dom.resetCtrlBtn.disabled = false;
                clearCache();
            } catch (err) {
                console.error(err);
                updateFeedback('初始化失败：' + err.message, 'error');
            }
        }

        // ---- 加载指定索引的单词 ----
        function goToWord(index) {
            if (state.isFinished) return;
            if (index < 0 || index >= state.totalWords) return;
            state.currentIndex = index;
            const wordObj = state.words[index];
            if (!wordObj) return;
            const word = wordObj.word;
            const chars = word.split('');
            const isCompleted = (index < state.completedWords);
            if (isCompleted) {
                state.slots = chars.map((char) => ({
                    char,
                    isBlank: false,
                    filled: true,
                    correct: true,
                    wrong: false,
                    value: char,
                    isSpace: char === ' ',
                }));
                state.activeSlotIndex = -1;
                updateFeedback('已完成的单词', 'success');
            } else {
                state.slots = generateSlots(wordObj, state.mode);
                state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                if (state.isStarted && !state.isPaused) {
                    updateFeedback('点击键盘填入字母，填完后按 ✅ 确认', 'info');
                }
            }
            state.usedKeys = new Set();
            dom.kbKeys.forEach(k => k.className = 'kb-key');
            renderWord();
            updateStats();
            if (state.isStarted && !state.isPaused && !state.isFinished) {
                enableInteraction(true);
            } else {
                enableInteraction(false);
            }
            saveCache();
        }

        function loadWord() {
            try {
                if (state.currentIndex >= state.totalWords) {
                    finishGame();
                    return;
                }
                goToWord(state.currentIndex);
            } catch (err) {
                console.error(err);
                updateFeedback('加载单词出错', 'error');
            }
        }

        // ---- 渲染 ----
        function renderWord() {
            try {
                if (!state.isStarted) {
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    dom.wordBlanks.innerHTML = '<span style="color:#999; font-size:18px;">点击「开始」按钮开始练习</span>';
                    return;
                }

                const wordObj = state.words[state.currentIndex];
                if (!wordObj) {
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    dom.wordBlanks.innerHTML = '<span style="color:#999;">数据异常</span>';
                    return;
                }
                dom.wordPhonetic.textContent = wordObj.phonetic || '';
                dom.wordMeaning.textContent = wordObj.meaning || '';

                const container = dom.wordBlanks;
                container.innerHTML = '';
                container.classList.remove('animate-in');

                if (!state.slots || state.slots.length === 0) {
                    container.innerHTML = '<span style="color:#999;">无数据</span>';
                    return;
                }

                state.slots.forEach((slot, idx) => {
                    const el = document.createElement('span');
                    el.className = 'letter-slot';
                    el.dataset.index = idx;
                    if (slot.isSpace) {
                        // 空格固定，透明占位
                        el.classList.add('fixed', 'space');
                        el.textContent = '\u00A0';
                    } else if (slot.isBlank) {
                        el.classList.add('blank');
                        if (slot.filled && slot.correct) {
                            el.classList.add('filled');
                            el.textContent = slot.value;
                        } else if (slot.filled && slot.wrong) {
                            el.classList.add('wrong');
                            el.textContent = slot.value;
                        } else if (slot.filled) {
                            el.classList.add('filled');
                            el.textContent = slot.value;
                        } else {
                            el.textContent = '';
                        }
                        if (idx === state.activeSlotIndex && !slot.filled) {
                            el.classList.add('active');
                        }
                    } else {
                        el.classList.add('fixed');
                        el.textContent = slot.char;
                    }
                    if (!slot.isSpace) {
                        el.addEventListener('click', () => {
                            if (state.isFinished) return;
                            if (!state.isStarted || state.isPaused) {
                                updateFeedback('请先开始练习', 'info');
                                return;
                            }
                            if (slot.isBlank && !slot.filled) {
                                setActiveSlot(idx);
                            }
                        });
                    }
                    container.appendChild(el);
                });

                void container.offsetWidth;
                container.classList.add('animate-in');

            } catch (err) {
                console.error(err);
                dom.wordBlanks.innerHTML = `<span class="error-msg">渲染错误</span>`;
            }
        }

        function setActiveSlot(index) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            const slot = state.slots[index];
            if (!slot || !slot.isBlank || slot.filled) return;
            state.activeSlotIndex = index;
            renderWord();
            const allSlots = dom.wordBlanks.querySelectorAll('.letter-slot');
            allSlots.forEach((el, i) => {
                if (i === index && state.slots[i].isBlank && !state.slots[i].filled) {
                    el.classList.add('active');
                }
            });
            saveCache();
        }

        // ---- 验证函数 ----
        function validateWord() {
            const blanks = state.slots.filter(s => s.isBlank);
            if (blanks.some(s => !s.filled)) {
                updateFeedback('还有空位未填，请继续输入', 'info');
                return false;
            }
            let correctCount = 0;
            let wrongCount = 0;
            const currentWord = state.words[state.currentIndex].word;
            for (const slot of blanks) {
                if (slot.value.toLowerCase() === slot.char.toLowerCase()) {
                    slot.correct = true;
                    slot.wrong = false;
                    correctCount++;
                } else {
                    slot.correct = false;
                    slot.wrong = true;
                    wrongCount++;
                    if (!state.wordErrorMap[currentWord]) {
                        state.wordErrorMap[currentWord] = 0;
                    }
                    state.wordErrorMap[currentWord]++;
                }
            }

            const isAllCorrect = (wrongCount === 0);
            state.completedWords++;

            if (isAllCorrect) {
                state.correctWords++;
                updateFeedback('全部正确！', 'success');
            } else {
                updateFeedback(`有 ${wrongCount} 个错误`, 'error');
            }

            if (state.mode === 'dictation') {
                const nextIndex = state.currentIndex + 1;
                if (nextIndex < state.totalWords) {
                    goToWord(nextIndex);
                } else {
                    finishGame();
                }
                updateStats();
                saveCache();
                return true;
            } else {
                if (isAllCorrect) {
                    const nextIndex = state.currentIndex + 1;
                    if (nextIndex < state.totalWords) {
                        setTimeout(() => {
                            goToWord(nextIndex);
                        }, 400);
                    } else {
                        setTimeout(() => {
                            finishGame();
                        }, 400);
                    }
                    updateStats();
                    saveCache();
                    return true;
                } else {
                    updateFeedback('有错误，请重新输入', 'error');
                    for (const slot of state.slots) {
                        if (slot.isBlank) {
                            slot.filled = false;
                            slot.correct = false;
                            slot.wrong = false;
                            slot.value = '';
                        }
                    }
                    state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                    state.completedWords--;
                    renderWord();
                    updateStats();
                    saveCache();
                    return false;
                }
            }
        }

        // ---- 键盘输入 ----
        function handleKeyInput(letter) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            if (state.currentIndex < state.completedWords) {
                updateFeedback('该单词已完成，不可编辑', 'info');
                return;
            }
            try {
                if (letter === '⌫') {
                    for (let i = state.slots.length - 1; i >= 0; i--) {
                        const s = state.slots[i];
                        if (s.isBlank && s.filled) {
                            s.filled = false;
                            s.correct = false;
                            s.wrong = false;
                            s.value = '';
                            state.activeSlotIndex = i;
                            renderWord();
                            updateFeedback('已退格', 'info');
                            saveCache();
                            return;
                        }
                    }
                    updateFeedback('没有可退格的内容', 'info');
                    return;
                }
                if (letter === 'ENT') {
                    validateWord();
                    return;
                }
                let activeIdx = state.activeSlotIndex;
                let slot = state.slots[activeIdx];
                if (!slot || !slot.isBlank || slot.filled) {
                    const first = state.slots.findIndex(s => s.isBlank && !s.filled);
                    if (first === -1) {
                        updateFeedback('所有空位已填，请按 ✅ 确认', 'success');
                        return;
                    }
                    activeIdx = first;
                    state.activeSlotIndex = activeIdx;
                    renderWord();
                    slot = state.slots[activeIdx];
                }
                if (!slot.isBlank || slot.filled) return;

                slot.filled = true;
                slot.value = letter;
                slot.correct = false;
                slot.wrong = false;

                const next = state.slots.findIndex((s, idx) => s.isBlank && !s.filled && idx > activeIdx);
                if (next !== -1) {
                    state.activeSlotIndex = next;
                } else {
                    updateFeedback('所有空位已填，请按 ✅ 确认', 'success');
                    state.activeSlotIndex = -1;
                }
                renderWord();
                updateStats();
                saveCache();
            } catch (err) {
                console.error(err);
                updateFeedback('输入处理出错', 'error');
            }
        }

        // ---- 提示 ----
        function useHint() {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            if (state.currentIndex < state.completedWords) {
                updateFeedback('该单词已完成', 'info');
                return;
            }
            try {
                const blankIdx = state.slots.findIndex(s => s.isBlank && !s.filled);
                if (blankIdx === -1) {
                    updateFeedback('所有空位已填，请按 ✅ 确认', 'success');
                    return;
                }
                const slot = state.slots[blankIdx];
                updateFeedback(`提示：正确字母是 “${slot.char}”`, 'info');
            } catch (err) {
                console.error(err);
                updateFeedback('提示功能出错', 'error');
            }
        }

        // ---- 模式切换 ----
        function switchMode(mode) {
            if (state.isStarted) {
                updateFeedback('练习进行中，模式已锁定', 'error');
                return;
            }
            if (state.mode === mode) return;
            state.mode = mode;
            dom.modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (state.words.length > 0 && state.currentIndex < state.totalWords && state.currentIndex >= state
                .completedWords) {
                const wordObj = state.words[state.currentIndex];
                state.slots = generateSlots(wordObj, mode);
                state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                dom.kbKeys.forEach(k => k.className = 'kb-key');
                renderWord();
                updateFeedback(`已切换至 ${mode === 'practice' ? '练习' : '听写'} 模式`, 'info');
                saveCache();
            }
        }

        // ---- 加强模式 ----
        function startIntensiveMode() {
            if (state.isStarted && !state.isPaused) {
                updateFeedback('请先暂停或结束当前练习', 'error');
                return;
            }
            const errorWords = state.words.filter(w => state.wordErrorMap[w.word] && state.wordErrorMap[w.word] > 0);
            if (errorWords.length === 0) {
                updateFeedback('当前词库暂无高频错词，继续练习吧', 'info');
                return;
            }
            errorWords.sort((a, b) => (state.wordErrorMap[b.word] || 0) - (state.wordErrorMap[a.word] || 0));
            const count = Math.max(5, Math.ceil(errorWords.length * 0.3));
            const selected = errorWords.slice(0, count);
            state.words = shuffle([...selected]);
            state.totalWords = state.words.length;
            state.completedWords = 0;
            state.correctWords = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.isFinished = false;
            state.isStarted = false;
            state.isPaused = false;
            state.slots = [];
            state.activeSlotIndex = 0;
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            dom.completeOverlay.classList.add('hidden');
            dom.wordCard.classList.remove('hidden');
            dom.keyboard.classList.remove('hidden');
            renderWord();
            updateStats();
            updateControlButtons();
            enableInteraction(false);
            updateFeedback(`已切换至「加强」模式，共 ${state.totalWords} 个高频错词，点击「开始」练习`, 'success');
            saveCache();
        }

        function finishGame() {
            try {
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                state.isFinished = true;
                state.isStarted = false;
                state.isPaused = false;
                dom.wordCard.classList.add('hidden');
                dom.keyboard.classList.add('hidden');
                dom.completeOverlay.classList.remove('hidden');
                dom.finalAccuracy.textContent = `${state.correctWords}/${state.totalWords}`;
                dom.finalTime.textContent = formatTime(state.elapsedSeconds);
                dom.finalTotal.textContent = state.completedWords;
                dom.progressFill.style.width = '100%';
                dom.progressDisplay.textContent = `${state.completedWords}/${state.totalWords}`;
                enableInteraction(false);
                updateControlButtons();
                clearCache();
                saveCache();
            } catch (err) {
                console.error(err);
            }
        }

        // ---- 导航 ----
        function goPrev() {
            if (state.isFinished) return;
            if (state.currentIndex > 0) {
                goToWord(state.currentIndex - 1);
            }
        }

        function goNext() {
            if (state.isFinished) return;
            if (state.currentIndex < state.totalWords - 1) {
                goToWord(state.currentIndex + 1);
            }
        }

        // ---- 事件绑定 ----
        dom.gradeSelect.addEventListener('change', function() {
            const value = this.value;
            if (!value) return;
            const pathArray = value.split('|||');
            if (pathArray.join('|||') !== state.gradePath.join('|||')) {
                clearCache();
                state.isStarted = false;
                state.isPaused = false;
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                initGame(pathArray, false);
                updateControlButtons();
                enableInteraction(false);
            }
        });

        dom.kbKeys.forEach(key => {
            key.addEventListener('click', function() {
                const letter = this.dataset.letter;
                if (letter) handleKeyInput(letter);
            });
            key.addEventListener('touchstart', function(e) {
                // 防止页面缩放
            }, { passive: true });
        });

        dom.functionKeys.forEach(key => {
            key.addEventListener('click', function() {
                const action = this.dataset.action;
                if (action === 'prev') goPrev();
                else if (action === 'hint') useHint();
                else if (action === 'next') goNext();
            });
        });

        dom.modeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const mode = this.dataset.mode;
                switchMode(mode);
            });
        });

        dom.intensiveBtn.addEventListener('click', startIntensiveMode);

        document.addEventListener('keydown', function(e) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) return;
            const key = e.key.toUpperCase();
            if (key === 'BACKSPACE' || key === 'DELETE') {
                e.preventDefault();
                handleKeyInput('⌫');
                return;
            }
            if (key === 'ENTER') {
                e.preventDefault();
                handleKeyInput('ENT');
                return;
            }
            const lowerKey = e.key.toLowerCase();
            if (/^[a-z]$/.test(lowerKey)) {
                e.preventDefault();
                handleKeyInput(lowerKey);
            }
        });

        dom.restartBtn.addEventListener('click', function() {
            clearCache();
            state.isStarted = false;
            state.isPaused = false;
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            const words = getWordsByPath(state.gradePath);
            if (words && words.length > 0) {
                state.words = shuffle([...words]);
                state.totalWords = state.words.length;
            }
            state.completedWords = 0;
            state.correctWords = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.isFinished = false;
            state.slots = [];
            state.activeSlotIndex = 0;
            dom.completeOverlay.classList.add('hidden');
            dom.wordCard.classList.remove('hidden');
            dom.keyboard.classList.remove('hidden');
            renderWord();
            updateStats();
            updateControlButtons();
            enableInteraction(false);
            updateFeedback('已重置，请选择模式后点击「开始」', 'info');
            saveCache();
        });

        dom.mainCtrlBtn.addEventListener('click', toggleMainControl);
        dom.resetCtrlBtn.addEventListener('click', function() {
            dom.restartBtn.click();
        });

        // ============================================================
        //  数据加载、构建下拉框并启动
        // ============================================================
        function initApp() {
            buildGradeSelect();

            let defaultPath = null;
            const cache = loadCache();
            if (cache && cache.gradePath && Array.isArray(cache.gradePath)) {
                const words = getWordsByPath(cache.gradePath);
                if (words && words.length > 0) {
                    defaultPath = cache.gradePath;
                }
            }
            if (!defaultPath) {
                const topKeys = Object.keys(WORDS_DATA);
                if (topKeys.length > 0) {
                    const firstTop = topKeys[0];
                    const leaves = getAllLeafNodes(WORDS_DATA[firstTop], [firstTop]);
                    if (leaves.length > 0) {
                        defaultPath = leaves[0].path;
                    }
                }
            }
            if (defaultPath) {
                dom.gradeSelect.value = defaultPath.join('|||');
            }
            dom.modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === state.mode);
            });
            initGame(defaultPath || [], true);
            updateControlButtons();
            enableInteraction(false);
            console.log('单词记忆工具已启动（空格固定 + 完整词库路径）');
        }

        // ---- 加载 JSON 数据 ----
        async function loadData() {
            try {
                dom.feedback.textContent = '加载词库中...';
                dom.feedback.className = 'feedback info';

                const response = await fetch(DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                WORDS_DATA = json;

                if (typeof WORDS_DATA !== 'object' || Object.keys(WORDS_DATA).length === 0) {
                    throw new Error('词库数据为空或格式错误');
                }

                console.log('词库加载成功，共', Object.keys(WORDS_DATA).length, '个分类');
                dom.feedback.textContent = '词库加载成功！';
                dom.feedback.className = 'feedback success';

                initApp();
            } catch (err) {
                console.error('加载词库失败:', err);
                document.querySelector('.app-container').innerHTML = `
                        <div style="text-align:center;padding:40px;color:#c62828;">
                            <h2>词库加载失败</h2>
                            <p>无法从 <code>${DATA_URL}</code> 加载词库数据</p>
                            <p style="font-size:14px;color:#999;">${err.message}</p>
                            <button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;border:none;border-radius:30px;background:#7b1fa2;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">重新加载</button>
                        </div>
                    `;
            }
        }

        // ---- 启动 ----
        loadData();
    </script>
</body>
</html>
