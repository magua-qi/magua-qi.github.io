<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词记忆练习</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237b1fa2'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        /* ================================================================
           全局重置 & 基础布局
           ================================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #f5f0f8;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px; /* 页面外边距，防止内容紧贴屏幕边缘，移动端留出呼吸空间 */
        }

        /* ================================================================
           主容器 – 可调整整体宽度和高度
           ================================================================ */
        .app-container {
            max-width: 820px;          /* ★ 限制最大宽度，避免大屏过宽，保持阅读舒适度 */
            width: 100%;
            height: 100%;
            max-height: 58vh;          /* ★ 限制最大高度为视口高度的73%，留出上下边距 */
            background: #ffffff;
            border-radius: 10px;       /* 容器外边框圆角，使界面圆润 */
            padding: 14px 12px 16px;   /* 上14px、左右12px、下16px，内容不贴边 */
            box-shadow: 0 8px 32px rgba(106, 13, 173, 0.12); /* 阴影偏移 8px垂直、32px模糊，营造浮起感 */
            border: 1px solid #ede7f6; /* 边框宽度1px，增加视觉边界 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶栏 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 10px; /* 与下方工具栏的间距 */
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 25px;  /* 品牌图标宽度 */
            height: 25px; /* 品牌图标高度 */
            background: #7b1fa2;
            border-radius: 10px; /* 图标圆角 */
            font-size: 12px;     /* 图标内文字大小 */
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            flex-shrink: 0;
            user-select: none;
        }
        .title {
            font-size: 20px; /* 标题文字大小 */
            font-weight: 800;
            color: #4a148c;
            letter-spacing: 0.3px;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            background: #f3e5f5;
            border-radius: 10px; /* 工具栏圆角 */
            padding: 15px 14px 15px 14px; /* 上下15px，右15px，左14px，内部留白 */
            margin-bottom: 10px; /* 与下方统计栏的间距 */
            flex-shrink: 0;
            border: 1px solid #e1bee7; /* 边框宽度1px */
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .toolbar-left label {
            font-size: 13px; /* 标签文字大小 */
            font-weight: 600;
            color: #6a1b9a;
            white-space: nowrap;
        }
        .toolbar-left select {
            padding: 4px 8px;  /* 下拉框内边距上下4px左右8px */
            border: none;
            border-radius: 10px; /* 下拉框圆角 */
            font-size: 14px;     /* 下拉框文字大小 */
            font-weight: 600;
            background: #ffffff;
            color: #4a148c;
            outline: none;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            width: 100%;
            min-width: 100px;  /* 最小宽度，保证显示完整 */
            max-width: 300px;
        }
        .toolbar-left select optgroup {
            font-weight: 700;
            color: #6a1b9a;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .ctrl-btn {
            padding: 5px 14px;  /* 按钮内边距上下5px左右14px */
            border: none;
            border-radius: 10px; /* 按钮圆角 */
            font-size: 14px;     /* 按钮文字大小 */
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ede7f6;
            color: #4a148c;
            border: 1px solid #d1c4e9; /* 边框宽度1px */
            white-space: nowrap;
        }
        .ctrl-btn:hover { background: #d1c4e9; transform: scale(1.02); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.primary {
            background: linear-gradient(135deg, #7b1fa2, #9c27b0);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(106, 27, 154, 0.25); /* 阴影偏移 4px垂直、12px模糊，突出主按钮 */
        }
        .ctrl-btn.primary:hover { box-shadow: 0 6px 20px rgba(106, 27, 154, 0.35); } /* 悬停阴影加深 */
        .ctrl-btn.secondary {
            background: #fff3e0;
            border-color: #ffcc80;
            color: #e65100;
        }
        .ctrl-btn.secondary:hover { background: #ffe0b2; }
        .ctrl-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none;
        }

        /* ===== 统计栏 ===== */
        .stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            background: #f3e5f5;
            border-radius: 10px; /* 圆角 */
            padding: 15px 14px;   /* 上下15px左右14px内边距 */
            margin-bottom: 20px; /* 与单词卡片的间距 */
            gap: 4px 10px;
            border: 1px solid #e1bee7; /* 边框宽度1px */
            flex-shrink: 0;
        }
        .stat-item {
            font-size: 12px; /* 统计文字大小 */
            font-weight: 600;
            color: #4a148c;
        }
        .stat-item .value {
            background: rgba(255,255,255,0.7);
            padding: 0 6px;          /* 数值左右内边距 */
            border-radius: 10px;     /* 数值圆角 */
            font-weight: 700;
            color: #311b92;
            display: inline-block;
            min-width: 32px;         /* 最小宽度，使数字显示整齐 */
            text-align: center;
        }
        .stat-item .value.time { min-width: 48px; } /* 时间数字最小宽度，防止跳变（如00:00->59:59） */
        .progress-wrap {
            flex: 1;
            min-width: 50px;
            height: 6px;             /* 进度条高度 */
            background: #d1c4e9;
            border-radius: 10px;     /* 进度条圆角 */
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7b1fa2, #ab47bc);
            border-radius: 10px;     /* 进度填充圆角 */
            transition: width 0.4s ease;
        }

        /* ================================================================
           单词卡片 – 两行布局：字母格 + 音标/释义（进度仅存在于统计栏）
           ================================================================ */
        .word-card {
            background: #faf5ff;
            border-radius: 10px;          /* 卡片圆角 */
            padding: 80px 20px 16px;      /* ★ 顶部80px、左右20px、底部16px，控制卡片内部留白 */
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 4px 16px rgba(106, 27, 154, 0.08);
            margin-bottom: 20px;           /* 与键盘的间距 */
            border: 1px solid #ede7f6;    /* 边框宽度1px */
            flex: 0 1 auto;
            display: flex;
            flex-direction: column;       /* 纵向排列两行 */
            align-items: center;          /* 水平居中 */
            justify-content: center;      /* 垂直居中（若内容高度不足） */
           
        }
        .word-blanks-wrapper {
           margin-bottom: 30px;   /* ★ 第一行（字母格）与第二行（音标+释义）的间距 */
        }       
        .word-info {
           margin-bottom: 70px;   /* ★ 第二行与第三行（反馈信息）的间距 */
        }
       .feedback {
           margin-bottom: 0;      /* 最后一项无需底部外边距（可省略） */
         }

        /* ---- 第一行：字母格 ---- */
        .word-blanks-wrapper {
            width: 100%;                  /* 占满卡片宽度 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 0;               /* 上下内边距2px */
        }
        .word-blanks {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3px 2px;                 /* 行间隙3px，列间隙2px，字母格之间的间距 */
            padding: 2px 0;               /* 上下内边距2px */
            will-change: transform, opacity;
            min-height: 50px;             /* 最小高度，占位防止空白 */
        }
        .word-blanks.animate-in {
            animation: fadeSlideIn 0.3s ease-out forwards;
        }
        @keyframes fadeSlideIn {
            0% { opacity: 0; transform: translateY(6px); } /* 入场动画：向下偏移6px */
            100% { opacity: 1; transform: translateY(0); } /* 最终归位 */
        }

        /* --- 字母格 --- */
        .letter-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;                 /* ★ 字母格宽度 */
            height: 50px;                /* ★ 字母格高度 */
            font-size: 40px;             /* ★ 字母格内字体大小 */
            font-weight: 700;
            border-radius: 10px;         /* 字母格圆角 */
            background: #ffffff;
            border: 2.5px solid #ce93d8; /* 边框宽度2.5px */
            color: #1a1a2e;
            transition: all 0.2s ease;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            user-select: none;
        }
        .letter-slot.blank {
            border-color: #9c27b0;
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .letter-slot.blank::after {
            content: '_';
            color: #7b1fa2;
            font-weight: 300;
            opacity: 0.7;
        }
        .letter-slot.blank.filled {
            border-color: #2e7d32;
            background: #e8f5e9;
            color: #1b5e20;
        }
        .letter-slot.blank.filled::after { content: none; }
        .letter-slot.blank.wrong {
            border-color: #c62828;
            background: #ffebee;
            color: #b71c1c;
            animation: shake 0.35s ease;
        }
        .letter-slot.blank.wrong::after { content: none; }
        .letter-slot.blank.active {
            border-color: #7b1fa2;
            background: #ede7f6;
            box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.15);
            transform: scale(1.05);
        }
        .letter-slot.fixed {
            border-color: transparent;
            background: transparent;
            color: #1a1a2e;
            width: 40px;                 /* 固定字母格宽度（略小） */
            height: 50px;                /* 固定字母格高度（略高） */
            font-size:40px;             /* 固定字母格字体大小 */
        }
        .letter-slot.fixed::after { content: none; }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-5px)}  /* 向左晃动5px */
            40%{transform:translateX(5px)}   /* 向右晃动5px */
            60%{transform:translateX(-3px)}  /* 向左晃动3px */
            80%{transform:translateX(3px)}   /* 向右晃动3px */
        }

        /* ---- 第二行：音标+释义 ---- */
        .word-info {
            display: flex;
            flex-direction: row;          /* 水平排列音标和释义，中间有分隔符 */
            align-items: center;
            justify-content: center;      /* 居中显示 */
            font-size: 25px;             /* ★ 音标和释义的字体大小 */
            font-weight: 500;
            color: #4a148c;
            gap: 4px;                     /* 分隔符两侧间距 */
            flex-wrap: wrap;              /* 窄屏时自动换行 */
            text-align: center;
            min-height: 30px;             /* 最小高度，保持行高一致 */
        }
        .word-info .phonetic {
            font-family: 'Segoe UI', 'Times New Roman', serif;
            color: #6a1b9a;
            font-weight: 400;
        }
        .word-info .meaning {
            font-weight: 600;
            color: #4a148c;
        }
        .word-info .divider {
            color: #ce93d8;
            font-weight: 300;
            margin: 0 2px;               /* 分隔符左右间距2px */
        }
        /* 窄屏时分隔符隐藏，释义另起一行（由flex-wrap实现） */
        @media (max-width: 640px) {
            .word-info {
                font-size: 16px;         /* 窄屏缩小释义字号 */
                gap: 2px;
            }
            .word-info .divider { display: none; }
        }

        /* ---- 反馈信息 ---- */
        .feedback {
            text-align: center;
            font-size: 13px;             /* 反馈文字大小 */
            font-weight: 600;
            min-height: 20px;            /* 最小高度，避免布局跳动 */
            padding: 2px 0 0;            /* 上内边距2px */
            color: #4a148c;
            margin-top: 4px;             /* 与上一行的间距 */
        }
        .feedback.success { color: #1b5e20; }
        .feedback.error { color: #b71c1c; }
        .feedback.info { color: #e65100; }
        .error-msg {
            color: #c62828;
            background: #ffebee;
            padding: 10px;               /* 错误信息内边距 */
            border-radius: 10px;         /* 错误信息圆角 */
            margin: 8px 0;               /* 错误信息上下外边距 */
        }

        /* ================================================================
           键盘区域 – 可调整按键大小、内边距、间距
           ================================================================ */
        .keyboard {
            background: #f3e5f5;
            border-radius: 10px;          /* 键盘容器圆角 */
            padding: 10px 10px 10px;      /* ★ 键盘内边距上下左右均为10px */
            border: 1px solid #e1bee7;    /* 边框宽度1px */
            flex-shrink: 0;
            min-height: 200px;            /* 键盘最小高度，防止内容过少时缩成一团 */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .kb-row {
            display: flex;
            justify-content: center;
            gap: 7px;                     /* 按键之间的水平间距 */
            margin-bottom: 6px;           /* 按键行底部外边距 */
        }
        .kb-row:last-child { margin-bottom: 0; }
        .kb-key {
            flex: 1 1 0;
            min-width: 0;
            height: 70px;                /* ★ 字母键高度 */
            border: none;
            border-radius: 10px;         /* 按键圆角 */
            font-size: 35px;             /* ★ 字母键字体大小 */
            font-weight: 700;
            color: #1a1a2e;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04), inset 0 1px 2px rgba(255,255,255,0.8);
            cursor: pointer;
            transition: all 0.12s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 1px solid #d1c4e9;    /* 边框宽度1px */
            touch-action: manipulation;
        }
        .kb-key:active { transform: scale(0.92); background: #ede7f6; }
        .kb-key.special {
            flex: 1.5 1 0;
            background: #ede7f6;
            font-size: 16px;             /* 特殊键（退格、回车）字体大小 */
            color: #4a148c;
        }
        .kb-key.special:active { background: #d1c4e9; }
        .kb-key.function {
            height: 45px;                /* ★ 功能按钮高度（上一个、提示、下一个、模式） */
            font-size: 18px;             /* ★ 功能按钮字体大小 */
            background: #ede7f6;
            border-color: #d1c4e9;
            flex: 1;
        }
        .kb-key.function:active { background: #d1c4e9; }
        .kb-key.function.mode-btn {
            flex: 1.2;
            background: #e1bee7;
            border-color: #ce93d8;
            font-weight: 600;
        }
        .kb-key.function.mode-btn.active {
            background: #7b1fa2;
            color: #fff;
            border-color: #7b1fa2;
            box-shadow: 0 2px 8px rgba(106, 27, 154, 0.3); /* 阴影偏移 2px垂直、8px模糊 */
        }
        .kb-key.correct-highlight { background: #c8e6c9; border-color: #2e7d32; }
        .kb-key.wrong-highlight { background: #ffcdd2; border-color: #c62828; }

        /* ===== 完成界面 ===== */
        .complete-overlay {
            text-align: center;
            padding: 20px 10px;          /* 上下20px左右10px内边距 */
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .complete-overlay .big-icon { font-size: 0; }
        .complete-overlay h2 {
            font-size: 22px;             /* 标题字号 */
            color: #4a148c;
            margin-bottom: 4px;          /* 标题下边距 */
        }
        .complete-overlay p {
            font-size: 15px;             /* 正文字号 */
            color: #6a1b9a;
            margin-bottom: 4px;          /* 段落下边距 */
        }
        .complete-overlay .final-stats {
            display: flex;
            justify-content: center;
            gap: 24px;                   /* 统计项之间的间距 */
            margin: 12px 0 16px;         /* 统计块上下左右外边距 */
            flex-wrap: wrap;
        }
        .complete-overlay .final-stats .num {
            font-size: 28px;             /* 统计数字字号（如正确率） */
            font-weight: 800;
            color: #7b1fa2;
            display: block;
        }
        .complete-overlay .final-stats .label {
            font-size: 12px;             /* 统计标签字号 */
            color: #6a1b9a;
            opacity: 0.7;
        }
        .hidden { display: none !important; }

        /* ================================================================
           响应式断点 – 自动缩小尺寸
           ================================================================ */
        @media (max-width: 640px) {
            .word-card { padding: 130px 10px 12px; } /* 窄屏缩小卡片内边距 */
            .letter-slot { width: 32px; height: 40px; font-size: 20px; } /* 缩小字母格 */
            .letter-slot.fixed { width: 32px; height: 40px; font-size: 20px; } /* 同步固定格 */
            .word-info { font-size: 16px; min-height: 26px; margin-bottom: 120px;  }/*第三个数为 同步缩小注释与说明文字间距 */
            .kb-key { height: 44px; font-size: 18px; } /* 缩小字母键高度和字号 */
            .kb-key.function { height: 40px; font-size: 15px; } /* 缩小功能按钮高度和字号 */
        }
        @media (max-width: 420px) {
            .word-card { padding: 50px 6px 10px; } /* 进一步缩小卡片内边距 */
            .letter-slot { width: 26px; height: 34px; font-size: 17px; } /* 进一步缩小字母格 */
            .letter-slot.fixed { width: 26px; height: 34px; font-size: 17px; } /* 同步 */
            .word-info { font-size: 14px; min-height: 22px;  margin-bottom: 50px;}/*第三个数为 同步缩小注释与说明文字间距 */
            .kb-key { height: 38px; font-size: 15px; } /* 进一步缩小字母键 */
            .kb-key.function { height: 34px; font-size: 13px; } /* 进一步缩小功能按钮 */
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- 顶栏 -->
        <div class="header">
            <div class="brand">
                <span class="brand-icon">EN</span>
                <span class="title">单词记忆练习</span>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <label for="gradeSelect">词库</label>
                <select id="gradeSelect">
                    <!-- 由 JavaScript 动态生成 -->
                </select>
            </div>
            <div class="toolbar-right">
                <button class="ctrl-btn primary" id="mainCtrlBtn">开始</button>
                <button class="ctrl-btn secondary" id="resetCtrlBtn" disabled>重来</button>
            </div>
        </div>

        <!-- 统计栏（唯一进度显示） -->
        <div class="stats">
            <span class="stat-item">用时 <span class="value time" id="timerDisplay">00:00</span></span>
            <span class="stat-item">正确率 <span class="value" id="accuracyDisplay">0%</span></span>
            <span class="stat-item">进度 <span class="value" id="progressDisplay">0/0</span></span>
            <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <!-- 单词卡片（无独立进度） -->
        <div class="word-card" id="wordCard">
            <!-- 第一行：字母格 -->
            <div class="word-blanks-wrapper">
                <div class="word-blanks" id="wordBlanks"></div>
            </div>
            <!-- 第二行：音标 + 释义 -->
            <div class="word-info" id="wordInfo">
                <span class="phonetic" id="wordPhonetic"></span>
                <span class="divider">|</span>
                <span class="meaning" id="wordMeaning"></span>
            </div>
            <!-- 反馈信息 -->
            <div class="feedback" id="feedback">点击「开始」按钮开始练习</div>
        </div>

        <!-- 键盘区域 -->
        <div class="keyboard" id="keyboard">
            <!-- 功能按钮行 -->
            <div class="kb-row">
                <button class="kb-key function" data-action="prev">上一个</button>
                <button class="kb-key function" data-action="hint">提示</button>
                <button class="kb-key function" data-action="next">下一个</button>
                <button class="kb-key function mode-btn active" data-mode="practice">练习</button>
                <button class="kb-key function mode-btn" data-mode="dictation">听写</button>
            </div>
            <!-- 字母键盘 -->
            <div class="kb-row">
                <button class="kb-key" data-letter="Q">Q</button><button class="kb-key" data-letter="W">W</button>
                <button class="kb-key" data-letter="E">E</button><button class="kb-key" data-letter="R">R</button>
                <button class="kb-key" data-letter="T">T</button><button class="kb-key" data-letter="Y">Y</button>
                <button class="kb-key" data-letter="U">U</button><button class="kb-key" data-letter="I">I</button>
                <button class="kb-key" data-letter="O">O</button><button class="kb-key" data-letter="P">P</button>
            </div>
            <div class="kb-row">
                <button class="kb-key" data-letter="A">A</button><button class="kb-key" data-letter="S">S</button>
                <button class="kb-key" data-letter="D">D</button><button class="kb-key" data-letter="F">F</button>
                <button class="kb-key" data-letter="G">G</button><button class="kb-key" data-letter="H">H</button>
                <button class="kb-key" data-letter="J">J</button><button class="kb-key" data-letter="K">K</button>
                <button class="kb-key" data-letter="L">L</button>
            </div>
            <div class="kb-row">
                <button class="kb-key special" data-letter="⌫">⬅️</button>
                <button class="kb-key" data-letter="Z">Z</button><button class="kb-key" data-letter="X">X</button>
                <button class="kb-key" data-letter="C">C</button><button class="kb-key" data-letter="V">V</button>
                <button class="kb-key" data-letter="B">B</button><button class="kb-key" data-letter="N">N</button>
                <button class="kb-key" data-letter="M">M</button>
                <button class="kb-key special" data-letter="ENT"> ✅</button>
            </div>
        </div>

        <!-- 完成界面 -->
        <div class="complete-overlay hidden" id="completeOverlay">
            <div class="big-icon"></div>
            <h2>全部完成！</h2>
            <p>你真是单词小达人！</p>
            <div class="final-stats">
                <div><span class="num" id="finalAccuracy">0%</span><span class="label">正确率</span></div>
                <div><span class="num" id="finalTime">00:00</span><span class="label">用时</span></div>
                <div><span class="num" id="finalTotal">0</span><span class="label">完成单词</span></div>
            </div>
            <button class="ctrl-btn primary" id="restartFromCompleteBtn" style="margin:0 auto;">再来一次</button>
        </div>
    </div>

    <!-- ================================================================
         主程序脚本（已移除对独立进度元素的引用）
    ================================================================ -->
    <script>
        // ============================================================
        //  全局变量
        // ============================================================
        let WORDS_DATA = null;
        const DATA_URL = 'https://magua-qi.github.io/englishwords.json';

        // ---- 工具函数 ----
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        // ---- 缓存操作（完整状态） ----
        const STORAGE_KEY = 'wordGameFullData';
        function saveCache() {
            try {
                const data = {
                    grade: state.grade,
                    words: state.words,
                    currentIndex: state.currentIndex,
                    completedWords: state.completedWords,
                    slots: state.slots,
                    activeSlotIndex: state.activeSlotIndex,
                    mode: state.mode,
                    isStarted: state.isStarted,
                    isPaused: state.isPaused,
                    totalAttempts: state.totalAttempts,
                    correctAttempts: state.correctAttempts,
                    elapsedSeconds: state.elapsedSeconds,
                    timestamp: Date.now()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadCache() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data && typeof data === 'object' && data.grade && Array.isArray(data.words) && data.words.length > 0) {
                        return data;
                    }
                }
            } catch (e) { /* ignore */ }
            return null;
        }

        function clearCache() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) { /* ignore */ }
        }

        // ---- DOM 引用 ----
        const $ = id => document.getElementById(id);
        const dom = {
            gradeSelect: $('gradeSelect'),
            timerDisplay: $('timerDisplay'),
            accuracyDisplay: $('accuracyDisplay'),
            progressDisplay: $('progressDisplay'),
            progressFill: $('progressFill'),
            // wordProgress 已移除，不再引用
            wordBlanks: $('wordBlanks'),
            wordPhonetic: $('wordPhonetic'),
            wordMeaning: $('wordMeaning'),
            feedback: $('feedback'),
            wordCard: $('wordCard'),
            keyboard: $('keyboard'),
            completeOverlay: $('completeOverlay'),
            finalAccuracy: $('finalAccuracy'),
            finalTime: $('finalTime'),
            finalTotal: $('finalTotal'),
            restartBtn: $('restartFromCompleteBtn'),
            mainCtrlBtn: $('mainCtrlBtn'),
            resetCtrlBtn: $('resetCtrlBtn'),
            kbKeys: document.querySelectorAll('.kb-key[data-letter]'),
            functionKeys: document.querySelectorAll('.kb-key[data-action]'),
            modeButtons: document.querySelectorAll('.mode-btn'),
        };

        // ---- 状态 ----
        const state = {
            grade: '',
            words: [],
            currentIndex: 0,
            slots: [],
            activeSlotIndex: 0,
            totalWords: 0,
            completedWords: 0,
            totalAttempts: 0,
            correctAttempts: 0,
            startTime: null,
            timerInterval: null,
            elapsedSeconds: 0,
            isFinished: false,
            isPaused: false,
            isStarted: false,
            usedKeys: new Set(),
            mode: 'practice',
        };

        // ---- UI 更新 ----
        function updateFeedback(msg, type = 'info') {
            dom.feedback.textContent = msg;
            dom.feedback.className = 'feedback ' + type;
            clearTimeout(dom.feedback._timeout);
            if (type === 'success' || type === 'error') {
                dom.feedback._timeout = setTimeout(() => {
                    if (!state.isFinished && state.isStarted && !state.isPaused) {
                        dom.feedback.className = 'feedback info';
                        dom.feedback.textContent = '点击键盘字母填入空位';
                    }
                }, 2500);
            }
        }

        function updateTimerDisplay() {
            dom.timerDisplay.textContent = formatTime(state.elapsedSeconds);
        }

        function updateStats() {
            const total = state.totalWords;
            const done = state.completedWords;
            const progress = total > 0 ? Math.round((done / total) * 100) : 0;
            dom.progressDisplay.textContent = `${done}/${total}`;  // 统计栏进度更新
            dom.progressFill.style.width = `${progress}%`;
            // 不再更新独立的 wordProgress
            const accuracy = state.totalAttempts > 0 ? Math.round((state.correctAttempts / state.totalAttempts) * 100) : 0;
            dom.accuracyDisplay.textContent = accuracy + '%';
            updateTimerDisplay();
            if (state.isStarted || state.completedWords > 0) {
                saveCache();
            }
        }

        // ---- 控制按钮状态 ----
        function updateControlButtons() {
            const hasValidWords = state.totalWords > 0 && !state.isFinished;
            if (!state.isStarted) {
                dom.mainCtrlBtn.textContent = '开始';
                dom.mainCtrlBtn.disabled = !hasValidWords;
                dom.resetCtrlBtn.disabled = true;
            } else if (state.isPaused) {
                dom.mainCtrlBtn.textContent = '继续';
                dom.mainCtrlBtn.disabled = false;
                dom.resetCtrlBtn.disabled = false;
                dom.resetCtrlBtn.textContent = '重来';
            } else {
                dom.mainCtrlBtn.textContent = '暂停';
                dom.mainCtrlBtn.disabled = false;
                dom.resetCtrlBtn.disabled = false;
                dom.resetCtrlBtn.textContent = '重来';
            }
            if (state.isFinished) {
                dom.mainCtrlBtn.disabled = true;
                dom.resetCtrlBtn.disabled = true;
            }
            if (!hasValidWords && !state.isStarted) {
                dom.mainCtrlBtn.disabled = true;
            }
        }

        // ---- 重置进度（清除缓存） ----
        function resetProgress() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.isStarted = false;
            state.isPaused = false;
            state.isFinished = false;
            state.completedWords = 0;
            state.totalAttempts = 0;
            state.correctAttempts = 0;
            state.elapsedSeconds = 0;
            state.currentIndex = 0;
            state.startTime = null;
            clearCache();
            initGame(state.grade, false);
            updateControlButtons();
            updateFeedback('已重置', 'info');
        }

        // ---- 开始/暂停/继续 ----
        function toggleMainControl() {
            if (!state.isStarted) {
                if (!state.grade || state.totalWords === 0) {
                    updateFeedback('请先选择有效词库', 'error');
                    return;
                }
                state.isStarted = true;
                state.isPaused = false;
                state.startTime = Date.now() - state.elapsedSeconds * 1000;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                    updateTimerDisplay();
                    saveCache();
                }, 200);
                enableInteraction(true);
                updateFeedback('练习开始！', 'success');
                updateControlButtons();
                updateStats();
                if (state.totalWords > 0 && state.currentIndex === 0 && state.completedWords === 0) {
                    loadWord();
                } else {
                    renderWord();
                }
                saveCache();
            } else if (state.isPaused) {
                state.isPaused = false;
                state.startTime = Date.now() - state.elapsedSeconds * 1000;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                    updateTimerDisplay();
                    saveCache();
                }, 200);
                enableInteraction(true);
                updateFeedback('继续练习', 'info');
                updateControlButtons();
                saveCache();
            } else {
                state.isPaused = true;
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                enableInteraction(false);
                updateFeedback('已暂停', 'info');
                updateControlButtons();
                saveCache();
            }
        }

        // ---- 启用/禁用交互 ----
        function enableInteraction(enabled) {
            dom.kbKeys.forEach(k => {
                k.style.pointerEvents = enabled ? 'auto' : 'none';
                k.style.opacity = enabled ? '1' : '0.5';
            });
            dom.functionKeys.forEach(k => {
                k.style.pointerEvents = enabled ? 'auto' : 'none';
                k.style.opacity = enabled ? '1' : '0.5';
            });
            dom.modeButtons.forEach(k => {
                k.style.pointerEvents = 'auto';
                k.style.opacity = '1';
            });
            const slots = dom.wordBlanks.querySelectorAll('.letter-slot');
            slots.forEach(el => {
                el.style.pointerEvents = enabled ? 'auto' : 'none';
                el.style.opacity = enabled ? '1' : '0.6';
            });
        }

        // ---- 核心逻辑 ----
        function initGame(gradeLabel, resume = false) {
            try {
                console.log(`初始化词库 ${gradeLabel}，恢复模式: ${resume}`);
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                state.grade = gradeLabel;

                // 尝试从缓存恢复完整状态
                let cache = null;
                if (resume) {
                    cache = loadCache();
                    if (cache && cache.grade === gradeLabel) {
                        console.log('找到有效缓存，正在恢复...');
                        state.words = cache.words || [];
                        state.currentIndex = cache.currentIndex || 0;
                        state.completedWords = cache.completedWords || 0;
                        state.slots = cache.slots || [];
                        state.activeSlotIndex = cache.activeSlotIndex || 0;
                        state.mode = cache.mode || 'practice';
                        state.isStarted = cache.isStarted || false;
                        // ★ 强制暂停：无论缓存中是什么，刷新后均为暂停状态
                        state.isPaused = true;
                        state.totalAttempts = cache.totalAttempts || 0;
                        state.correctAttempts = cache.correctAttempts || 0;
                        state.elapsedSeconds = cache.elapsedSeconds || 0;
                        state.totalWords = state.words.length;
                        state.isFinished = (state.completedWords >= state.totalWords);
                        state.usedKeys = new Set();
                        state.startTime = null;  // 清除开始时间，避免计时器意外启动

                        // 更新UI
                        dom.gradeSelect.value = gradeLabel;
                        dom.completeOverlay.classList.add('hidden');
                        dom.wordCard.classList.remove('hidden');
                        dom.keyboard.classList.remove('hidden');
                        dom.kbKeys.forEach(k => k.className = 'kb-key');
                        dom.modeButtons.forEach(btn => {
                            btn.classList.toggle('active', btn.dataset.mode === state.mode);
                        });

                        if (state.isFinished) {
                            finishGame();
                        } else {
                            if (!state.slots || state.slots.length === 0) {
                                const wordObj = state.words[state.currentIndex];
                                if (wordObj) {
                                    const chars = wordObj.word.split('');
                                    let blankIndices;
                                    if (state.mode === 'practice') {
                                        const blankCount = Math.max(1, Math.min(chars.length - 1, Math.floor(chars.length * 0.4)));
                                        const indices = shuffle([...Array(chars.length).keys()]).slice(0, blankCount);
                                        blankIndices = new Set(indices);
                                    } else {
                                        blankIndices = new Set([...Array(chars.length).keys()]);
                                    }
                                    state.slots = chars.map((char, idx) => ({
                                        char,
                                        isBlank: blankIndices.has(idx),
                                        filled: false,
                                        correct: false,
                                        wrong: false,
                                        value: '',
                                    }));
                                    if (!state.slots.some(s => s.isBlank) && state.slots.length > 0) {
                                        state.slots[0].isBlank = true;
                                    }
                                    state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                                }
                            }
                            renderWord();
                        }
                        updateStats();
                        // 更新按钮文字：由于 isPaused = true，会显示“继续”
                        updateControlButtons();
                        // 强制禁用交互（暂停状态）
                        enableInteraction(false);
                        // 反馈信息提示暂停
                        if (state.isStarted) {
                            updateFeedback('已暂停，点击「继续」恢复', 'info');
                        } else {
                            updateFeedback('点击「开始」按钮开始练习', 'info');
                        }
                        dom.resetCtrlBtn.disabled = false;
                        console.log('缓存恢复完成（强制暂停）');
                        return;
                    }
                }

                // 没有有效缓存或 resume=false，执行全新初始化
                let vocab = null;
                for (const group of Object.values(WORDS_DATA)) {
                    if (group[gradeLabel]) {
                        vocab = group[gradeLabel];
                        break;
                    }
                }
                if (!vocab || vocab.length === 0) {
                    dom.wordBlanks.innerHTML = '<span style="color:#999;">该词库暂无词汇</span>';
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    dom.progressDisplay.textContent = '0/0';
                    dom.progressFill.style.width = '0%';
                    dom.accuracyDisplay.textContent = '0%';
                    dom.timerDisplay.textContent = '00:00';
                    dom.feedback.textContent = '请选择有效词库';
                    dom.feedback.className = 'feedback info';
                    state.isFinished = true;
                    state.totalWords = 0;
                    state.isStarted = false;
                    state.isPaused = false;
                    enableInteraction(false);
                    updateControlButtons();
                    clearCache();
                    return;
                }

                state.words = shuffle([...vocab]);
                state.totalWords = state.words.length;
                state.completedWords = 0;
                state.totalAttempts = 0;
                state.correctAttempts = 0;
                state.elapsedSeconds = 0;
                state.currentIndex = 0;
                state.isFinished = false;
                state.usedKeys = new Set();
                state.isStarted = false;
                state.isPaused = false;
                state.startTime = null;
                state.slots = [];
                state.activeSlotIndex = 0;
                state.mode = 'practice';

                dom.completeOverlay.classList.add('hidden');
                dom.wordCard.classList.remove('hidden');
                dom.keyboard.classList.remove('hidden');
                dom.kbKeys.forEach(k => k.className = 'kb-key');
                dom.gradeSelect.value = gradeLabel;
                dom.modeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === 'practice');
                });

                renderWord();
                updateStats();
                updateFeedback('点击「开始」按钮开始练习', 'info');
                enableInteraction(false);
                updateControlButtons();
                dom.resetCtrlBtn.disabled = true;
                clearCache();
            } catch (err) {
                console.error(err);
                updateFeedback('初始化失败：' + err.message, 'error');
            }
        }

        // ---- 加载指定索引的单词 ----
        function goToWord(index) {
            if (state.isFinished) return;
            if (index < 0 || index >= state.totalWords) return;
            state.currentIndex = index;
            const wordObj = state.words[index];
            if (!wordObj) return;
            const word = wordObj.word;
            const chars = word.split('');
            const isCompleted = (index < state.completedWords);
            if (isCompleted) {
                state.slots = chars.map((char) => ({
                    char,
                    isBlank: false,
                    filled: true,
                    correct: true,
                    wrong: false,
                    value: char,
                }));
                state.activeSlotIndex = -1;
            } else {
                let blankIndices;
                if (state.mode === 'practice') {
                    const blankCount = Math.max(1, Math.min(chars.length - 1, Math.floor(chars.length * 0.4)));
                    const indices = shuffle([...Array(chars.length).keys()]).slice(0, blankCount);
                    blankIndices = new Set(indices);
                } else {
                    blankIndices = new Set([...Array(chars.length).keys()]);
                }
                state.slots = chars.map((char, idx) => ({
                    char,
                    isBlank: blankIndices.has(idx),
                    filled: false,
                    correct: false,
                    wrong: false,
                    value: '',
                }));
                if (!state.slots.some(s => s.isBlank) && state.slots.length > 0) {
                    state.slots[0].isBlank = true;
                }
                state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
            }
            state.usedKeys = new Set();
            dom.kbKeys.forEach(k => k.className = 'kb-key');
            renderWord();
            updateStats();
            if (isCompleted) {
                updateFeedback('已完成的单词', 'success');
            } else {
                updateFeedback(`第 ${state.currentIndex + 1}/${state.totalWords} 个单词`, 'info');
            }
            if (state.isStarted && !state.isPaused && !state.isFinished) {
                enableInteraction(true);
            } else {
                enableInteraction(false);
            }
            saveCache();
        }

        function loadWord() {
            try {
                if (state.currentIndex >= state.totalWords) {
                    finishGame();
                    return;
                }
                goToWord(state.currentIndex);
            } catch (err) {
                console.error(err);
                updateFeedback('加载单词出错', 'error');
            }
        }

        // ---- 渲染 ----
        function renderWord() {
            try {
                if (!state.isStarted) {
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    dom.wordBlanks.innerHTML = '<span style="color:#999; font-size:18px;">点击「开始」按钮开始练习</span>';
                    return;
                }

                const wordObj = state.words[state.currentIndex];
                if (!wordObj) {
                    dom.wordPhonetic.textContent = '';
                    dom.wordMeaning.textContent = '';
                    dom.wordBlanks.innerHTML = '<span style="color:#999;">数据异常</span>';
                    return;
                }
                dom.wordPhonetic.textContent = wordObj.phonetic || '';
                dom.wordMeaning.textContent = wordObj.meaning || '';

                const container = dom.wordBlanks;
                container.innerHTML = '';
                container.classList.remove('animate-in');

                if (!state.slots || state.slots.length === 0) {
                    container.innerHTML = '<span style="color:#999;">无数据</span>';
                    return;
                }

                state.slots.forEach((slot, idx) => {
                    const el = document.createElement('span');
                    el.className = 'letter-slot';
                    el.dataset.index = idx;
                    if (slot.isBlank) {
                        el.classList.add('blank');
                        if (slot.filled && slot.correct) {
                            el.classList.add('filled');
                            el.textContent = slot.value;
                        } else if (slot.filled && slot.wrong) {
                            el.classList.add('wrong');
                            el.textContent = slot.value;
                        } else {
                            el.textContent = '';
                        }
                        if (idx === state.activeSlotIndex && !slot.filled) {
                            el.classList.add('active');
                        }
                    } else {
                        el.classList.add('fixed');
                        el.textContent = slot.char;
                    }
                    el.addEventListener('click', () => {
                        if (state.isFinished) return;
                        if (!state.isStarted || state.isPaused) {
                            updateFeedback('请先开始练习', 'info');
                            return;
                        }
                        if (slot.isBlank && !slot.filled) {
                            setActiveSlot(idx);
                        }
                    });
                    container.appendChild(el);
                });

                void container.offsetWidth;
                container.classList.add('animate-in');

                const blanks = state.slots.filter(s => s.isBlank);
                if (blanks.length > 0 && blanks.every(s => s.filled && s.correct)) {
                    if (state.isStarted && !state.isPaused) {
                        setTimeout(() => {
                            if (state.currentIndex < state.totalWords) {
                                state.completedWords++;
                                const nextIndex = state.currentIndex + 1;
                                if (nextIndex < state.totalWords) {
                                    goToWord(nextIndex);
                                } else {
                                    finishGame();
                                }
                            }
                        }, 300);
                    }
                }
            } catch (err) {
                console.error(err);
                dom.wordBlanks.innerHTML = `<span class="error-msg">渲染错误</span>`;
            }
        }

        function setActiveSlot(index) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            const slot = state.slots[index];
            if (!slot || !slot.isBlank || slot.filled) return;
            state.activeSlotIndex = index;
            renderWord();
            const allSlots = dom.wordBlanks.querySelectorAll('.letter-slot');
            allSlots.forEach((el, i) => {
                if (i === index && state.slots[i].isBlank && !state.slots[i].filled) {
                    el.classList.add('active');
                }
            });
            saveCache();
        }

        // ---- 键盘输入 ----
        function handleKeyInput(letter) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            if (state.currentIndex < state.completedWords) {
                updateFeedback('该单词已完成，不可编辑', 'info');
                return;
            }
            try {
                if (letter === '⌫') {
                    for (let i = state.slots.length - 1; i >= 0; i--) {
                        const s = state.slots[i];
                        if (s.isBlank && s.filled) {
                            s.filled = false;
                            s.correct = false;
                            s.wrong = false;
                            s.value = '';
                            state.activeSlotIndex = i;
                            renderWord();
                            updateFeedback('已清除', 'info');
                            saveCache();
                            return;
                        }
                    }
                    updateFeedback('没有可退格的内容', 'info');
                    return;
                }
                if (letter === 'ENT') {
                    const blanks = state.slots.filter(s => s.isBlank);
                    if (blanks.every(s => s.filled)) {
                        if (blanks.every(s => s.correct)) {
                            state.completedWords++;
                            state.currentIndex++;
                            if (state.currentIndex < state.totalWords) {
                                goToWord(state.currentIndex);
                            } else {
                                finishGame();
                            }
                        } else {
                            updateFeedback('存在错误，请修正', 'error');
                        }
                    } else {
                        updateFeedback('请先填完所有空位', 'info');
                    }
                    return;
                }
                if (!/^[A-Z]$/.test(letter)) return;

                let activeIdx = state.activeSlotIndex;
                let slot = state.slots[activeIdx];
                if (!slot || !slot.isBlank || slot.filled) {
                    const first = state.slots.findIndex(s => s.isBlank && !s.filled);
                    if (first === -1) {
                        updateFeedback('所有空位已填', 'success');
                        return;
                    }
                    activeIdx = first;
                    state.activeSlotIndex = activeIdx;
                    renderWord();
                    slot = state.slots[activeIdx];
                }
                if (!slot.isBlank || slot.filled) return;

                state.totalAttempts++;
                const isCorrect = letter.toLowerCase() === slot.char.toLowerCase();
                if (isCorrect) {
                    state.correctAttempts++;
                    slot.filled = true;
                    slot.correct = true;
                    slot.value = slot.char;
                    state.usedKeys.add(letter);
                    dom.kbKeys.forEach(k => {
                        if (k.dataset.letter === letter) k.classList.add('correct-highlight');
                    });
                    updateFeedback('正确！', 'success');
                    const next = state.slots.findIndex((s, idx) => s.isBlank && !s.filled && idx > activeIdx);
                    if (next !== -1) {
                        state.activeSlotIndex = next;
                    }
                    renderWord();
                    updateStats();
                    saveCache();
                } else {
                    slot.filled = true;
                    slot.wrong = true;
                    slot.value = letter;
                    state.usedKeys.add(letter);
                    dom.kbKeys.forEach(k => {
                        if (k.dataset.letter === letter) {
                            k.classList.add('wrong-highlight');
                            setTimeout(() => k.classList.remove('wrong-highlight'), 500);
                        }
                    });
                    updateFeedback('错误！', 'error');
                    setTimeout(() => {
                        slot.filled = false;
                        slot.wrong = false;
                        slot.value = '';
                        state.activeSlotIndex = activeIdx;
                        renderWord();
                        const slots = dom.wordBlanks.querySelectorAll('.letter-slot');
                        slots.forEach((el, i) => {
                            if (i === activeIdx) el.classList.add('active');
                        });
                        saveCache();
                    }, 600);
                    updateStats();
                }
            } catch (err) {
                console.error(err);
                updateFeedback('输入处理出错', 'error');
            }
        }

        // ---- 提示 ----
        function useHint() {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) {
                updateFeedback('请先开始练习', 'info');
                return;
            }
            if (state.currentIndex < state.completedWords) {
                updateFeedback('该单词已完成', 'info');
                return;
            }
            try {
                const blankIdx = state.slots.findIndex(s => s.isBlank && !s.filled);
                if (blankIdx === -1) {
                    updateFeedback('所有空位已填', 'success');
                    return;
                }
                const slot = state.slots[blankIdx];
                updateFeedback(`提示：正确字母是 “${slot.char}”`, 'info');
            } catch (err) {
                console.error(err);
                updateFeedback('提示功能出错', 'error');
            }
        }

        // ---- 模式切换 ----
        function switchMode(mode) {
            if (state.mode === mode) return;
            state.mode = mode;
            dom.modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (state.words.length > 0 && state.currentIndex < state.totalWords && state.currentIndex >= state.completedWords) {
                const wordObj = state.words[state.currentIndex];
                const word = wordObj.word;
                const chars = word.split('');
                let blankIndices;
                if (mode === 'practice') {
                    const blankCount = Math.max(1, Math.min(chars.length - 1, Math.floor(chars.length * 0.4)));
                    const indices = shuffle([...Array(chars.length).keys()]).slice(0, blankCount);
                    blankIndices = new Set(indices);
                } else {
                    blankIndices = new Set([...Array(chars.length).keys()]);
                }
                state.slots = chars.map((char, idx) => ({
                    char,
                    isBlank: blankIndices.has(idx),
                    filled: false,
                    correct: false,
                    wrong: false,
                    value: '',
                }));
                if (!state.slots.some(s => s.isBlank) && state.slots.length > 0) {
                    state.slots[0].isBlank = true;
                }
                state.activeSlotIndex = state.slots.findIndex(s => s.isBlank);
                dom.kbKeys.forEach(k => k.className = 'kb-key');
                renderWord();
                updateFeedback(`已切换至 ${mode === 'practice' ? '练习' : '听写'} 模式`, 'info');
                saveCache();
            }
        }

        function finishGame() {
            try {
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                state.isFinished = true;
                state.isStarted = false;
                state.isPaused = false;
                dom.wordCard.classList.add('hidden');
                dom.keyboard.classList.add('hidden');
                dom.completeOverlay.classList.remove('hidden');
                const accuracy = state.totalAttempts > 0 ? Math.round((state.correctAttempts / state.totalAttempts) * 100) : 0;
                dom.finalAccuracy.textContent = accuracy + '%';
                dom.finalTime.textContent = formatTime(state.elapsedSeconds);
                dom.finalTotal.textContent = state.completedWords;
                dom.progressFill.style.width = '100%';
                dom.progressDisplay.textContent = `${state.totalWords}/${state.totalWords}`;
                enableInteraction(false);
                updateControlButtons();
                clearCache();
                saveCache();
            } catch (err) {
                console.error(err);
            }
        }

        // ---- 导航 ----
        function goPrev() {
            if (state.isFinished) return;
            if (state.currentIndex > 0) {
                goToWord(state.currentIndex - 1);
            }
        }

        function goNext() {
            if (state.isFinished) return;
            if (state.currentIndex < state.totalWords - 1) {
                goToWord(state.currentIndex + 1);
            }
        }

        // ---- 事件绑定 ----
        dom.gradeSelect.addEventListener('change', function() {
            const grade = this.value;
            if (grade !== state.grade) {
                clearCache();
                state.isStarted = false;
                state.isPaused = false;
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
                initGame(grade, false);
                updateControlButtons();
                enableInteraction(false);
            }
        });

        dom.kbKeys.forEach(key => {
            key.addEventListener('click', function() {
                const letter = this.dataset.letter;
                if (letter) handleKeyInput(letter);
            });
            key.addEventListener('touchstart', function(e) {
                // 防止页面缩放
            }, { passive: true });
        });

        dom.functionKeys.forEach(key => {
            key.addEventListener('click', function() {
                const action = this.dataset.action;
                if (action === 'prev') goPrev();
                else if (action === 'hint') useHint();
                else if (action === 'next') goNext();
            });
        });

        dom.modeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const mode = this.dataset.mode;
                switchMode(mode);
            });
        });

        document.addEventListener('keydown', function(e) {
            if (state.isFinished) return;
            if (!state.isStarted || state.isPaused) return;
            const key = e.key.toUpperCase();
            if (key === 'BACKSPACE' || key === 'DELETE') {
                e.preventDefault();
                handleKeyInput('⌫');
                return;
            }
            if (key === 'ENTER') {
                e.preventDefault();
                handleKeyInput('ENT');
                return;
            }
            if (/^[A-Z]$/.test(key)) {
                e.preventDefault();
                handleKeyInput(key);
            }
        });

        dom.restartBtn.addEventListener('click', function() {
            clearCache();
            state.isStarted = false;
            state.isPaused = false;
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            initGame(state.grade, false);
            updateControlButtons();
            enableInteraction(false);
        });

        dom.mainCtrlBtn.addEventListener('click', toggleMainControl);
        dom.resetCtrlBtn.addEventListener('click', resetProgress);

        // ============================================================
        //  数据加载、构建下拉框并启动
        // ============================================================
        function buildGradeSelect() {
            const select = dom.gradeSelect;
            select.innerHTML = '';
            for (const [groupLabel, grades] of Object.entries(WORDS_DATA)) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = groupLabel;
                for (const [gradeLabel, words] of Object.entries(grades)) {
                    const option = document.createElement('option');
                    option.value = gradeLabel;
                    option.textContent = gradeLabel;
                    optgroup.appendChild(option);
                }
                select.appendChild(optgroup);
            }
        }

        function initApp() {
            buildGradeSelect();

            let defaultGrade = null;
            const cache = loadCache();
            if (cache && cache.grade && WORDS_DATA && Object.values(WORDS_DATA).some(g => g[cache.grade])) {
                defaultGrade = cache.grade;
            } else {
                const firstGroup = Object.values(WORDS_DATA)[0];
                if (firstGroup) {
                    defaultGrade = Object.keys(firstGroup)[0] || '';
                }
            }
            if (defaultGrade) {
                dom.gradeSelect.value = defaultGrade;
            }
            dom.modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === state.mode);
            });
            initGame(defaultGrade, true);
            updateControlButtons();
            enableInteraction(false);
            console.log('单词记忆工具已启动（JSON + 完整缓存 + 强制暂停）');
        }

        // ---- 加载 JSON 数据 ----
        async function loadData() {
            try {
                dom.feedback.textContent = '加载词库中...';
                dom.feedback.className = 'feedback info';

                const response = await fetch(DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                WORDS_DATA = json;

                if (typeof WORDS_DATA !== 'object' || Object.keys(WORDS_DATA).length === 0) {
                    throw new Error('词库数据为空或格式错误');
                }

                console.log('词库加载成功，共', Object.keys(WORDS_DATA).length, '个分类');
                dom.feedback.textContent = '词库加载成功！';
                dom.feedback.className = 'feedback success';

                initApp();
            } catch (err) {
                console.error('加载词库失败:', err);
                document.querySelector('.app-container').innerHTML = `
                    <div style="text-align:center;padding:40px;color:#c62828;">
                        <h2>词库加载失败</h2>
                        <p>无法从 <code>${DATA_URL}</code> 加载词库数据</p>
                        <p style="font-size:14px;color:#999;">${err.message}</p>
                        <button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;border:none;border-radius:30px;background:#7b1fa2;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">重新加载</button>
                    </div>
                `;
            }
        }

        // ---- 启动 ----
        loadData();
    </script>
</body>
</html>
