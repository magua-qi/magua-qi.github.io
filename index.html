<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lively Wallpaper - 动态云图与月球公转</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            font-family: system-ui, monospace;
        }
        #modeBtn {
            position: fixed;
            bottom: 40px;
            right: 20px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 6px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        #modeBtn:hover {
            background: rgba(20, 20, 40, 0.85);
            border-color: #7cb4ff;
            transform: scale(1.02);
        }
        #modeBtn:active {
            transform: scale(0.98);
        }
        img,
        div {
            user-select: none;
        }
    </style>
</head>
<body>
    <button id="modeBtn">切换</button>
    <div id="appRoot" style="width:100%;height:100vh;"></div>

    <script>
        // 云图资源地址
        const EARTH_URL = "https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/THUMBNAIL/FY4B_AGRI_DISK_GCLR.jpg";
        const CHINA_URL = "https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/GCLR/FY4B_REGC_GCLR.JPG";

        let refreshTimer;   // 云图刷新定时器
        let moonTimer;      // 月球相位定时器
        let activeMoon;     // 当前月球元素引用
        let currentMode;    // 当前模式标识

        /* 根据日期计算月球相位图片地址 (基于NASA SVS模拟序列) */
        function moonUrl() {
            const d = Math.floor((new Date() - new Date('2026-01-01')) / 864e5);
            const frame = Math.min(1 + d * 24, 9999).toString().padStart(4, '0');
            return `https://svs.gsfc.nasa.gov/vis/a000000/a005500/a005587/frames/730x730_1x1_30p/moon.${frame}.jpg`;
        }

        /* 设置月球背景图，加载失败则清空背景 */
        function setMoon(el, url) {
            if (!el) return;
            const src = url || moonUrl();
            const img = new Image();
            img.onload = () => { el.style.backgroundImage = `url(${src})`; };
            img.onerror = () => { el.style.backgroundImage = ''; };
            img.src = src;
        }

        /* 刷新地球云图 */
        function refreshEarth() {
            const el = document.querySelector('.single-earth, .earth-img');
            if (el) el.style.backgroundImage = `url(${EARTH_URL})`;
        }

        /* 地球云图自动刷新，间隔 s 秒 */
        function earthTimer(s) {
            clearInterval(refreshTimer);
            refreshTimer = setInterval(refreshEarth, s * 1000);
        }

        /* 停止所有定时器 */
        function stopAll() {
            clearInterval(refreshTimer);
            clearInterval(moonTimer);
        }

        /* 每天更新一次月球相位 */
        function watchMoon(el) {
            clearInterval(moonTimer);
            let last = new Date().toDateString();
            const upd = () => { if (activeMoon && document.body.contains(activeMoon)) setMoon(activeMoon, moonUrl()); };
            upd();
            moonTimer = setInterval(() => {
                const now = new Date().toDateString();
                if (now !== last) { last = now; upd(); }
            }, 36e5);
        }

        // ---------- 四种壁纸模式 ----------

        /* 模式1：仅地球（右下角） */
        function renderEarthOnly() {
            const root = document.getElementById('appRoot');
            root.innerHTML = '';
            const wrap = document.createElement('div');
            wrap.style.cssText = 'width:100%;height:100vh;position:relative;background:#000;';
            const earth = document.createElement('div');
            earth.className = 'single-earth';
            earth.style.cssText = `position:absolute;right:220px;bottom:220px;width:700px;height:700px;border-radius:400px;background:url(${EARTH_URL}) center/700px no-repeat;`;
            wrap.appendChild(earth);
            root.appendChild(wrap);
            earthTimer(300);
            activeMoon = null;
        }

        /* 模式2：静态月球（地球+右下角月球） */
        function renderMoonStatic() {
            const root = document.getElementById('appRoot');
            root.innerHTML = '';
            const container = document.createElement('div');
            container.style.cssText = 'position:relative;width:90vw;max-width:1200px;height:90vh;margin-left:auto;margin-right:5%;display:flex;align-items:center;';
            const earth = document.createElement('div');
            earth.className = 'earth-img';
            earth.style.cssText = `width:60%;padding-bottom:60%;border-radius:50%;background:url(${EARTH_URL}) 50% 0%/cover no-repeat;position:relative;left:50%;transform:translateX(-50%);`;
            const moon = document.createElement('div');
            moon.style.cssText = 'width:10%;padding-bottom:10%;border-radius:50%;background-size:cover;position:absolute;top:5%;right:5%;z-index:2;';
            moon.classList.add('moon-static');
            const mq = document.createElement('style');
            mq.textContent = '@media(max-width:768px){.moon-static{width:21.84%!important;padding-bottom:21.84%!important}.earth-img{width:100%!important;padding-bottom:100%!important}}';
            container.append(earth, moon);
            root.append(container, mq);
            activeMoon = moon;
            setMoon(moon);
            watchMoon(moon);
            earthTimer(1800);
        }

        /* 
           模式3：月球公转  可根据需要调整数值 (vh 为单位)控制上下位置
        */
        function renderMoonOrbit() {
            const root = document.getElementById('appRoot');
            root.innerHTML = '';
            const container = document.createElement('div');
            container.style.cssText = 'position:relative;width:90vw;max-width:1200px;height:90vh;margin-left:40%;margin-right:5%;display:flex;align-items:center;transform: translateY(3vh);';
            
            const earth = document.createElement('div');
            earth.className = 'earth-img';
            earth.style.cssText = `width:60%;padding-bottom:60%;border-radius:50%;background:url(${EARTH_URL}) 50% 0%/cover no-repeat;position:relative;left:50%;transform:translateX(-50%);`;
            
            const moon = document.createElement('div');
            moon.style.cssText = 'width:10%;padding-bottom:10%;border-radius:50%;background-size:cover;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;animation:orbit 300s linear infinite;';
            moon.classList.add('moon-orbit');
            
            // 公转关键帧动画 (带响应式适配)
            const anim = document.createElement('style');
            anim.textContent = `
                @keyframes orbit {
                    from { transform: translate(-50%,-50%) rotate(0deg) translateX(calc(50% + 20vw)) rotate(0deg); }
                    to { transform: translate(-50%,-50%) rotate(360deg) translateX(calc(50% + 20vw)) rotate(-360deg); }
                }
                @media(max-width:768px) {
                    .moon-orbit { width:21.84%!important; padding-bottom:21.84%!important; }
                    .earth-img { width:100%!important; padding-bottom:100%!important; }
                    @keyframes orbit {
                        from { transform: translate(-50%,-50%) rotate(0deg) translateX(calc(50% + 12vw)) rotate(0deg); }
                        to { transform: translate(-50%,-50%) rotate(360deg) translateX(calc(50% + 12vw)) rotate(-360deg); }
                    }
                }
            `;
            container.append(earth, moon);
            root.append(container, anim);
            activeMoon = moon;
            setMoon(moon);
            watchMoon(moon);
            earthTimer(1800);
        }

        /* 模式4：全屏中国云图 (自动刷新) */
        function renderFullscreen() {
            const root = document.getElementById('appRoot');
            root.innerHTML = '';
            stopAll();
            activeMoon = null;
            const wrap = document.createElement('div');
            wrap.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;';
            const img = document.createElement('img');
            img.src = CHINA_URL;
            img.style.cssText = 'width:150%;height:150%;object-fit:cover;flex-shrink:0;';
            wrap.appendChild(img);
            root.appendChild(wrap);
            refreshTimer = setInterval(() => { img.src = CHINA_URL + '?t=' + Date.now(); }, 18e5);
        }

        /* 模式切换路由 */
        function setMode(id) {
            if (currentMode === id) return;
            currentMode = id;
            stopAll();
            clearInterval(moonTimer);
            activeMoon = null;
            switch (id) {
                case 'earth_only':   renderEarthOnly(); break;
                case 'moon_static':  renderMoonStatic(); break;
                case 'moon_orbit':   renderMoonOrbit(); break;
                case 'fullscreen':   renderFullscreen(); break;
                default:             renderEarthOnly();
            }
        }

        const MODE_CYCLE = ['earth_only', 'moon_static', 'moon_orbit', 'fullscreen'];

        function getNextMode(current) {
            const idx = MODE_CYCLE.indexOf(current);
            return MODE_CYCLE[(idx + 1) % MODE_CYCLE.length];
        }

        /* 将当前模式写入URL参数，便于收藏 */
        function updateUrlMode(mode) {
            const url = new URL(location);
            url.searchParams.set('mode', mode);
            history.replaceState({}, '', url);
        }

        // ---------- 启动 ----------
        window.addEventListener('DOMContentLoaded', () => {
            const urlMode = new URLSearchParams(location.search).get('mode');
            const initMode = ['earth_only', 'moon_static', 'moon_orbit', 'fullscreen'].includes(urlMode) ? urlMode : 'earth_only';
            setMode(initMode);

            document.getElementById('modeBtn').addEventListener('click', () => {
                const next = getNextMode(currentMode);
                setMode(next);
                updateUrlMode(next);
            });
        });
    </script>
</body>
</html>
