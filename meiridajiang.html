<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;

  .app-container {
    width: 100%;

    margin: 0 auto;

    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(18px);

    border-radius: 20px;

  .title-bar {
    background: linear-gradient(90deg, #e74c3c, #f39c12);
    text-align: center;
    padding: 10px 0;

    font-weight: 700;
    color: #fff;

  .mode-row {
    display: flex;

</style>

<body>
  <div class="app-container">
    <div class="card">
      <div class="title-bar">每 日 大 奖</div>
      <div class="mode-row">
        <label>
          <input type="radio" name="mode" value="ssq" checked>
          <span><span class="dot"></span> 双色球</span>
        </label>
        <label>
          <input type="radio" name="mode" value="dlt">
          <span><span class="dot"></span> 大乐透</span>
        </label>
      </div>
      <div class="result-box" id="resultArea">
        <div class="hint-text">点击 随机生成 获得号码</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-cycle" id="cycleBtn">组数 <span class="badge" id="groupBadge">1</span></button>
        <button class="btn btn-refresh" id="refreshBtn">随机生成</button>
        <button class="btn btn-smart" id="smartBtn">智能推荐</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-cold" id="coldRecommendBtn">追冷推荐</button>
        <button class="btn btn-hot" id="hotRecommendBtn">追热推荐</button>
      </div>
    </div>

    <div class="card">
      <div class="title-bar" style="background: linear-gradient(90deg,#2d3436,#636e72);">近 10 期开奖号码</div>
      <div class="history-list" id="historyList"></div>
      <div class="history-meta" id="historyMeta"></div>
    </div>

    <div class="card">
      <div class="title-bar" style="background: linear-gradient(90deg,#e67e22,#f1c40f);">近10期走势图 · 冷热分析</div>
      <div class="trend-header">
        <h3 id="trendTitle">双色球 · 红球频率分布</h3>
        <div class="trend-stats" id="trendStats">加载中...</div>
      </div>
      <div class="chart-container">
        <div id="frontChart" style="width:100%; height:500px;"></div>
        <div id="backChart" style="width:100%; height:230px;"></div>
      </div>
      <div class="hotcold-panel" id="hotcoldPanel"></div>
    </div>
  </div>

  <script>
    let currentMode = 'ssq';
    let groups = 1;

    let trendCache = { ssq: null, dlt: null };
    let trendLoading = { ssq: false, dlt: false };

    let frontChartInstance = null;
    let backChartInstance = null;

    const resultDiv = document.getElementById('resultArea');
    const trendStatsSpan = document.getElementById('trendStats');
    const trendTitleSpan = document.getElementById('trendTitle');
    const hotcoldPanel = document.getElementById('hotcoldPanel');
    const groupBadge = document.getElementById('groupBadge');
    const historyListDiv = document.getElementById('historyList');
    const historyMetaSpan = document.getElementById('historyMeta');

    function rand(n) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return 1 + (arr[0] % n);
    }

    function pickUnique(count, max) {
      const set = new Set();
      while (set.size < count) set.add(rand(max));
      return [...set].sort((a, b) => a - b);
    }

    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function genSSQ() {
      return { reds: pickUnique(6, 33), blues: [rand(16)] };
    }

    function genDLT() {
      return { reds: pickUnique(5, 35), blues: pickUnique(2, 12) };
    }

    function refreshNumbers() {
      const isSSQ = currentMode === 'ssq';
      let html = '';
      for (let i = 0; i < groups; i++) {
        const d = isSSQ ? genSSQ() : genDLT();
        html += '<div class="number-line">';
        d.reds.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);
        html += '<span class="sep">+</span>';
        d.blues.forEach(n => html += `<span class="ball ${isSSQ ? 'blue' : 'back'}">${pad(n)}</span>`);
        html += '</div>';
      }
      html += `<div class="hint-text" style="font-size:10px; margin-top:4px;">随机生成</div>`;
      resultDiv.innerHTML = html;
    }

    function showHint() {
      const name = currentMode === 'ssq' ? '双色球' : '大乐透';
      resultDiv.innerHTML = `<div class="hint-text">点击下方按钮获得 ${groups} 组${name}号码<br>随机生成 或 基于近10期真实数据生成</div>`;
    }

    async function fetchTrendData(lotteryType) {
      if (trendCache[lotteryType]) return trendCache[lotteryType];
      if (trendLoading[lotteryType]) return null;
      trendLoading[lotteryType] = true;
      try {
        const limit = 88;
        const url = '';
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        let list = json?.data?.data?.list;
        if (!list || !list.length) throw new Error('empty list');
        let records = [];
        for (let item of list) {
          if (lotteryType === 'ssq') {
            let reds = (item.red_balls || []).map(Number).sort((a, b) => a - b);
            let blue = Number(item.blue_ball);
            if (reds.length === 6 && blue >= 1 && blue <= 16) records.push({ reds, blues: [blue], date: item.date,
              period: item.issue });
          } else {
            let fronts = (item.front_balls || []).map(Number).sort((a, b) => a - b);
            let backs = (item.back_balls || []).map(Number).sort((a, b) => a - b);
            if (fronts.length === 5 && backs.length === 2) records.push({ reds: fronts, blues: backs, date: item.date,
              period: item.issue });
          }
        }
        if (records.length === 0) throw new Error('parse fail');
        trendCache[lotteryType] = records.slice(0, 88);
        return trendCache[lotteryType];
      } catch (e) {
        console.warn('fetchTrendData error:', e);
        trendCache[lotteryType] = null;
        return null;
      } finally {
        trendLoading[lotteryType] = false;
      }
    }

    function analyzeStats(records, type) {
      if (!records || records.length === 0) return null;
      const isSSQ = type === 'ssq';
      const frontMax = isSSQ ? 33 : 35;
      const backMax = isSSQ ? 16 : 12;
      let frontFreq = new Array(frontMax + 1).fill(0);
      let backFreq = new Array(backMax + 1).fill(0);
      let frontMiss = new Array(frontMax + 1).fill(0);
      let backMiss = new Array(backMax + 1).fill(0);
      let frontMet = new Array(frontMax + 1).fill(false);
      let backMet = new Array(backMax + 1).fill(false);
      let sorted = [...records];
      if (sorted.length && sorted[0].date && sorted[sorted.length - 1].date && sorted[0].date < sorted[sorted.length - 1]
        .date) sorted.reverse();
      for (let i = 0; i < sorted.length; i++) {
        const rec = sorted[i];
        rec.reds.forEach(num => {
          frontFreq[num]++;
          if (!frontMet[num]) { frontMiss[num] = i;
            frontMet[num] = true; }
        });
        rec.blues.forEach(num => {
          backFreq[num]++;
          if (!backMet[num]) { backMiss[num] = i;
            backMet[num] = true; }
        });
      }
      for (let i = 1; i <= frontMax; i++)
        if (!frontMet[i]) frontMiss[i] = sorted.length;
      for (let i = 1; i <= backMax; i++)
        if (!backMet[i]) backMiss[i] = sorted.length;

      let frontEntries = [];
      for (let i = 1; i <= frontMax; i++) frontEntries.push({ num: i, freq: frontFreq[i], miss: frontMiss[i] });
      frontEntries.sort((a, b) => b.freq - a.freq);
      let hotFront = frontEntries.slice(0, 5);
      let coldFront = [...frontEntries].sort((a, b) => a.freq - b.freq).slice(0, 5);
      let backEntries = [];
      for (let i = 1; i <= backMax; i++) backEntries.push({ num: i, freq: backFreq[i], miss: backMiss[i] });
      backEntries.sort((a, b) => b.freq - a.freq);
      let hotBack = backEntries.slice(0, 3);
      let coldBack = [...backEntries].sort((a, b) => a.freq - b.freq).slice(0, 3);
      return { frontFreq, backFreq, frontMiss, backMiss, totalPeriods: sorted.length,
        hotFront, coldFront, hotBack, coldBack, frontMax, backMax };
    }

    function renderHorizontalBarChart(containerId, categories, values, titleColor, barColorStart, barColorEnd, axisName) {
      const dom = document.getElementById(containerId);
      if (!dom) return;
      let chart = null;
      if (containerId === 'frontChart') {
        if (frontChartInstance) chart = frontChartInstance;
        else { chart = echarts.init(dom);
          frontChartInstance = chart; }
      } else {
        if (backChartInstance) chart = backChartInstance;
        else { chart = echarts.init(dom);
          backChartInstance = chart; }
      }

      const baseOption = {
        backgroundColor: 'transparent',
        tooltip: { show: false },
        grid: { containLabel: true, left: '12%', right: '5%', top: 20, bottom: 10 },
        xAxis: { type: 'value', name: axisName, nameTextStyle: { color: '#cccccc', fontSize: 10 }, splitLine: {
            lineStyle: { color: '#444444' } }, axisLabel: { color: '#dddddd' } },
        yAxis: { type: 'category', data: categories, axisLabel: { fontSize: 9, color: '#dddddd', interval: 0,
            rotate: 0 }, axisLine: { lineStyle: { color: '#888888' } }, axisTick: { show: false } },
        series: [{
          type: 'bar',
          data: values,
          label: { show: true, position: 'right', color: '#ffd966', fontSize: 9, formatter: (params) => params
              .value > 0 ? params.value : '' },
          itemStyle: { borderRadius: [0, 4, 4, 0], color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0,
              colorStops: [{ offset: 0, color: barColorStart }, { offset: 1, color: barColorEnd }] } }
        }]
      };

      chart.setOption(baseOption);
    }

    function clearCharts() {
      if (frontChartInstance) {
        frontChartInstance.clear();
        frontChartInstance.setOption({
          backgroundColor: 'transparent',
          title: { text: '暂无数据', textStyle: { color: '#888', fontSize: 14, fontWeight: 'normal' }, left: 'center',
            top: 'center' }
        });
      }
      if (backChartInstance) {
        backChartInstance.clear();
        backChartInstance.setOption({
          backgroundColor: 'transparent',
          title: { text: '暂无数据', textStyle: { color: '#888', fontSize: 14, fontWeight: 'normal' }, left: 'center',
            top: 'center' }
        });
      }
    }

    async function renderTrend() {
      const type = currentMode;
      trendTitleSpan.innerText = type === 'ssq' ? '双色球 · 红球频率分布' : '大乐透 · 前区频率分布';
      trendStatsSpan.innerHTML = '加载近10期数据...';
      const records = await fetchTrendData(type);
      if (!records || records.length === 0) {
        trendStatsSpan.innerHTML = '数据加载失败！';
        hotcoldPanel.innerHTML = `<div class="error-text">无法获取走势数据，请稍后重试</div>`;
        clearCharts();
        return;
      }
      const stats = analyzeStats(records, type);
      if (!stats) {
        trendStatsSpan.innerHTML = '数据解析失败！';
        hotcoldPanel.innerHTML = `<div class="error-text">数据格式异常，请稍后重试</div>`;
        clearCharts();
        return;
      }

      const frontCategories = Array.from({ length: stats.frontMax }, (_, i) => i + 1);
      const frontData = frontCategories.map(num => stats.frontFreq[num] || 0);
      const backCategories = Array.from({ length: stats.backMax }, (_, i) => i + 1);
      const backData = backCategories.map(num => stats.backFreq[num] || 0);

      renderHorizontalBarChart('frontChart', frontCategories, frontData, '出现次数', '#e74c3c', '#f39c12', '出现次数');
      renderHorizontalBarChart('backChart', backCategories, backData, '出现次数', '#3498db', '#9b59b6', '出现次数');

      trendStatsSpan.innerHTML = `共 ${stats.totalPeriods} 期 | 热号高频 | 冷号低开 | 遗漏统计`;

      let hotHtml = `<div class="hotcold-box"><h4>热号</h4>`;
      hotHtml += `<span class="section-label">前区热号</span><div class="plain-number-list">`;
      stats.hotFront.forEach(h => { hotHtml += `<span class="plain-number">${h.num} (${h.freq}次)</span>`; });
      hotHtml += `</div><span class="section-label">后区热号</span><div class="plain-number-list">`;
      stats.hotBack.forEach(h => { hotHtml += `<span class="plain-number">${h.num} (${h.freq}次)</span>`; });
      hotHtml += `</div></div>`;

      let coldHtml = `<div class="hotcold-box"><h4>冷号</h4>`;
      coldHtml += `<span class="section-label">前区冷号</span><div class="plain-number-list">`;
      stats.coldFront.forEach(c => {
        let missVal = stats.frontMiss[c.num] || 0;
        coldHtml += `<span class="plain-number">${c.num} (漏${missVal}期)</span>`;
      });
      coldHtml += `</div><span class="section-label">后区冷号</span><div class="plain-number-list">`;
      stats.coldBack.forEach(c => {
        let missVal = stats.backMiss[c.num] || 0;
        coldHtml += `<span class="plain-number">${c.num} (漏${missVal}期)</span>`;
      });
      coldHtml += `</div></div>`;

      let missHtml = `<div class="hotcold-box"><h4>最大遗漏</h4>`;
      let maxMissFront = 0,
        maxMissNum = 0;
      for (let i = 1; i <= stats.frontMax; i++)
        if (stats.frontMiss[i] > maxMissFront) { maxMissFront = stats.frontMiss[i];
          maxMissNum = i; }
      missHtml += `<p>前区最大遗漏: ${maxMissNum}号 (${maxMissFront}期未开)</p>`;
      let maxMissBack = 0,
        maxMissBNum = 0;
      for (let i = 1; i <= stats.backMax; i++)
        if (stats.backMiss[i] > maxMissBack) { maxMissBack = stats.backMiss[i];
          maxMissBNum = i; }
      missHtml += `<p>后区最大遗漏: ${maxMissBNum}号 (${maxMissBack}期未开)</p>`;
      missHtml += `</div>`;
      hotcoldPanel.innerHTML = hotHtml + coldHtml + missHtml;
    }

    function weightedSelect(pool, count) {
      let total = pool.reduce((s, o) => s + o.weight, 0);
      let selected = new Set();
      let result = [];
      let tempPool = [...pool];
      while (result.length < count && tempPool.length) {
        let randVal = Math.random() * total;
        let acc = 0,
          pick = null;
        for (let i = 0; i < tempPool.length; i++) {
          acc += tempPool[i].weight;
          if (randVal <= acc) { pick = tempPool[i]; break; }
        }
        if (pick && !selected.has(pick.num)) {
          selected.add(pick.num);
          result.push(pick.num);
          let idx = tempPool.findIndex(p => p.num === pick.num);
          if (idx !== -1) tempPool.splice(idx, 1);
          total = tempPool.reduce((s, o) => s + o.weight, 0);
        } else if (!pick) break;
      }
      while (result.length < count) {
        let extra = Math.floor(Math.random() * (pool.length > 0 ? pool[0].num : 35)) + 1;
        if (!selected.has(extra)) { result.push(extra);
          selected.add(extra); }
      }
      return result.sort((a, b) => a - b);
    }

    function smartRecommend(mode = 'balance') {
      const records = trendCache[currentMode];
      if (!records || records.length === 0) {
        resultDiv.innerHTML = `<div class="error-text">走势数据加载失败，无法进行推荐</div>`;
        return;
      }
      const stats = analyzeStats(records, currentMode);
      if (!stats) {
        resultDiv.innerHTML = `<div class="error-text">数据解析异常，无法推荐</div>`;
        return;
      }
      const isSSQ = currentMode === 'ssq';
      const frontCnt = isSSQ ? 6 : 5;
      const backCnt = isSSQ ? 1 : 2;
      const frontMax = stats.frontMax;
      const backMax = stats.backMax;

      let html = '';
      for (let g = 0; g < groups; g++) {
        let frontPool = [];
        for (let i = 1; i <= frontMax; i++) {
          let weight;
          if (mode === 'cold') {
            weight = (stats.frontMiss[i] + 1) * 2;
          } else if (mode === 'hot') {
            weight = stats.frontFreq[i] + 2;
          } else {
            weight = 10 - stats.frontFreq[i] + stats.frontMiss[i] * 0.7;
          }
          weight = Math.max(1, weight);
          frontPool.push({ num: i, weight });
        }
        let backPool = [];
        for (let i = 1; i <= backMax; i++) {
          let weight;
          if (mode === 'cold') {
            weight = (stats.backMiss[i] + 1) * 2;
          } else if (mode === 'hot') {
            weight = stats.backFreq[i] + 2;
          } else {
            weight = 10 - stats.backFreq[i] + stats.backMiss[i] * 0.8;
          }
          weight = Math.max(1, weight);
          backPool.push({ num: i, weight });
        }
        let redsRec = weightedSelect(frontPool, frontCnt);
        let bluesRec = weightedSelect(backPool, backCnt);
        html += '<div class="number-line">';
        redsRec.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);
        html += '<span class="sep">+</span>';
        bluesRec.forEach(n => html += `<span class="ball ${isSSQ ? 'blue' : 'back'}">${pad(n)}</span>`);
        html += '</div>';
      }
      let modeText = '';
      if (mode === 'cold') modeText = '追冷模式 (侧重高遗漏)';
      else if (mode === 'hot') modeText = '追热模式 (侧重高频)';
      else modeText = '冷热均衡策略';
      html += `<div class="hint-text" style="font-size:10px; margin-top:4px;">${modeText}</div>`;
      resultDiv.innerHTML = html;
    }

    let historyStore = { ssq: [], dlt: [] };

    async function loadHistory(lotteryType) {
      try {
        const resp = await fetch('');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        let list = json?.data?.data?.list;
        if (!list || !list.length) throw new Error('empty list');
        let parsed = [];
        if (lotteryType === 'ssq') {
          parsed = list.map(item => ({
            period: item.issue,
            date: item.date.slice(5),
            nums: (item.red_balls || []).map(Number).sort((a, b) => a - b),
            blue: Number(item.blue_ball)
          }));
        } else {
          parsed = list.map(item => ({
            period: item.issue,
            date: item.date.slice(5),
            nums: (item.front_balls || []).map(Number).sort((a, b) => a - b),
            blues: (item.back_balls || []).map(Number).sort((a, b) => a - b)
          }));
        }
        historyStore[lotteryType] = parsed.slice(0, 10);
      } catch (e) {
        console.warn('loadHistory error:', e);
        historyStore[lotteryType] = [];
      }
      if (lotteryType === currentMode) renderHistory();
    }

    function renderHistory() {
      const items = historyStore[currentMode];
      if (!items || items.length === 0) {
        historyListDiv.innerHTML = `<div class="error-text">近10期数据加载失败！</div>`;
        historyMetaSpan.innerHTML = `<span style="color:#ff6b6b;">数据不可用！</span>`;
        return;
      }
      let html = '';
      const isSSQ = currentMode === 'ssq';
      items.forEach(item => {
        html += '<div class="history-row">';
        html += `<span class="period">${item.period}期</span>`;
        item.nums.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);
        if (isSSQ) {
          html += `<span class="ball blue">${pad(item.blue)}</span>`;
        } else {
          item.blues.forEach(b => html += `<span class="ball back">${pad(b)}</span>`);
        }
        html += `<span class="date">${item.date}</span></div>`;
      });
      historyListDiv.innerHTML = html;
      historyMetaSpan.innerHTML = `<span class="dot ok"></span> 共 ${items.length} 期 (含最近开奖)`;
    }

    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener('change', async (e) => {
        currentMode = e.target.value;
        showHint();
        renderHistory();
        await renderTrend();
      });
    });

    document.getElementById('cycleBtn').addEventListener('click', () => {
      groups = groups % 5 + 1;
      groupBadge.innerText = groups;
      showHint();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => refreshNumbers());
    document.getElementById('smartBtn').addEventListener('click', () => smartRecommend('balance'));
    document.getElementById('coldRecommendBtn').addEventListener('click', () => smartRecommend('cold'));
    document.getElementById('hotRecommendBtn').addEventListener('click', () => smartRecommend('hot'));

    window.addEventListener('resize', () => {
      if (frontChartInstance) frontChartInstance.resize();
      if (backChartInstance) backChartInstance.resize();
    });

    (async () => {
      showHint();
      await Promise.all([loadHistory('ssq'), loadHistory('dlt')]);
      renderHistory();
      await renderTrend();
    })();
  </script>
</body>
