<style>
  * {

  body {
    min-height: 100vh;

<body>
  <div class="app-container">
    <div class="card">
      <div class="title-bar">每 日 大 奖</div>
      <div class="mode-row">
        <label>
          <input type="radio" name="mode" value="ssq" checked>
          <span><span class="dot"></span> 双色球</span>
        </label>
        <label>
          <input type="radio" name="mode" value="dlt">
          <span><span class="dot"></span> 大乐透</span>
        </label>
      </div>
      <div class="result-box" id="resultArea">
        <div class="hint-text">⏳ 加载数据中...</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-cycle" id="cycleBtn">组数 <span class="badge" id="groupBadge">1</span></button>
        <button class="btn btn-refresh" id="refreshBtn">随机生成</button>
        <button class="btn btn-smart" id="smartBtn">智能推荐</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-cold" id="coldRecommendBtn">追冷推荐</button>
        <button class="btn btn-hot" id="hotRecommendBtn">追热推荐</button>
      </div>
      <div class="data-hint" id="dataStatus">📊 数据来源于外部独立文件</div>
    </div>

    <div class="card">
      <div class="title-bar" id="historyTitle" style="background: linear-gradient(90deg,#2d3436,#636e72);">历史数据</div>
      <div class="history-list" id="historyList"></div>
      <div class="history-meta" id="historyMeta">
        <span class="info" id="historyInfo"></span>
        <span class="pagination">
          <button id="prevPageBtn" disabled>上一页</button>
          <span id="pageInfo">1/10</span>
          <button id="nextPageBtn">下一页</button>
        </span>
      </div>
    </div>

    <div class="card">
      <div class="title-bar" id="trendTitleBar" style="background: linear-gradient(90deg,#e67e22,#f1c40f);">历史数据</div>
      <div class="trend-header">
        <h3 id="trendTitle">双色球 · 红球频率分布</h3>
        <div class="trend-stats" id="trendStats">加载中...</div>
      </div>
      <div class="chart-container">
        <div id="frontChart" style="width:100%; height:500px;"></div>
        <div id="backChart" style="width:100%; height:230px;"></div>
      </div>
      <div class="hotcold-panel" id="hotcoldPanel"></div>
    </div>
  </div>

  <script>
    // ======================== 核心逻辑 ========================
    let currentMode = 'ssq';
    let groups = 1;
    let currentPage = 1;
    const PAGE_SIZE = 10;

    let SSQ_DATA = [];
    let DLT_DATA = [];

    let trendCache = { ssq: null, dlt: null };
    let frontChartInstance = null;
    let backChartInstance = null;

    const resultDiv = document.getElementById('resultArea');
    const trendStatsSpan = document.getElementById('trendStats');
    const trendTitleSpan = document.getElementById('trendTitle');
    const hotcoldPanel = document.getElementById('hotcoldPanel');
    const groupBadge = document.getElementById('groupBadge');
    const historyListDiv = document.getElementById('historyList');
    const historyMetaSpan = document.getElementById('historyMeta');
    const historyInfoSpan = document.getElementById('historyInfo');
    const pageInfoSpan = document.getElementById('pageInfo');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const dataStatusDiv = document.getElementById('dataStatus');

    function rand(n) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return 1 + (arr[0] % n);
    }

    function pickUnique(count, max) {
      const set = new Set();
      while (set.size < count) set.add(rand(max));
      return [...set].sort((a, b) => a - b);
    }

    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function genSSQ() {
      return { reds: pickUnique(6, 33), blues: [rand(16)] };
    }

    function genDLT() {
      return { reds: pickUnique(5, 35), blues: pickUnique(2, 12) };
    }

    function refreshNumbers() {
      const isSSQ = currentMode === 'ssq';
      let html = '';
      for (let i = 0; i < groups; i++) {
        const d = isSSQ ? genSSQ() : genDLT();
        html += '<div class="number-line">';
        d.reds.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);
        html += '<span class="sep">+</span>';
        d.blues.forEach(n => html += `<span class="ball ${isSSQ ? 'blue' : 'back'}">${pad(n)}</span>`);
        html += '</div>';
      }
      html += `<div class="hint-text" style="font-size:10px; margin-top:4px;">🎲 随机生成</div>`;
      resultDiv.innerHTML = html;
    }

    function showHint() {
      const name = currentMode === 'ssq' ? '双色球' : '大乐透';
      const data = currentMode === 'ssq' ? SSQ_DATA : DLT_DATA;
      const count = data.length;
      resultDiv.innerHTML = `<div class="hint-text">点击下方按钮获得 ${groups} 组${name}号码<br>随机生成 或 基于近${count}期真实数据推荐</div>`;
    }

    function parseBuiltinData(type) {
      const raw = type === 'ssq' ? SSQ_DATA : DLT_DATA;
      const records = [];
      for (let line of raw) {
        const parts = line.split('|');
        if (parts.length < 4) continue;
        const issue = parts[0].trim();
        const date = parts[1].trim();
        const redsStr = parts[2].trim();
        const bluesStr = parts[3].trim();
        const reds = redsStr.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n > 0);
        const blues = bluesStr.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n > 0);
        if (reds.length === 0 || blues.length === 0) continue;
        if (type === 'ssq') {
          if (reds.length !== 6 || blues.length !== 1) continue;
          if (reds.some(n => n < 1 || n > 33)) continue;
          if (blues.some(n => n < 1 || n > 16)) continue;
        } else {
          if (reds.length !== 5 || blues.length !== 2) continue;
          if (reds.some(n => n < 1 || n > 35)) continue;
          if (blues.some(n => n < 1 || n > 12)) continue;
        }
        records.push({
          issue,
          date,
          reds: reds.slice().sort((a, b) => a - b),
          blues: blues.slice().sort((a, b) => a - b)
        });
      }
      records.sort((a, b) => {
        if (a.date > b.date) return -1;
        if (a.date < b.date) return 1;
        return 0;
      });
      return records;
    }

    function getData(type) {
      if (trendCache[type]) return trendCache[type];
      const records = parseBuiltinData(type);
      trendCache[type] = records;
      return records;
    }

    let historyStore = { ssq: [], dlt: [] };

    function loadHistory(lotteryType) {
      const allData = getData(lotteryType);
      const recent = allData;
      historyStore[lotteryType] = recent.map(item => ({
        period: item.issue,
        date: item.date.slice(5),
        nums: item.reds,
        blues: item.blues,
        blue: item.blues[0]
      }));
      if (lotteryType === currentMode) renderHistory();
    }

    function renderHistory() {
      const items = historyStore[currentMode];
      if (!items || items.length === 0) {
        historyListDiv.innerHTML = `<div class="error-text">📭 历史数据加载失败</div>`;
        historyInfoSpan.textContent = '数据不可用';
        pageInfoSpan.textContent = '0/0';
        prevPageBtn.disabled = true;
        nextPageBtn.disabled = true;
        return;
      }

      const total = items.length;
      const totalPages = Math.ceil(total / PAGE_SIZE);
      if (currentPage > totalPages) currentPage = totalPages || 1;
      if (currentPage < 1) currentPage = 1;

      const start = (currentPage - 1) * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, total);
      const pageItems = items.slice(start, end);

      const isSSQ = currentMode === 'ssq';
      let html = '';
      pageItems.forEach(item => {
        html += '<div class="history-row">';
        html += `<span class="period">${item.period}期</span>`;
        item.nums.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);
        if (isSSQ) {
          html += `<span class="ball blue">${pad(item.blue)}</span>`;
        } else {
          item.blues.forEach(b => html += `<span class="ball back">${pad(b)}</span>`);
        }
        html += `<span class="date">${item.date}</span></div>`;
      });
      historyListDiv.innerHTML = html;

      historyInfoSpan.textContent = `共 ${total} 期 (第${start+1}-${end}期)`;
      pageInfoSpan.textContent = `${currentPage}/${totalPages}`;
      prevPageBtn.disabled = (currentPage <= 1);
      nextPageBtn.disabled = (currentPage >= totalPages);
    }

    function goToPage(page) {
      const items = historyStore[currentMode];
      if (!items || items.length === 0) return;
      const totalPages = Math.ceil(items.length / PAGE_SIZE);
      if (page < 1) page = 1;
      if (page > totalPages) page = totalPages;
      if (currentPage === page) return;
      currentPage = page;
      renderHistory();
    }

    function analyzeStats(records, type) {
      if (!records || records.length === 0) return null;
      const isSSQ = type === 'ssq';
      const frontMax = isSSQ ? 33 : 35;
      const backMax = isSSQ ? 16 : 12;
      let frontFreq = new Array(frontMax + 1).fill(0);
      let backFreq = new Array(backMax + 1).fill(0);
      let frontMiss = new Array(frontMax + 1).fill(0);
      let backMiss = new Array(backMax + 1).fill(0);
      let frontMet = new Array(frontMax + 1).fill(false);
      let backMet = new Array(backMax + 1).fill(false);
      for (let i = 0; i < records.length; i++) {
        const rec = records[i];
        rec.reds.forEach(num => {
          frontFreq[num]++;
          if (!frontMet[num]) { frontMiss[num] = i;
            frontMet[num] = true; }
        });
        rec.blues.forEach(num => {
          backFreq[num]++;
          if (!backMet[num]) { backMiss[num] = i;
            backMet[num] = true; }
        });
      }
      for (let i = 1; i <= frontMax; i++) {
        if (!frontMet[i]) frontMiss[i] = records.length;
      }
      for (let i = 1; i <= backMax; i++) {
        if (!backMet[i]) backMiss[i] = records.length;
      }
      let frontEntries = [];
      for (let i = 1; i <= frontMax; i++) {
        frontEntries.push({ num: i, freq: frontFreq[i], miss: frontMiss[i] });
      }
      frontEntries.sort((a, b) => b.freq - a.freq);
      let hotFront = frontEntries.slice(0, 5);
      let coldFront = [...frontEntries].sort((a, b) => a.freq - b.freq).slice(0, 5);
      let backEntries = [];
      for (let i = 1; i <= backMax; i++) {
        backEntries.push({ num: i, freq: backFreq[i], miss: backMiss[i] });
      }
      backEntries.sort((a, b) => b.freq - a.freq);
      let hotBack = backEntries.slice(0, 3);
      let coldBack = [...backEntries].sort((a, b) => a.freq - b.freq).slice(0, 3);
      return {
        frontFreq, backFreq, frontMiss, backMiss, totalPeriods: records.length,
        hotFront, coldFront, hotBack, coldBack, frontMax, backMax
      };
    }

    function weightedSelect(pool, count) {
      let total = pool.reduce((s, o) => s + o.weight, 0);
      let selected = new Set();
      let result = [];
      let tempPool = [...pool];
      while (result.length < count && tempPool.length) {
        let randVal = Math.random() * total;
        let acc = 0, pick = null;
        for (let i = 0; i < tempPool.length; i++) {
          acc += tempPool[i].weight;
          if (randVal <= acc) { pick = tempPool[i]; break; }
        }
        if (pick && !selected.has(pick.num)) {
          selected.add(pick.num);
          result.push(pick.num);
          let idx = tempPool.findIndex(p => p.num === pick.num);
          if (idx !== -1) tempPool.splice(idx, 1);
          total = tempPool.reduce((s, o) => s + o.weight, 0);
        } else if (!pick) break;
      }
      while (result.length < count) {
        const max = pool.length > 0 ? Math.max(...pool.map(p => p.num)) : 35;
        let extra = Math.floor(Math.random() * max) + 1;
        if (!selected.has(extra)) { result.push(extra);
          selected.add(extra); }
      }
      return result.sort((a, b) => a - b);
    }

    function smartRecommend(mode) {
      const records = getData(currentMode);
      if (!records || records.length === 0) {
        resultDiv.innerHTML = `<div class="error-text">⚠️ 走势数据未加载，无法推荐</div>`;
        return;
      }
      const stats = analyzeStats(records, currentMode);
      if (!stats) {
        resultDiv.innerHTML = `<div class="error-text">数据解析异常，无法推荐</div>`;
        return;
      }
      const isSSQ = currentMode === 'ssq';
      const frontCnt = isSSQ ? 6 : 5;
      const backCnt = isSSQ ? 1 : 2;
      const frontMax = stats.frontMax;
      const backMax = stats.backMax;
      let html = '';
      for (let g = 0; g < groups; g++) {
        let frontPool = [];
        for (let i = 1; i <= frontMax; i++) {
          let weight;
          if (mode === 'cold') {
            weight = (stats.frontMiss[i] + 1) * 2;
          } else if (mode === 'hot') {
            weight = stats.frontFreq[i] + 2;
          } else {
            weight = 10 - stats.frontFreq[i] + stats.frontMiss[i] * 0.7;
          }
          weight = Math.max(1, weight);
          frontPool.push({ num: i, weight });
        }
        let backPool = [];
        for (let i = 1; i <= backMax; i++) {
          let weight;
          if (mode === 'cold') {
            weight = (stats.backMiss[i] + 1) * 2;
          } else if (mode === 'hot') {
            weight = stats.backFreq[i] + 2;
          } else {
            weight = 10 - stats.backFreq[i] + stats.backMiss[i] * 0.8;
          }
          weight = Math.max(1, weight);
          backPool.push({ num: i, weight });
        }
        let redsRec = weightedSelect(frontPool, frontCnt);
        let bluesRec = weightedSelect(backPool, backCnt);
        html += '<div class="number-line">';
        redsRec.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);
        html += '<span class="sep">+</span>';
        bluesRec.forEach(n => html += `<span class="ball ${isSSQ ? 'blue' : 'back'}">${pad(n)}</span>`);
        html += '</div>';
      }
      const modeTextMap = {
        cold: '❄️ 追冷模式 (侧重高遗漏)',
        hot: '🔥 追热模式 (侧重高频)',
        balance: '⚖️ 冷热均衡策略'
      };
      html += `<div class="hint-text" style="font-size:10px; margin-top:4px;">${modeTextMap[mode] || mode}</div>`;
      resultDiv.innerHTML = html;
    }

    function renderHorizontalBarChart(containerId, categories, values, barColorStart, barColorEnd, axisName) {
      const dom = document.getElementById(containerId);
      if (!dom) return;
      let chart = null;
      if (containerId === 'frontChart') {
        if (frontChartInstance) chart = frontChartInstance;
        else { chart = echarts.init(dom);
          frontChartInstance = chart; }
      } else {
        if (backChartInstance) chart = backChartInstance;
        else { chart = echarts.init(dom);
          backChartInstance = chart; }
      }
      const baseOption = {
        backgroundColor: 'transparent',
        tooltip: { show: false },
        grid: { containLabel: true, left: '12%', right: '5%', top: 20, bottom: 10 },
        xAxis: {
          type: 'value',
          name: axisName,
          nameTextStyle: { color: '#cccccc', fontSize: 10 },
          splitLine: { lineStyle: { color: '#444444' } },
          axisLabel: { color: '#dddddd' }
        },
        yAxis: {
          type: 'category',
          data: categories,
          axisLabel: { fontSize: 9, color: '#dddddd', interval: 0, rotate: 0 },
          axisLine: { lineStyle: { color: '#888888' } },
          axisTick: { show: false }
        },
        series: [{
          type: 'bar',
          data: values,
          label: {
            show: true,
            position: 'right',
            color: '#ffd966',
            fontSize: 9,
            formatter: (params) => params.value > 0 ? params.value : ''
          },
          itemStyle: {
            borderRadius: [0, 4, 4, 0],
            color: {
              type: 'linear',
              x: 0,
              y: 0,
              x2: 1,
              y2: 0,
              colorStops: [
                { offset: 0, color: barColorStart },
                { offset: 1, color: barColorEnd }
              ]
            }
          }
        }]
      };
      chart.setOption(baseOption, true);
      chart.resize();
    }

    function clearCharts() {
      const msg = { text: '暂无数据', textStyle: { color: '#888', fontSize: 14, fontWeight: 'normal' }, left: 'center',
        top: 'center' };
      if (frontChartInstance) {
        frontChartInstance.clear();
        frontChartInstance.setOption({ backgroundColor: 'transparent', title: msg });
      }
      if (backChartInstance) {
        backChartInstance.clear();
        backChartInstance.setOption({ backgroundColor: 'transparent', title: msg });
      }
    }

    function renderTrend() {
      const type = currentMode;
      const name = type === 'ssq' ? '双色球' : '大乐透';
      trendTitleSpan.innerText = type === 'ssq' ? '双色球 · 红球频率分布' : '大乐透 · 前区频率分布';
      trendStatsSpan.innerHTML = '⏳ 加载数据...';
      const records = getData(type);
      if (!records || records.length === 0) {
        trendStatsSpan.innerHTML = '❌ 数据加载失败';
        hotcoldPanel.innerHTML = `<div class="error-text">⚠️ 无法获取走势数据</div>`;
        clearCharts();
        return;
      }
      const stats = analyzeStats(records, type);
      if (!stats) {
        trendStatsSpan.innerHTML = '❌ 数据解析失败';
        hotcoldPanel.innerHTML = `<div class="error-text">数据格式异常</div>`;
        clearCharts();
        return;
      }
      const frontCategories = Array.from({ length: stats.frontMax }, (_, i) => i + 1);
      const frontData = frontCategories.map(num => stats.frontFreq[num] || 0);
      renderHorizontalBarChart('frontChart', frontCategories, frontData, '#e74c3c', '#f39c12', '出现次数');
      const backCategories = Array.from({ length: stats.backMax }, (_, i) => i + 1);
      const backData = backCategories.map(num => stats.backFreq[num] || 0);
      renderHorizontalBarChart('backChart', backCategories, backData, '#3498db', '#9b59b6', '出现次数');
      const total = stats.totalPeriods;
      trendStatsSpan.innerHTML = `📊 共 ${total} 期 | 热号高频 · 冷号低开 · 遗漏统计`;
      let hotHtml = `<div class="hotcold-box"><h4>🔥 热号</h4>`;
      hotHtml += `<span class="section-label">${type === 'ssq' ? '红球' : '前区'}热号</span><div class="plain-number-list">`;
      stats.hotFront.forEach(h => { hotHtml += `<span class="plain-number">${h.num} (${h.freq}次)</span>`; });
      hotHtml += `</div><span class="section-label">${type === 'ssq' ? '蓝球' : '后区'}热号</span><div class="plain-number-list">`;
      stats.hotBack.forEach(h => { hotHtml += `<span class="plain-number">${h.num} (${h.freq}次)</span>`; });
      hotHtml += `</div></div>`;
      let coldHtml = `<div class="hotcold-box"><h4>❄️ 冷号</h4>`;
      coldHtml += `<span class="section-label">${type === 'ssq' ? '红球' : '前区'}冷号</span><div class="plain-number-list">`;
      stats.coldFront.forEach(c => {
        const missVal = stats.frontMiss[c.num] || 0;
        coldHtml += `<span class="plain-number">${c.num} (漏${missVal}期)</span>`;
      });
      coldHtml += `</div><span class="section-label">${type === 'ssq' ? '蓝球' : '后区'}冷号</span><div class="plain-number-list">`;
      stats.coldBack.forEach(c => {
        const missVal = stats.backMiss[c.num] || 0;
        coldHtml += `<span class="plain-number">${c.num} (漏${missVal}期)</span>`;
      });
      coldHtml += `</div></div>`;
      let missHtml = `<div class="hotcold-box"><h4>📌 最大遗漏</h4>`;
      let maxMissFront = 0, maxMissNum = 0;
      for (let i = 1; i <= stats.frontMax; i++) {
        if (stats.frontMiss[i] > maxMissFront) { maxMissFront = stats.frontMiss[i];
          maxMissNum = i; }
      }
      missHtml += `<p>${type === 'ssq' ? '红' : '前区'}最大遗漏: ${maxMissNum}号 (${maxMissFront}期未开)</p>`;
      let maxMissBack = 0, maxMissBNum = 0;
      for (let i = 1; i <= stats.backMax; i++) {
        if (stats.backMiss[i] > maxMissBack) { maxMissBack = stats.backMiss[i];
          maxMissBNum = i; }
      }
      missHtml += `<p>${type === 'ssq' ? '蓝' : '后区'}最大遗漏: ${maxMissBNum}号 (${maxMissBack}期未开)</p>`;
      missHtml += `</div>`;
      hotcoldPanel.innerHTML = hotHtml + coldHtml + missHtml;
    }

    // ---- 从外部 fetch 数据 ----
    async function fetchData() {
      try {
        const [ssqResp, dltResp] = await Promise.all([
          fetch('https://magua-qi.github.io/ssqdata.html'),
          fetch('https://magua-qi.github.io/dltdata.html')
        ]);

        if (!ssqResp.ok || !dltResp.ok) {
          throw new Error('网络请求失败');
        }

        const ssqText = await ssqResp.text();
        const dltText = await dltResp.text();

        // 从 HTML 中提取数组定义
        function extractArray(html, varName) {
          const regex = new RegExp(`const\\s+${varName}\\s*=\\s*\\[([\\s\\S]*?)\\];`);
          const match = html.match(regex);
          if (!match) return [];
          // 将匹配到的数组字符串转换为真正的数组
          try {
            // 先去除注释行
            let cleaned = match[1].replace(/\/\/.*$/gm, '');
            // 使用 Function 构造器安全解析
            const fn = new Function(`return [${cleaned}];`);
            return fn();
          } catch (e) {
            console.error(`解析 ${varName} 失败:`, e);
            return [];
          }
        }

        SSQ_DATA = extractArray(ssqText, 'SSQ_DATA');
        DLT_DATA = extractArray(dltText, 'DLT_DATA');

        console.log(`✅ 双色球数据加载完成: ${SSQ_DATA.length} 期`);
        console.log(`✅ 大乐透数据加载完成: ${DLT_DATA.length} 期`);

        // 数据加载完成后初始化
        showHint();
        loadHistory('ssq');
        loadHistory('dlt');
        renderHistory();
        renderTrend();
        dataStatusDiv.textContent = `📊 双色球 ${SSQ_DATA.length} 期 · 大乐透 ${DLT_DATA.length} 期`;

      } catch (err) {
        console.error('加载数据失败:', err);
        resultDiv.innerHTML = `<div class="error-text">⚠️ 数据加载失败，请检查网络连接</div>`;
        dataStatusDiv.textContent = '❌ 数据加载失败';
      }
    }

    // ---- 事件绑定 ----
    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener('change', async (e) => {
        currentMode = e.target.value;
        currentPage = 1;
        showHint();
        renderHistory();
        renderTrend();
      });
    });

    document.getElementById('cycleBtn').addEventListener('click', () => {
      groups = groups % 5 + 1;
      groupBadge.innerText = groups;
      showHint();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => refreshNumbers());
    document.getElementById('smartBtn').addEventListener('click', () => smartRecommend('balance'));
    document.getElementById('coldRecommendBtn').addEventListener('click', () => smartRecommend('cold'));
    document.getElementById('hotRecommendBtn').addEventListener('click', () => smartRecommend('hot'));

    prevPageBtn.addEventListener('click', () => goToPage(currentPage - 1));
    nextPageBtn.addEventListener('click', () => goToPage(currentPage + 1));

    window.addEventListener('resize', () => {
      if (frontChartInstance) frontChartInstance.resize();
      if (backChartInstance) backChartInstance.resize();
    });

    // ---- 启动 ----
    fetchData();
  </script>
