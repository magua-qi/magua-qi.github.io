<style>
  * {

<body>
<div class="app-container">
  <div class="card">
    <div class="title-bar">每 日 大 奖</div>
    <div class="mode-row">
      <label>
        <input type="radio" name="mode" value="ssq" checked>
        <span><span class="dot"></span> 双色球</span>
      </label>
      <label>
        <input type="radio" name="mode" value="dlt">
        <span><span class="dot"></span> 大乐透</span>
      </label>
    </div>
    <div class="result-box" id="resultArea">
      <div class="hint-text">点击 随机生成 获得号码</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-cycle" id="cycleBtn">组数 <span class="badge" id="groupBadge">1</span></button>
      <button class="btn btn-refresh" id="refreshBtn">随机生成</button>
      <button class="btn btn-smart" id="smartBtn">智能推荐</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-cold" id="coldRecommendBtn">❄️ 追冷推荐</button>
      <button class="btn btn-hot" id="hotRecommendBtn">🔥 追热推荐</button>
    </div>
  </div>

  <div class="card">
    <div class="title-bar" style="background: linear-gradient(90deg,#2d3436,#636e72);">近 10 期开奖号码</div>
    <div class="history-list" id="historyList"></div>
    <div class="history-meta" id="historyMeta"></div>
  </div>

  <div class="card">
    <div class="title-bar" style="background: linear-gradient(90deg,#e67e22,#f1c40f);">近88期走势图 · 冷热分析</div>
    <div class="trend-header">
      <h3 id="trendTitle">双色球 · 红球频率分布</h3>
      <div class="trend-stats" id="trendStats">加载中...</div>
    </div>
    <div class="chart-container">
      <div id="frontChart" style="width:100%; height:500px;"></div>
      <div id="backChart" style="width:100%; height:230px;"></div>
    </div>
    <div class="hotcold-panel" id="hotcoldPanel"></div>
  </div>

  <div class="card almanac-card">
    <div class="title-bar" style="background: linear-gradient(90deg,#d63031, #e17055);">📅 今日黄历 · 运势选号</div>
    <div class="almanac-content" id="almanacContent"></div>
    <button class="btn btn-almanac" id="fortuneBtn">✨ 运势选号 ✨</button>
    <div id="fortuneNumbers" class="fortune-numbers" style="margin: 0 16px 16px 16px;"></div>
  </div>
</div>

<script>
  let currentMode = 'ssq';
  let groups = 1;
  
  let trendCache = { ssq: null, dlt: null };
  let trendLoading = { ssq: false, dlt: false };
  
  let frontChartInstance = null;
  let backChartInstance = null;
  
  const resultDiv = document.getElementById('resultArea');
  const trendStatsSpan = document.getElementById('trendStats');
  const trendTitleSpan = document.getElementById('trendTitle');
  const hotcoldPanel = document.getElementById('hotcoldPanel');
  const groupBadge = document.getElementById('groupBadge');
  const historyListDiv = document.getElementById('historyList');
  const historyMetaSpan = document.getElementById('historyMeta');
  const almanacDiv = document.getElementById('almanacContent');
  const fortuneDiv = document.getElementById('fortuneNumbers');
  
  function rand(n) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return 1 + (arr[0] % n);
  }
  function pickUnique(count, max) {
    const set = new Set();
    while (set.size < count) set.add(rand(max));
    return [...set].sort((a, b) => a - b);
  }
  function pad(n) {
    return n < 10 ? '0' + n : '' + n;
  }
  
  function genSSQ() {
    return { reds: pickUnique(6, 33), blues: [rand(16)] };
  }
  function genDLT() {
    return { reds: pickUnique(5, 35), blues: pickUnique(2, 12) };
  }
  
  function refreshNumbers() {
    const isSSQ = currentMode === 'ssq';
    let html = '';
    for (let i = 0; i < groups; i++) {
      const d = isSSQ ? genSSQ() : genDLT();
      html += '<div class="number-line">';
      d.reds.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);
      html += '<span class="sep">+</span>';
      d.blues.forEach(n => html += `<span class="ball ${isSSQ ? 'blue' : 'back'}">${pad(n)}</span>`);
      html += '</div>';
    }
    resultDiv.innerHTML = html;
  }
  
  function showHint() {
    const name = currentMode === 'ssq' ? '双色球' : '大乐透';
    resultDiv.innerHTML = `<div class="hint-text">点击 随机生成 获得 ${groups} 组${name}号码<br>走势图基于近88期真实数据</div>`;
  }
  
  async function fetchTrendData(lotteryType) {
    if (trendCache[lotteryType]) return trendCache[lotteryType];
    if (trendLoading[lotteryType]) return null;
    trendLoading[lotteryType] = true;
    try {
      const limit = 88;
      const url = `https://api.ruseo.cn/api/lottery?type=${lotteryType}&page=1&limit=${limit}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const json = await resp.json();
      let list = json?.data?.data?.list;
      if (!list || !list.length) throw new Error('empty');
      let records = [];
      for (let item of list) {
        if (lotteryType === 'ssq') {
          let reds = (item.red_balls || '').split(',').map(Number).sort((a,b)=>a-b);
          let blue = Number(item.blue_ball);
          if (reds.length === 6 && blue >= 1 && blue <= 16) records.push({ reds, blues: [blue], date: item.date, period: item.issue });
        } else {
          let fronts = (item.front_balls || '').split(',').map(Number).sort((a,b)=>a-b);
          let backs = (item.back_balls || '').split(',').map(Number).sort((a,b)=>a-b);
          if (fronts.length === 5 && backs.length === 2) records.push({ reds: fronts, blues: backs, date: item.date, period: item.issue });
        }
      }
      if (records.length === 0) throw new Error('parse fail');
      trendCache[lotteryType] = records.slice(0, 88);
      return trendCache[lotteryType];
    } catch (e) {
      const mock = [];
      const isSSQ = lotteryType === 'ssq';
      for (let i = 1; i <= 88; i++) {
        if (isSSQ) mock.push({ reds: pickUnique(6,33), blues: [rand(16)], date: `2026-${String(30+(i%20)).padStart(2,'0')}-${String(1+(i%28)).padStart(2,'0')}`, period: `2026${String(50+i).slice(-2)}` });
        else mock.push({ reds: pickUnique(5,35), blues: pickUnique(2,12), date: `2026-${String(30+(i%20)).padStart(2,'0')}-${String(1+(i%28)).padStart(2,'0')}`, period: `2026${String(50+i).slice(-2)}` });
      }
      trendCache[lotteryType] = mock;
      return mock;
    } finally {
      trendLoading[lotteryType] = false;
    }
  }
  
  function analyzeStats(records, type) {
    if (!records || records.length === 0) return null;
    const isSSQ = type === 'ssq';
    const frontMax = isSSQ ? 33 : 35;
    const backMax = isSSQ ? 16 : 12;
    let frontFreq = new Array(frontMax+1).fill(0);
    let backFreq = new Array(backMax+1).fill(0);
    let frontMiss = new Array(frontMax+1).fill(0);
    let backMiss = new Array(backMax+1).fill(0);
    let frontMet = new Array(frontMax+1).fill(false);
    let backMet = new Array(backMax+1).fill(false);
    let sorted = [...records];
    if (sorted.length && sorted[0].date && sorted[sorted.length-1].date && sorted[0].date < sorted[sorted.length-1].date) sorted.reverse();
    for (let i=0; i<sorted.length; i++) {
      const rec = sorted[i];
      rec.reds.forEach(num => {
        frontFreq[num]++;
        if (!frontMet[num]) { frontMiss[num] = i; frontMet[num] = true; }
      });
      rec.blues.forEach(num => {
        backFreq[num]++;
        if (!backMet[num]) { backMiss[num] = i; backMet[num] = true; }
      });
    }
    for (let i=1; i<=frontMax; i++) if (!frontMet[i]) frontMiss[i] = sorted.length;
    for (let i=1; i<=backMax; i++) if (!backMet[i]) backMiss[i] = sorted.length;
    
    let frontEntries = [];
    for (let i=1; i<=frontMax; i++) frontEntries.push({num:i, freq:frontFreq[i], miss:frontMiss[i]});
    frontEntries.sort((a,b)=>b.freq - a.freq);
    let hotFront = frontEntries.slice(0,5);
    let coldFront = [...frontEntries].sort((a,b)=>a.freq - b.freq).slice(0,5);
    let backEntries = [];
    for (let i=1; i<=backMax; i++) backEntries.push({num:i, freq:backFreq[i], miss:backMiss[i]});
    backEntries.sort((a,b)=>b.freq - a.freq);
    let hotBack = backEntries.slice(0,3);
    let coldBack = [...backEntries].sort((a,b)=>a.freq - b.freq).slice(0,3);
    return { frontFreq, backFreq, frontMiss, backMiss, totalPeriods: sorted.length,
             hotFront, coldFront, hotBack, coldBack, frontMax, backMax };
  }
  
  function renderHorizontalBarChart(containerId, categories, values, titleColor, barColorStart, barColorEnd, axisName) {
    const dom = document.getElementById(containerId);
    if (!dom) return;
    let chart = null;
    if (containerId === 'frontChart') {
      if (frontChartInstance) chart = frontChartInstance;
      else { chart = echarts.init(dom); frontChartInstance = chart; }
    } else {
      if (backChartInstance) chart = backChartInstance;
      else { chart = echarts.init(dom); backChartInstance = chart; }
    }
    
    const baseOption = {
      backgroundColor: 'transparent',
      tooltip: { show: false },

  function weightedSelect(pool, count) {
    let total = pool.reduce((s,o)=>s+o.weight,0);
    let selected = new Set();
    let result = [];
    let tempPool = [...pool];
    while(result.length < count && tempPool.length) {
      let randVal = Math.random() * total;
      let acc = 0, pick = null;
      for(let i=0; i<tempPool.length; i++) {
        acc += tempPool[i].weight;
        if(randVal <= acc) { pick = tempPool[i]; break; }
      }
      if(pick && !selected.has(pick.num)) {
        selected.add(pick.num);
        result.push(pick.num);
        let idx = tempPool.findIndex(p=>p.num===pick.num);
        if(idx!==-1) tempPool.splice(idx,1);
        total = tempPool.reduce((s,o)=>s+o.weight,0);
      } else if(!pick) break;
    }
    while(result.length < count) {
      let extra = Math.floor(Math.random() * (pool.length > 0 ? pool[0].num : 35)) + 1;
      if(!selected.has(extra)) { result.push(extra); selected.add(extra); }
    }
    return result.sort((a,b)=>a-b);
  }

          weight = stats.frontFreq[i] + 2;

        }
        weight = Math.max(1, weight);
        frontPool.push({ num: i, weight });
      }
      let backPool = [];
      for (let i=1; i<=backMax; i++) {

          weight = (stats.backMiss[i] + 1) * 2;
        } else if (mode === 'hot') {
          weight = stats.backFreq[i] + 2;
        } else {
          weight = 10 - stats.backFreq[i] + stats.backMiss[i] * 0.8;
        }
        weight = Math.max(1, weight);
        backPool.push({ num: i, weight });
      }
      let redsRec = weightedSelect(frontPool, frontCnt);
      let bluesRec = weightedSelect(backPool, backCnt);
      html += '<div class="number-line">';
      redsRec.forEach(n => html += `<span class="ball ${isSSQ ? 'red' : 'front'}">${pad(n)}</span>`);

  async function loadHistory(lotteryType) {
    try {
      const resp = await fetch(`https://api.ruseo.cn/api/lottery?type=${lotteryType}&page=1&limit=10`);
      if (!resp.ok) throw new Error();
      const json = await resp.json();
      let list = json?.data?.data?.list;
      if (list && list.length) {
        let parsed = [];
        if (lotteryType === 'ssq') {
          parsed = list.map(item => ({ period: item.issue, date: item.date.slice(5), nums: item.red_balls.split(',').map(Number).sort((a,b)=>a-b), blue: Number(item.blue_ball) }));
        } else {
          parsed = list.map(item => ({ period: item.issue, date: item.date.slice(5), nums: item.front_balls.split(',').map(Number).sort((a,b)=>a-b), blues: item.back_balls.split(',').map(Number).sort((a,b)=>a-b) }));
        }
        let full = [...parsed];
        const mock = lotteryType === 'ssq' ? FULL_SSQ : FULL_DLT;
        while (full.length < 10) full.push(mock[full.length % mock.length]);
        historyStore[lotteryType] = full.slice(0,10);
      } else throw new Error();
    } catch(e) {
      historyStore[lotteryType] = lotteryType === 'ssq' ? [...FULL_SSQ] : [...FULL_DLT];
    }
    if (lotteryType === currentMode) renderHistory();
  }

  function getAlmanac() {
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    const day = today.getDate();
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const weekday = weekdays[today.getDay()];
    
    const gan = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    const zhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    const zodiacs = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
    
    let yearGanZhi = '';
    let yearZodiac = '';
    let monthGanZhi = '';
    let dayGanZhi = '';
    
    if (year === 2026) {
      yearGanZhi = '丙午';
      yearZodiac = '马';
      monthGanZhi = '乙巳';
      const seed = (month * 31 + day) % 60;
      dayGanZhi = gan[seed % 10] + zhi[seed % 12];
    } else {
      const seedYear = (year - 2026 + 60) % 60;
      yearGanZhi = gan[seedYear % 10] + zhi[seedYear % 12];
      yearZodiac = zodiacs[seedYear % 12];
      const seedMonth = (year * 12 + month) % 60;
      monthGanZhi = gan[seedMonth % 10] + zhi[seedMonth % 12];
      const seedDay = (today.getTime() / 86400000) % 60;
      dayGanZhi = gan[seedDay % 10] + zhi[seedDay % 12];
    }
    
    const springFestival2026 = new Date(2026, 1, 17);
    let lunarYear, lunarMonth, lunarDay;
    const diffDays = Math.floor((today - springFestival2026) / 86400000);
    if (diffDays >= 0) {
      lunarYear = 2026;
      let lunarDays = diffDays;
      lunarMonth = Math.floor(lunarDays / 30) + 1;
      if (lunarMonth > 12) lunarMonth = 12;
      lunarDay = (lunarDays % 30) + 1;
    } else {
      lunarYear = 2025;
      let lunarDays = -diffDays - 1;
      lunarMonth = Math.floor(lunarDays / 30) + 1;
      if (lunarMonth > 12) lunarMonth = 12;
      lunarDay = (lunarDays % 30) + 1;
    }
    const lunarMonthNames = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
    const lunarMonthStr = lunarMonthNames[lunarMonth - 1] || `${lunarMonth}月`;
    
    const seed = (month * day + today.getDay()) % 100;
    const yiList = ['嫁娶', '纳财', '开市', '交易', '出行', '祈福', '祭祀', '求嗣', '开光', '解除', '修造', '动土', '安床', '栽种', '纳畜'];
    const jiList = ['诸事不宜', '诉讼', '纳采', '安葬', '作灶', '破土', '开仓', '入宅', '移徙', '理发', '针灸', '伐木', '行丧'];
    const yi = [yiList[seed % yiList.length], yiList[(seed+7) % yiList.length], yiList[(seed+3) % yiList.length]].slice(0,3);
    const ji = [jiList[seed % jiList.length], jiList[(seed+5) % jiList.length]].slice(0,2);
    
    const chongZodiac = zodiacs[((today.getFullYear() + today.getMonth() + today.getDate()) % 12)];
    const shenSha = ['岁德合', '天德', '月德', '三合', '六合', '天喜', '福星'][seed % 7];
    
    return {
      solar: `${year}年${month}月${day}日 ${weekday}`,
      lunar: `${lunarYear}年 ${lunarMonthStr}${lunarDay}日`,
      ganzhi: `${yearGanZhi}年 ${monthGanZhi}月 ${dayGanZhi}日`,
      zodiac: `🐎 生肖: ${yearZodiac} · 日冲: ${chongZodiac}`,
      yi: yi,
      ji: ji,
      shenSha: `吉神: ${shenSha}`,
    };
  }
  
  function getFortuneNumbers() {
    const alm = getAlmanac();
    const isSSQ = currentMode === 'ssq';
    const frontCount = isSSQ ? 6 : 5;
    const backCount = isSSQ ? 1 : 2;
    const frontMax = isSSQ ? 33 : 35;
    const backMax = isSSQ ? 16 : 12;
    
    let seed = 0;
    for (let ch of alm.ganzhi + alm.solar + alm.lunar) seed += ch.charCodeAt(0);
    seed = seed % 10000;
    function seededRandom() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }
    
    const reds = new Set();
    while (reds.size < frontCount) {
      let r = Math.floor(seededRandom() * frontMax) + 1;
      reds.add(r);
    }
    let redsArr = [...reds].sort((a,b)=>a-b);
    
    const blues = new Set();
    while (blues.size < backCount) {
      let b = Math.floor(seededRandom() * backMax) + 1;
      blues.add(b);
    }
    let bluesArr = [...blues].sort((a,b)=>a-b);
    
    return { reds: redsArr, blues: bluesArr };
  }
