                        b.classList.add(state.mode === 'timed' ? 'active-mode-timed' : 'active-mode-quantity');
                    }
                });

                const isTimed = (state.mode === 'timed');
                paramLabel.textContent = isTimed ? '时长' : '题数';
                paramGroup.querySelectorAll('.setting-btn').forEach(b => {
                    if (b.dataset.time !== undefined) {
                        b.classList.toggle('hidden', !isTimed);
                        b.classList.remove('active-time');
                    }
                    if (b.dataset.quantity !== undefined) {
                        b.classList.toggle('hidden', isTimed);
                        b.classList.remove('active-quantity');
                    }
                });
                state.selectedTime = null;
                state.selectedQuantity = null;
                btnStart.disabled = !canStart();
                saveSettings();
                setFeedback('empty', '模式已' + (state.mode ? '选择' : '取消') + '，请重新选择参数', '·');
                updateInfoBar();
            }

            // ===== 保存/加载设置 =====
            function saveSettings() {
                try {
                    const data = {
                        mode: state.mode,
                        selectedTime: state.selectedTime,
                        selectedQuantity: state.selectedQuantity,
                        selectedOps: state.selectedOps.slice(),
                        selectedDiff: state.selectedDiff,
                    };
                    localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
                } catch (e) {}
            }

            function loadSettings() {
                try {
                    const raw = localStorage.getItem(SETTINGS_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (data.mode !== undefined) state.mode = data.mode;
                    if (data.selectedTime !== undefined) state.selectedTime = data.selectedTime;
                    if (data.selectedQuantity !== undefined) state.selectedQuantity = data.selectedQuantity;
                    if (data.selectedOps) state.selectedOps = data.selectedOps.slice();
                    if (data.selectedDiff !== undefined) state.selectedDiff = data.selectedDiff;
                    syncSettingsUI();
                    return true;
                } catch (e) { return false; }
            }

            function syncSettingsUI() {
                modeGroup.querySelectorAll('.setting-btn').forEach(b => {
                    b.classList.remove('active-mode-timed', 'active-mode-quantity');
                    if (b.dataset.mode === state.mode) {
                        b.classList.add(state.mode === 'timed' ? 'active-mode-timed' : 'active-mode-quantity');
                    }
                });
                const isTimed = (state.mode === 'timed');
                paramLabel.textContent = isTimed ? '时长' : '题数';
                paramGroup.querySelectorAll('.setting-btn').forEach(b => {
                    if (b.dataset.time !== undefined) {
                        b.classList.toggle('hidden', !isTimed);
                        b.classList.remove('active-time');
                        if (isTimed && b.dataset.time == state.selectedTime) {
                            b.classList.add('active-time');
                        }
                    }
                    if (b.dataset.quantity !== undefined) {
                        b.classList.toggle('hidden', isTimed);
                        b.classList.remove('active-quantity');
                        if (!isTimed && b.dataset.quantity == state.selectedQuantity) {
                            b.classList.add('active-quantity');
                        }
                    }
                });
                opGroup.querySelectorAll('.setting-btn').forEach(b => {
                    b.classList.remove('active-op');
                    if (state.selectedOps.includes(b.dataset.op)) b.classList.add('active-op');
                });
                diffGroup.querySelectorAll('.setting-btn').forEach(b => {
                    b.classList.remove('active-diff');
                    if (parseInt(b.dataset.diff, 10) === state.selectedDiff) b.classList.add('active-diff');
                });
                if (btnStart) btnStart.disabled = !canStart();
            }

            // ===== 保存/加载状态 =====
            function saveState() {
                try {
                    const data = {
                        mode: state.mode,
                        selectedTime: state.selectedTime,
                        selectedQuantity: state.selectedQuantity,
                        selectedOps: state.selectedOps.slice(),
                        selectedDiff: state.selectedDiff,
                        totalSeconds: state.totalSeconds,
                        remainingSeconds: state.remainingSeconds,
                        totalQuestions: state.totalQuestions,
                        answeredQuestions: state.answeredQuestions,
                        elapsedSeconds: state.elapsedSeconds,
                        records: state.records,
                        correctCount: state.correctCount,
                        wrongCount: state.wrongCount,
                        totalCount: state.totalCount,
                        isFinished: state.isFinished,
                        isRunning: state.isRunning,
                        isPaused: state.isPaused,
                        currentQuestion: state.currentQuestion,
                        timestamp: Date.now(),
                        correctionMode: state.correctionMode,
                        correctionQuestions: state.correctionQuestions,
                        correctionCorrectCount: state.correctionCorrectCount,
                        correctionWrongCount: state.correctionWrongCount,
                        correctionAnsweredCount: state.correctionAnsweredCount,
                        correctionFinished: state.correctionFinished,
                        correctionPaused: state.correctionPaused,
                        correctionTotalAttempts: state.correctionTotalAttempts,
                        correctionAttemptedCount: state.correctionAttemptedCount,
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    state.hasCache = true;
                } catch (e) {}
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (data.mode !== undefined) state.mode = data.mode;
                    if (data.selectedTime !== undefined) state.selectedTime = data.selectedTime;
                    if (data.selectedQuantity !== undefined) state.selectedQuantity = data.selectedQuantity;
                    if (data.selectedOps) state.selectedOps = data.selectedOps.slice();
                    if (data.selectedDiff !== undefined) state.selectedDiff = data.selectedDiff;
                    if (data.totalSeconds) state.totalSeconds = data.totalSeconds;
                    if (data.remainingSeconds !== undefined) state.remainingSeconds = data.remainingSeconds;
                    if (data.totalQuestions) state.totalQuestions = data.totalQuestions;
                    if (data.answeredQuestions !== undefined) state.answeredQuestions = data.answeredQuestions;
                    if (data.elapsedSeconds !== undefined) state.elapsedSeconds = data.elapsedSeconds;
                    if (data.records) state.records = data.records.slice();
                    if (data.correctCount !== undefined) state.correctCount = data.correctCount;
                    if (data.wrongCount !== undefined) state.wrongCount = data.wrongCount;
                    if (data.totalCount !== undefined) state.totalCount = data.totalCount;
                    if (data.isFinished !== undefined) state.isFinished = data.isFinished;
                    if (data.isRunning !== undefined) state.isRunning = data.isRunning;
                    if (data.isPaused !== undefined) state.isPaused = data.isPaused;
                    if (data.currentQuestion) state.currentQuestion = data.currentQuestion;

                    if (data.correctionMode !== undefined) state.correctionMode = data.correctionMode;
                    if (data.correctionQuestions) state.correctionQuestions = data.correctionQuestions.slice();
                    if (data.correctionCorrectCount !== undefined) state.correctionCorrectCount = data
                    .correctionCorrectCount;
                    if (data.correctionWrongCount !== undefined) state.correctionWrongCount = data.correctionWrongCount;
                    if (data.correctionAnsweredCount !== undefined) state.correctionAnsweredCount = data
                        .correctionAnsweredCount;
                    if (data.correctionFinished !== undefined) state.correctionFinished = data.correctionFinished;
                    if (data.correctionPaused !== undefined) state.correctionPaused = data.correctionPaused;
                    if (data.correctionTotalAttempts !== undefined) state.correctionTotalAttempts = data
                        .correctionTotalAttempts;
                    if (data.correctionAttemptedCount !== undefined) state.correctionAttemptedCount = data
                        .correctionAttemptedCount;

                    if (data.timestamp && state.mode === 'timed' && !state.isFinished && state.isRunning) {
                        const elapsed = Math.floor((Date.now() - data.timestamp) / 1000);
                        state.remainingSeconds = Math.max(0, state.remainingSeconds - elapsed);
                        if (state.remainingSeconds <= 0) { state.isFinished = true;
                            state.isRunning = false; }
                    }

                    state.hasCache = (state.totalCount > 0 || state.records.length > 0 || state.currentQuestion !== null ||
                        state.isPaused || state.isRunning || state.correctionMode);

                    if (!state.hasCache) {
                        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                        return false;
                    }

                    updateInfoBar();
                    renderQuestion();
                    renderInput();
                    syncSettingsUI();

                    if (state.correctionMode) {
                        if (state.correctionFinished) {
                            disableAllControls();
                            setSettingsEnabled(true);
                            const remain = state.correctionQuestions.length;
                            if (remain > 0) {
                                showButtons('finished');
                                setFeedback('empty', '本轮结束，还有 ' + remain + ' 道错题，继续改正或重新开始', '*');
                            } else {
                                showButtons('finished');
                                setFeedback('correct', '改错已完成！', '*');
                                correctionResultExtra.style.display = 'block';
                                correctionResultExtra.innerHTML = '<span class="correction-label">改错完成！</span> 全部错题已改正！';
                                resultPanel.classList.add('show');
                            }
                            updateInfoBar();
                        } else if (state.isRunning && !state.correctionPaused) {
                            setSettingsEnabled(false);
                            showButtons('running');
                            if (state.correctionQuestions.length > 0) {
                                resetCorrectionQuestion();
                                setControlsEnabled(true);
                                submitBtn.disabled = false;
                            } else {
                                finishCorrection();
                            }
                            updateInfoBar();
                            setFeedback('empty', '改错模式进行中...', '#');
                        } else {
                            setSettingsEnabled(false);
                            showButtons('idle');
                            if (state.correctionQuestions.length > 0) {
                                if (!state.currentQuestion) {
                                    const idx = getRandomInt(0, state.correctionQuestions.length - 1);
                                    state.currentQuestion = state.correctionQuestions[idx];
                                }
                                renderQuestion();
                                renderInput();
                                disableAllControls();
                            } else {
                                finishCorrection();
                            }
                            updateInfoBar();
                            setFeedback('empty', '改错模式已就绪', '#');
                        }
                        return true;
                    }

                    if (state.isFinished) {
                        disableAllControls();
                        setSettingsEnabled(true);
                        showResultPanel();
                        showButtons('finished');
                        if (state.mode === 'timed') setFeedback('empty', '已结束，查看下方统计', 'T');
                        else setFeedback('empty', '已完成，查看下方统计', '*');
                    } else if (state.isRunning) {
                        state.isRunning = false;
                        state.isPaused = true;
                        disableAllControls();
                        setSettingsEnabled(true);
                        showButtons('idle_with_cache');
                        setFeedback('empty', '上次练习已保存，点击"继续答题"恢复', 'S');
                    } else if (state.totalCount > 0 || state.currentQuestion !== null) {
                        showButtons('idle_with_cache');
                        setFeedback('empty', '上次练习已保存，点击"继续答题"恢复', 'S');
                        disableAllControls();
                        setSettingsEnabled(true);
                    } else {
                        state.hasCache = false;
                        return false;
                    }
                    return true;
                } catch (e) { return false; }
            }

            // ===== 重置全部（主界面重新开始） =====
            function resetAll() {
                if (state.timerInterval) clearInterval(state.timerInterval);
                if (state.clockInterval) clearInterval(state.clockInterval);
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                try { localStorage.removeItem(SETTINGS_KEY); } catch (e) {}

                state.mode = null;
                state.selectedTime = null;
                state.selectedQuantity = null;
                state.selectedOps = [];
                state.selectedDiff = null;
                state.totalSeconds = 5 * 60;
                state.remainingSeconds = 5 * 60;
                state.totalQuestions = 10;
                state.answeredQuestions = 0;
                state.elapsedSeconds = 0;
                state.startTimestamp = null;
                state.records = [];
                state.correctCount = 0;
                state.wrongCount = 0;
                state.totalCount = 0;
                state.input = '';
                state.isAnswered = false;
                state.currentQuestion = null;
                state.isRunning = false;
                state.isFinished = false;
                state.isPaused = false;
                state.hasCache = false;

                state.correctionMode = false;
                state.correctionQuestions = [];
                state.correctionCorrectCount = 0;
                state.correctionWrongCount = 0;
                state.correctionAnsweredCount = 0;
                state.correctionFinished = false;
                state.correctionPaused = false;
                state.correctionTotalAttempts = 0;
                state.correctionAttemptedCount = 0;

                resultPanel.classList.remove('show');
                correctionResultExtra.style.display = 'none';
                disableAllControls();
                setSettingsEnabled(true);
                syncSettingsUI();
                const q = generateQuestion(['add'], 10);
                if (q) state.currentQuestion = q;
                renderQuestion();
                renderInput();
                timerDisplay.textContent = '00:00';
                progressText.classList.add('hidden');
                correctionProgressText.classList.add('hidden');
                wrongHint.classList.add('hidden');
                infoStatus.textContent = '待开始';
                infoStatus.className = 'info-status';
                setFeedback('empty', '请选择模式、运算、参数和难度后开始', '·');
                showButtons('idle');
                btnStart.disabled = !canStart();
                saveState();
            }

            // ===== 事件绑定 =====
            modeGroup.addEventListener('click', function(e) {
                const btn = e.target.closest('.setting-btn');
                if (!btn || btn.disabled) return;
                selectMode(btn.dataset.mode);
            });

            paramGroup.addEventListener('click', function(e) {
                const btn = e.target.closest('.setting-btn');
                if (!btn || btn.disabled || btn.classList.contains('hidden')) return;
                if (state.mode === 'timed') {
                    const time = parseInt(btn.dataset.time, 10);
                    if (!isNaN(time)) {
                        state.selectedTime = time;
                        paramGroup.querySelectorAll('.setting-btn[data-time]').forEach(b => b.classList.remove(
                        'active-time'));
                        btn.classList.add('active-time');
                        setFeedback('empty', '已选 ' + time + ' 分钟', '·');
                        btnStart.disabled = !canStart();
                        saveSettings();
                        updateInfoBar();
                    }
                } else if (state.mode === 'quantity') {
                    const qty = parseInt(btn.dataset.quantity, 10);
                    if (!isNaN(qty)) {
                        state.selectedQuantity = qty;
                        paramGroup.querySelectorAll('.setting-btn[data-quantity]').forEach(b => b.classList.remove(
                            'active-quantity'));
                        btn.classList.add('active-quantity');
                        setFeedback('empty', '已选 ' + qty + ' 题', '·');
                        btnStart.disabled = !canStart();
                        saveSettings();
                        updateInfoBar();
                    }
                }
            });

            opGroup.addEventListener('click', function(e) {
                const btn = e.target.closest('.setting-btn');
                if (!btn || btn.disabled) return;
                btn.classList.toggle('active-op');
                const ops = [];
                opGroup.querySelectorAll('.setting-btn.active-op').forEach(b => ops.push(b.dataset.op));
                state.selectedOps = ops;
                if (state.selectedOps.length === 0) setFeedback('empty', '请至少选择一种运算', '!');
                else setFeedback('empty', '运算已更新', '·');
                btnStart.disabled = !canStart();
                saveSettings();
                updateInfoBar();
            });

            diffGroup.addEventListener('click', function(e) {
                const btn = e.target.closest('.setting-btn');
                if (!btn || btn.disabled) return;
                const diff = parseInt(btn.dataset.diff, 10);
                if (isNaN(diff)) return;
                state.selectedDiff = diff;
                diffGroup.querySelectorAll('.setting-btn').forEach(b => b.classList.remove('active-diff'));
                btn.classList.add('active-diff');
                setFeedback('empty', '难度已选 ' + diff, '·');
                btnStart.disabled = !canStart();
                saveSettings();
                updateInfoBar();
            });

            btnStart.addEventListener('click', function() {
                if (state.isRunning) return;
                if (state.correctionMode) {
                    if (state.correctionFinished) {
                        // 如果改错完成且有错题，则开始下一轮
                        const remain = state.correctionQuestions.length;
                        if (remain > 0) {
                            startNextCorrectionRound();
                        } else {
                            setFeedback('empty', '没有错题需要改正', '!');
                        }
                        return;
                    }
                    if (state.correctionQuestions.length === 0) {
                        setFeedback('empty', '没有错题需要改正', '!');
                        return;
                    }
                    if (state.isPaused || state.correctionPaused) {
                        continueCorrection();
                    } else {
                        // 首次开始改错（从主界面进入改错，但改错模式只能由练习结束触发）
                        // 这里不会发生，但保留
                        startCorrectionFromPractice();
                    }
                    return;
                }
                if (state.hasCache) {
                    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                    state.hasCache = false;
                }
                startPractice();
            });

            btnContinue.addEventListener('click', function() {
                continuePractice();
            });

            btnReset.addEventListener('click', function() {
                if (state.correctionMode) {
                    resetCorrectionFull();
                    return;
                }
                resetAll();
                showButtons('idle');
                btnStart.disabled = !canStart();
                setFeedback('empty', '已回到主界面，请重新设置', '·');
            });

            btnPause.addEventListener('click', function() {
                if (state.isRunning && !state.isFinished) {
                    pausePractice();
                }
            });

            btnErrorCorrect.addEventListener('click', function() {
                if (state.correctionMode) {
                    // 如果改错完成且有错题，点击改错按钮开始下一轮
                    if (state.correctionFinished && state.correctionQuestions.length > 0) {
                        startNextCorrectionRound();
                        return;
                    }
                    return;
                }
                // 从练习结束进入改错
                if (!state.isFinished) {
                    setFeedback('empty', '请先完成练习', '!');
                    return;
                }
                const wrongs = getWrongCount();
                if (wrongs === 0) {
                    setFeedback('correct', '没有错题，太棒了！', '*');
                    return;
                }
                startCorrectionFromPractice();
            });

            numberBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const digit = this.dataset.digit;
                    if (digit !== undefined) inputDigit(digit);
                });
            });

            clearBtn.addEventListener('click', clearInput);
            submitBtn.addEventListener('click', handleSubmit);

            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                const key = e.key;
                if (key >= '0' && key <= '9') { e.preventDefault();
                    inputDigit(key); } else if (key === 'Enter') { e.preventDefault(); if (!submitBtn.disabled)
                        submitBtn.click(); } else if (key === 'Backspace' || key === 'Delete') { e.preventDefault();
                    clearInput(); }
            });

            // ===== 星星背景 =====
            function initStars() {
                const container = document.getElementById('starsBg');
                const chars = ['*', '·', '✧', '✦', '•'];
                for (let i = 0; i < 16; i++) {
                    const span = document.createElement('span');
                    span.textContent = chars[i % chars.length];
                    span.style.left = Math.random() * 100 + '%';
                    span.style.fontSize = (14 + Math.random() * 22) + 'px';
                    span.style.animationDuration = (18 + Math.random() * 28) + 's';
                    span.style.animationDelay = (Math.random() * 22) + 's';
                    container.appendChild(span);
                }
            }
            initStars();

            // ===== 初始化 =====
            function init() {
                loadSettings();
                if (!localStorage.getItem(SETTINGS_KEY)) {
                    state.mode = null;
                    state.selectedTime = null;
                    state.selectedQuantity = null;
                    state.selectedOps = [];
                    state.selectedDiff = null;
                    syncSettingsUI();
                }
                const q = generateQuestion(['add'], 10);
                if (q) { state.currentQuestion = q;
                    renderQuestion(); } else renderQuestion();
                renderInput();
                updateInfoBar();
                const loaded = loadState();
                if (!loaded) {
                    state.hasCache = false;
                    setFeedback('empty', '请选择模式、运算、参数和难度后开始', '·');
                    disableAllControls();
                    progressText.classList.add('hidden');
                    correctionProgressText.classList.add('hidden');
                    wrongHint.classList.add('hidden');
                    timerDisplay.textContent = '00:00';
                    progressTotal.textContent = state.totalQuestions;
                    resultPanel.classList.remove('show');
                    showButtons('idle');
                    btnStart.disabled = !canStart();
                }
            }
            init();

        })();
    </script>
</body>
</html>
